<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="LIFTS"/>
<title>LIFTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F2;--bg2:#F1EFE8;--bg3:#E8E6DE;
  --ink:#1A1A2E;--ink2:#2C2C2A;--muted:#888780;--dim:#B4B2A9;
  --line:#D8D6CC;--white:#FFFFFF;
  --acc:#E8FF3A;--acc2:#FF4D1F;--ok:#1F8A5B;
  --fd:'Anton','Impact',sans-serif;
  --fb:'Sora',system-ui,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#root{height:100%}
.app{width:100%;min-height:100vh;max-width:430px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}
.scroll::-webkit-scrollbar{display:none}
.body{padding-top:16px}

/* TOPBAR */
.tb{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.tb-sub{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:500;font-family:var(--fm)}
.tb-name{font-family:var(--fd);font-size:26px;letter-spacing:.02em;line-height:1;margin-top:2px;color:var(--ink)}
.av{width:36px;height:36px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--fd);font-size:15px;color:var(--muted);cursor:pointer;flex-shrink:0}

/* TAPE */
.tape{font-family:var(--fd);letter-spacing:.08em;font-size:10px;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:10px;margin:16px 20px 8px}
.tape::after{content:"";flex:1;height:4px;background-image:repeating-linear-gradient(-45deg,var(--line) 0 3px,transparent 3px 6px)}

/* CARDS */
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.card-ink{background:var(--ink);color:var(--white);border:none}
.card-acc{background:var(--acc);color:var(--ink);border:none}
.D{font-family:var(--fd);letter-spacing:.01em;line-height:.9}
.M{font-family:var(--fm)}
.L{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--fm)}

/* PROGRESS */
.pb{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.pf{height:100%;background:var(--ink);border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.2,1);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,0) 0 4px,rgba(255,255,255,.15) 4px 8px)}

/* BUTTONS */
.btn{border:none;font-family:var(--fd);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:transform .12s;display:flex;align-items:center;justify-content:space-between}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--ink);color:var(--acc);padding:14px 18px;border-radius:13px;font-size:17px;width:100%}
.btn-p .ar{width:30px;height:30px;background:var(--acc);color:var(--ink);border-radius:50%;display:grid;place-items:center;font-size:14px}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--muted);padding:12px 18px;border-radius:13px;font-size:13px;width:100%;justify-content:center}

/* NAV */
.nav{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.nt{flex:1;border:none;background:transparent;color:var(--muted);padding:9px 0;font-family:var(--fb);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s}
.nt.on{background:var(--ink);color:var(--acc)}
.nt .ic{font-size:14px}

/* CALENDAR */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 20px}
.cd-h{font-family:var(--fm);font-size:9px;color:var(--muted);text-align:center;letter-spacing:.08em}
.cd{aspect-ratio:1;border-radius:7px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:11px;color:var(--muted);position:relative;cursor:pointer;transition:transform .1s}
.cd:active{transform:scale(.9)}
.cd.done{background:var(--ink);color:var(--acc);border-color:var(--ink);font-weight:700}
.cd.today{border:2px solid var(--ink);color:var(--ink);font-weight:600}
.cd.rest{opacity:.35}
.cd.future{opacity:.22}
.cd.missed::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:2px;background:var(--acc2)}

/* EXERCISE */
.ex-row{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:8px;display:flex;flex-direction:column;gap:9px}
.ex-n{font-family:var(--fd);font-size:17px;letter-spacing:.02em;line-height:1;color:var(--ink)}
.ex-m{font-family:var(--fm);font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.06em}
.sh{display:grid;grid-template-columns:22px 1fr 1fr 1fr 30px;gap:5px}
.ch{text-align:center;font-family:var(--fm);font-size:8px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.sr{display:grid;grid-template-columns:22px 1fr 1fr 1fr 30px;gap:5px;align-items:center}
.sn{font-family:var(--fd);font-size:14px;color:var(--dim)}
.inp{background:var(--bg2);border:1px solid var(--line);color:var(--ink);font-family:var(--fm);font-size:14px;font-weight:500;padding:8px 3px;border-radius:9px;text-align:center;width:100%;outline:none;transition:border-color .15s;-moz-appearance:textfield}
.inp::-webkit-outer-spin-button,.inp::-webkit-inner-spin-button{-webkit-appearance:none}
.inp:focus{border-color:var(--ink)}
.inp.done{background:rgba(26,26,46,.06);border-color:var(--ink);color:var(--ink);font-weight:700}
.chk{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg2);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:12px;transition:all .15s;flex-shrink:0}
.chk.done{background:var(--ink);color:var(--acc);border-color:var(--ink)}
.chk:disabled{opacity:.35;cursor:default}

/* DAY PILLS */
.dp{flex:0 0 auto;padding:7px 12px;background:var(--white);color:var(--muted);border:1px solid var(--line);border-radius:9px;font-family:var(--fd);font-size:11px;letter-spacing:.06em;cursor:pointer;position:relative;transition:all .15s}
.dp.on{background:var(--ink);color:var(--acc);border-color:var(--ink)}
.dp .dot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--acc2)}

/* TIMER */
.timer-b{position:fixed;top:16px;right:16px;background:var(--ink);color:var(--acc);border-radius:999px;padding:8px 16px;font-family:var(--fd);font-size:18px;letter-spacing:.04em;z-index:50}

/* ONBOARDING */
.onb{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;padding:40px 24px 60px;max-width:430px;margin:0 auto}
.onb h1{font-family:var(--fd);font-size:48px;line-height:.9;letter-spacing:.01em;color:var(--ink);margin:14px 0 10px}
.onb h1 .a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:6px;text-decoration-thickness:4px}
.onb .lead{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:22px}
.onb label{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.onb label span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--fm)}
.onb input,.onb select{background:var(--white);border:1px solid var(--line);color:var(--ink);font-family:var(--fb);font-size:16px;padding:12px 14px;border-radius:10px;width:100%;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
.onb input:focus,.onb select:focus{border-color:var(--ink)}
.onb .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dots{display:flex;gap:6px;margin-bottom:22px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s}
.dots span.on{width:18px;border-radius:3px;background:var(--ink)}
.dtog-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.dtog{padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--white);color:var(--muted);font-family:var(--fd);font-size:13px;letter-spacing:.06em;cursor:pointer;transition:all .15s}
.dtog.on{background:var(--ink);color:var(--acc);border-color:var(--ink)}
.tpl-box{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:16px}
.add-ex{width:100%;padding:10px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font-family:var(--fm);font-size:12px;letter-spacing:.08em;cursor:pointer;margin-top:6px;transition:border-color .15s}
.add-ex:hover{border-color:var(--ink);color:var(--ink)}
.ee{background:var(--bg2);border-radius:10px;padding:10px;margin-bottom:8px}
.ee-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.ee-row input{background:var(--white);border:1px solid var(--line);color:var(--ink);font-family:var(--fm);font-size:12px;padding:7px 10px;border-radius:7px;width:100%;outline:none}
.ee-row input:focus{border-color:var(--ink)}
.rm{background:transparent;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.rm:hover{color:var(--acc2)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end}
.modal{background:var(--white);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:24px 22px 40px;width:100%;max-width:430px;margin:0 auto}
.modal-inp{background:var(--bg2);border:1px solid var(--line);color:var(--ink);font-family:var(--fb);font-size:15px;padding:10px 12px;border-radius:10px;width:100%;outline:none}
.modal-inp:focus{border-color:var(--ink)}

/* LOGO */
.logo{display:inline-flex;align-items:center;gap:8px}
.logo svg{width:24px;height:24px}
.logo span{font-family:var(--fd);font-size:20px;letter-spacing:.08em;color:var(--ink)}

/* WEEK STRIP */
.wday{flex:0 0 auto;background:var(--bg2);border:1.5px solid var(--line);border-radius:9px;padding:6px 3px;text-align:center}
.wday.wt{background:var(--ink);border-color:var(--ink)}
.wday.wd{background:rgba(26,26,46,.06);border-color:rgba(26,26,46,.18)}

@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fu .25s ease both}

/* MUVIT V2 */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px;margin-bottom:10px}
.mini-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:13px}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 20px}
.qbtn{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 8px;font-family:var(--fb);font-weight:600;font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.qbtn:active{transform:scale(.97)}
.qbtn .em{font-size:22px}
.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 20px}
.week-cell{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:8px 3px;text-align:center;min-height:62px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.week-cell.on{background:var(--ink);color:var(--acc);border-color:var(--ink)}
.week-cell.today{border:2px solid var(--ink)}
.week-day{font-family:var(--fm);font-size:8px;color:var(--muted)}
.week-cell.on .week-day{color:rgba(232,255,58,.75)}
.week-emoji{font-size:19px;line-height:1}.week-num{font-family:var(--fd);font-size:11px}
.month-cell{aspect-ratio:1;border-radius:9px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fm);font-size:10px;color:var(--muted);gap:2px;position:relative}
.month-cell.today{border:2px solid var(--ink);color:var(--ink)}
.month-cell.active{background:var(--white);color:var(--ink)}
.month-emoji{font-size:13px;line-height:1;min-height:14px}
.pill-row{display:flex;gap:6px;overflow-x:auto;padding:0 20px 8px}
.pill{flex:0 0 auto;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-family:var(--fm);font-size:10px;color:var(--muted)}
.pill strong{font-family:var(--fd);font-size:14px;color:var(--ink);margin-right:4px}
.slink{background:transparent;border:none;color:var(--muted);font-family:var(--fm);font-size:10px;text-decoration:underline;cursor:pointer}
.note-box{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;font-family:var(--fm);font-size:10px;color:var(--muted);line-height:1.45}
.small-btn{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink);font-family:var(--fm);font-size:10px;cursor:pointer}
.small-btn.danger{color:var(--acc2)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-family:var(--fm);font-size:9px;color:var(--muted)}
.date-inp{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--fm);font-size:13px;color:var(--ink);width:100%}

</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;

const dk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const now=()=>new Date();
const todayISO=()=>dk(now());
const iso2d=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);};
const gid=()=>'x'+Math.random().toString(36).slice(2,9);
const DOWS=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MTHS=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
const fmtSub=d=>{const ds=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],ms=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return`${ds[d.getDay()]} · ${String(d.getDate()).padStart(2,'0')} ${ms[d.getMonth()]}`;};
const fmtMo=d=>`${MTHS[d.getMonth()]} ${d.getFullYear()}`;
function mDays(y,m){const l=new Date(y,m+1,0).getDate(),a=[];for(let d=1;d<=l;d++){const dt=new Date(y,m,d);a.push({day:d,dow:dt.getDay(),iso:dk(dt),date:dt});}return a;}
const KEY='muvit_v2';
const OLD_KEY='lifts_v1';
const ACTS={gym:{label:'Gym',emoji:'🏋️'},pilates:{label:'Pilates',emoji:'🧘‍♀️'},yoga:{label:'Yoga',emoji:'🧘'},running:{label:'Running',emoji:'🏃'},walk:{label:'Caminata',emoji:'🚶'},other:{label:'Otro',emoji:'✨'}};
const ACT_ORDER=['gym','pilates','yoga','running','walk','other'];

const TPL={
  1:{focus:'GLÚTEOS · POSTERIOR',exercises:[{id:gid(),name:'Hip thrust',muscle:'Glúteo',target:'10–12 reps'},{id:gid(),name:'Curl femoral',muscle:'Femoral',target:'12 reps'},{id:gid(),name:'Peso muerto rumano',muscle:'Posterior',target:'8–10 reps'},{id:gid(),name:'Abductores en máquina',muscle:'Glúteo medio',target:'15 reps'}]},
  2:{focus:'BRAZOS · HOMBRO',exercises:[{id:gid(),name:'Tríceps polea',muscle:'Tríceps',target:'12 reps'},{id:gid(),name:'Pull down',muscle:'Espalda',target:'10–12 reps'},{id:gid(),name:'Curl bíceps',muscle:'Bíceps',target:'10–12 reps'},{id:gid(),name:'Elevaciones laterales',muscle:'Hombro',target:'12–15 reps'}]},
  3:{focus:'DESCANSO',exercises:[]},
  4:{focus:'CUÁDRICEPS · GLÚTEO',exercises:[{id:gid(),name:'Prensa',muscle:'Cuádriceps',target:'10–12 reps'},{id:gid(),name:'Sentadilla en Smith',muscle:'Pierna',target:'8–10 reps'},{id:gid(),name:'Extensión cuádriceps',muscle:'Cuádriceps',target:'12–15 reps'},{id:gid(),name:'Abductores en máquina',muscle:'Glúteo medio',target:'15 reps'}]},
  5:{focus:'CORE · CARDIO',exercises:[{id:gid(),name:'Plank',muscle:'Core',target:'45–60 seg'},{id:gid(),name:'Crunch polea',muscle:'Abdomen',target:'15–20 reps'},{id:gid(),name:'Cardio (cinta/escalera)',muscle:'Cardio',target:'20 min'}]},
  6:{focus:'FULL PIERNAS',exercises:[{id:gid(),name:'Hip thrust pesado',muscle:'Glúteo',target:'8 reps'},{id:gid(),name:'Sentadilla en Smith',muscle:'Pierna',target:'8 reps'},{id:gid(),name:'Peso muerto rumano',muscle:'Posterior',target:'8 reps'},{id:gid(),name:'Prensa',muscle:'Cuádriceps',target:'12–15 reps'}]},
  0:{focus:'DESCANSO',exercises:[]},
};
const blank=()=>({onboarded:false,user:{name:'',weightKg:null,heightCm:null,bodyFatPct:null,goal:'Retomar constancia',monthlyGoalGym:12,monthlyGoalMove:20,stages:[]},routine:{},sessions:{},notes:{}});
function normalizeRoutine(r){const out={};for(const d of[0,1,2,3,4,5,6]){out[d]=r&&r[d]?{focus:r[d].focus||'ENTRENAMIENTO',exercises:(r[d].exercises||[]).map(e=>({...e,id:e.id||gid()}))}:{focus:'DESCANSO',exercises:[]};}return out;}
function migrate(old){const b=blank();const u=old.user||{};b.onboarded=!!old.onboarded;b.user={...b.user,name:u.name||'',weightKg:u.weightKg||null,heightCm:u.heightCm||null,bodyFatPct:u.bodyFatPct||null,goal:u.goal||'Retomar constancia',monthlyGoalGym:u.monthlyGoalGym||u.monthlyGoal||12,monthlyGoalMove:u.monthlyGoalMove||u.monthlyGoal||20,stages:u.stages||[{id:gid(),goal:u.goal||'Retomar constancia',start:todayISO()}]};b.routine=normalizeRoutine(old.routine||{});b.sessions={};for(const[iso,val]of Object.entries(old.sessions||{})){if(val&&val.gym){b.sessions[iso]=val;continue;}const gym={sets:{},omitted:[],extras:[]};for(const[k,v]of Object.entries(val||{}))if(Array.isArray(v))gym.sets[k]=v;b.sessions[iso]={gym,activities:Object.keys(gym.sets).length?[{id:gid(),type:'gym',ts:Date.now()}]:[]};}return b;}
const load=()=>{try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r));const o=localStorage.getItem(OLD_KEY);if(o)return migrate(JSON.parse(o));}catch(e){}return blank();};
const persist=s=>{try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}};

function daySession(st,iso){return st.sessions[iso]||{gym:{sets:{},omitted:[],extras:[]},activities:[]};}
function setDay(st,iso,day){return {...st,sessions:{...st.sessions,[iso]:day}};}
function hasGym(st,iso){const d=daySession(st,iso);return !!(d.activities||[]).some(a=>a.type==='gym') || Object.values(d.gym?.sets||{}).some(arr=>Array.isArray(arr)&&arr.some(x=>x&&x.done));}
function dayActivities(st,iso){const d=daySession(st,iso);const acts=[...(d.activities||[])];if(hasGym(st,iso)&&!acts.some(a=>a.type==='gym'))acts.unshift({id:'gym-auto',type:'gym'});return acts;}
function hasMovement(st,iso){return dayActivities(st,iso).length>0;}
function weekRange(base){const d=iso2d(base||todayISO());const diff=d.getDay()===0?-6:1-d.getDay();const start=new Date(d);start.setDate(d.getDate()+diff);return Array.from({length:7},(_,i)=>{const x=new Date(start);x.setDate(start.getDate()+i);return x;});}
function statsForRange(st,start,end){const counts={gym:0,pilates:0,yoga:0,running:0,walk:0,other:0},activeDays=new Set();let total=0,vol=0;for(const[iso,day]of Object.entries(st.sessions||{})){const d=iso2d(iso);if(d<start||d>end)continue;const acts=dayActivities(st,iso);if(acts.length)activeDays.add(iso);for(const a of acts){counts[a.type]=(counts[a.type]||0)+1;total++;}for(const arr of Object.values(day.gym?.sets||{}))if(Array.isArray(arr))for(const s of arr)if(s&&s.done&&s.weight&&s.reps)vol+=Number(s.weight)*Number(s.reps);}return{counts,total,activeDays:activeDays.size,vol};}
function moStats(st,td=now()){const start=new Date(td.getFullYear(),td.getMonth(),1),end=new Date(td.getFullYear(),td.getMonth()+1,0);return statsForRange(st,start,end);}
function calcStreak(st,td=now()){let s=0;const d=new Date(td);for(let i=0;i<120;i++){const iso=dk(d);if(hasMovement(st,iso))s++;else if(iso===todayISO()){}else break;d.setDate(d.getDate()-1);}return s;}
function ensureGym(day){return {...day,gym:{sets:{...(day.gym?.sets||{})},omitted:[...(day.gym?.omitted||[])],extras:[...(day.gym?.extras||[])]},activities:[...(day.activities||[])]};}
function markActivity(setSt,iso,type){setSt(s=>{let day=ensureGym(daySession(s,iso));if(type==='gym'){if(!day.activities.some(a=>a.type==='gym'))day.activities.unshift({id:gid(),type,ts:Date.now()});}else{day.activities=day.activities.filter(a=>a.type!==type);day.activities.push({id:gid(),type,ts:Date.now()});}return setDay(s,iso,day);});}
function removeActivity(setSt,iso,type){setSt(s=>{let day=ensureGym(daySession(s,iso));day.activities=day.activities.filter(a=>a.type!==type);return setDay(s,iso,day);});}
function findExerciseName(st,id){for(const d of Object.values(st.routine||{}))for(const ex of(d.exercises||[]))if(ex.id===id)return ex.name;for(const day of Object.values(st.sessions||{}))for(const ex of(day.gym?.extras||[]))if(ex.id===id)return ex.name;return id;}
function lastForExercise(st,ex,beforeISO){const name=(ex.name||'').toLowerCase().trim();let last=null,best=null;for(const[iso,day]of Object.entries(st.sessions||{})){if(iso>=beforeISO)continue;const arr=(day.gym?.sets||{})[ex.id]||[];let used=arr;if(!used.length&&name){for(const[id,a]of Object.entries(day.gym?.sets||{})){if((findExerciseName(st,id)||'').toLowerCase().trim()===name){used=a;break;}}}for(const s of used||[])if(s&&s.done){const rec={iso,weight:Number(s.weight)||0,reps:Number(s.reps)||0};if(!last||iso>last.iso)last=rec;if(!best||rec.weight>best.weight)best=rec;}}return{last,best};}

function Tape({children}){return <div className="tape">{children}</div>}
function Nav({active,onChange}){const tabs=[{id:'home',l:'HOY',ic:'▣'},{id:'calendar',l:'MES',ic:'▦'},{id:'workout',l:'GYM',ic:'◉'},{id:'stats',l:'STATS',ic:'◢'}];return <nav className="nav">{tabs.map(t=><button key={t.id} className={`nt${active===t.id?' on':''}`} onClick={()=>onChange(t.id)}><span className="ic">{t.ic}</span><span>{t.l}</span></button>)}</nav>}

function Onboarding({onDone}){
 const [step,setStep]=useState(0);const [u,setU]=useState({name:'',weightKg:'',heightCm:'',bodyFatPct:'',goal:'Retomar constancia',monthlyGoalGym:12,monthlyGoalMove:20});const [tDays,setTDays]=useState([1,2,4,5,6]);const [rtn,setRtn]=useState({});const [editDow,setEditDow]=useState(null);const DL=[{d:1,l:'LUN'},{d:2,l:'MAR'},{d:3,l:'MIÉ'},{d:4,l:'JUE'},{d:5,l:'VIE'},{d:6,l:'SÁB'},{d:0,l:'DOM'}];
 const tog=d=>setTDays(p=>p.includes(d)?p.filter(x=>x!==d):[...p,d]);
 const buildTpl=()=>{const r={},src=[1,2,4,5,6,0,3].filter(d=>TPL[d]&&TPL[d].exercises.length>0);let i=0;for(const dow of [...tDays].sort()){const s=TPL[src[i%src.length]];r[dow]={focus:s.focus,exercises:s.exercises.map(e=>({...e,id:gid()}))};i++;}for(const d of[0,1,2,3,4,5,6])if(!r[d])r[d]={focus:'DESCANSO',exercises:[]};setRtn(r);setStep(3);};
 const buildBlank=()=>{const r={};for(const d of tDays)r[d]={focus:'ENTRENAMIENTO',exercises:[]};for(const d of[0,1,2,3,4,5,6])if(!r[d])r[d]={focus:'DESCANSO',exercises:[]};setRtn(r);setStep(3);};
 const addEx=dow=>setRtn(p=>({...p,[dow]:{...p[dow],exercises:[...(p[dow]?.exercises||[]),{id:gid(),name:'',muscle:'',target:'10–12 reps'}]}}));
 const updEx=(dow,id,f,v)=>setRtn(p=>({...p,[dow]:{...p[dow],exercises:p[dow].exercises.map(e=>e.id===id?{...e,[f]:v}:e)}}));
 const rmEx=(dow,id)=>setRtn(p=>({...p,[dow]:{...p[dow],exercises:p[dow].exercises.filter(e=>e.id!==id)}}));
 const updFocus=(dow,v)=>setRtn(p=>({...p,[dow]:{...p[dow],focus:v}}));
 const finish=()=>onDone({onboarded:true,user:{name:u.name.trim()||'ATLETA',weightKg:parseFloat(u.weightKg)||null,heightCm:parseInt(u.heightCm)||null,bodyFatPct:parseFloat(u.bodyFatPct)||null,goal:u.goal,monthlyGoalGym:parseInt(u.monthlyGoalGym)||12,monthlyGoalMove:parseInt(u.monthlyGoalMove)||20,stages:[{id:gid(),goal:u.goal,start:todayISO()}]},routine:rtn,sessions:{},notes:{}});
 return <div className="onb"><Logo/><div className="dots" style={{marginTop:22}}>{[0,1,2,3].map(i=><span key={i} className={i<=step?'on':''}/>)}</div>
 {step===0&&<div className="fade"><div className="L">PASO 1 DE 4</div><h1>EMPIEZA<br/><span className="a">MUVIT</span></h1><p className="lead">Tu tracker para registrar gym, movimiento y progreso sin complicarte.</p><label><span>Nombre</span><input value={u.name} onChange={e=>setU({...u,name:e.target.value})} placeholder="Tu nombre" autoFocus/></label><div className="row2"><label><span>Peso kg</span><input type="number" value={u.weightKg} onChange={e=>setU({...u,weightKg:e.target.value})} placeholder="Opcional"/></label><label><span>% grasa</span><input type="number" value={u.bodyFatPct} onChange={e=>setU({...u,bodyFatPct:e.target.value})} placeholder="Opcional"/></label></div><label><span>Etapa actual</span><select value={u.goal} onChange={e=>setU({...u,goal:e.target.value})}><option>Retomar constancia</option><option>Bajar grasa</option><option>Ganar músculo</option><option>Ganar fuerza</option><option>Recomposición</option><option>Mantener</option></select></label><div className="row2"><label><span>Gym / mes</span><input type="number" value={u.monthlyGoalGym} onChange={e=>setU({...u,monthlyGoalGym:e.target.value})}/></label><label><span>Mov. / mes</span><input type="number" value={u.monthlyGoalMove} onChange={e=>setU({...u,monthlyGoalMove:e.target.value})}/></label></div><button className="btn btn-p" disabled={!u.name.trim()} style={{opacity:u.name.trim()?1:.4,marginTop:18}} onClick={()=>setStep(1)}><span>SIGUIENTE</span><span className="ar">→</span></button></div>}
 {step===1&&<div className="fade"><div className="L">PASO 2 DE 4</div><h1>DÍAS DE<br/><span className="a">GYM</span></h1><p className="lead">Elige tus días base. Luego podrás editarlos cuando cambies de rutina.</p><div className="dtog-wrap">{DL.map(d=><button key={d.d} className={`dtog${tDays.includes(d.d)?' on':''}`} onClick={()=>tog(d.d)}>{d.l}</button>)}</div><div style={{display:'flex',gap:10}}><button className="btn btn-g" style={{flex:1}} onClick={()=>setStep(0)}>← ATRÁS</button><button className="btn btn-p" disabled={!tDays.length} style={{opacity:tDays.length?1:.4,flex:2}} onClick={()=>setStep(2)}><span>SIGUIENTE</span><span className="ar">→</span></button></div></div>}
 {step===2&&<div className="fade"><div className="L">PASO 3 DE 4</div><h1>TU<br/><span className="a">RUTINA</span></h1><p className="lead">Empieza con plantilla o arma tu base desde cero.</p><button className="btn btn-p" onClick={buildTpl}><span>USAR PLANTILLA</span><span className="ar">✦</span></button><button className="btn btn-g" style={{marginTop:10}} onClick={buildBlank}>CREAR DESDE CERO</button><button className="btn btn-g" style={{marginTop:8,borderColor:'transparent'}} onClick={()=>setStep(1)}>← ATRÁS</button></div>}
 {step===3&&<RoutineEditorContent rtn={rtn} setRtn={setRtn} editDow={editDow} setEditDow={setEditDow} addEx={addEx} updEx={updEx} rmEx={rmEx} updFocus={updFocus} footer={<div style={{display:'flex',gap:10,marginTop:18}}><button className="btn btn-g" style={{flex:1}} onClick={()=>setStep(2)}>← ATRÁS</button><button className="btn btn-p" style={{flex:2}} onClick={finish}><span>¡EMPEZAR!</span><span className="ar">✓</span></button></div>}/>}
 </div>;
}
function RoutineEditorContent({rtn,setRtn,editDow,setEditDow,addEx,updEx,rmEx,updFocus,footer}){return <div className="fade"><div className="L">EDITAR RUTINA</div><h1>RUTINA<br/><span className="a">BASE</span></h1><p className="lead">Marca descanso dejando el día sin ejercicios. Puedes cambiar esto cuando quieras.</p>{[1,2,3,4,5,6,0].map(dow=>{const day=rtn[dow]||{focus:'DESCANSO',exercises:[]},isR=day.exercises.length===0,isO=editDow===dow;return <div key={dow} style={{marginBottom:8,background:isO?'var(--bg2)':'var(--white)',border:'1px solid var(--line)',borderRadius:13,overflow:'hidden'}}><div onClick={()=>setEditDow(isO?null:dow)} style={{padding:'12px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}}><div><div className="D" style={{fontSize:17,letterSpacing:'.06em',color:'var(--ink)'}}>{DOWS[dow]}</div><div className="M" style={{fontSize:10,color:'var(--muted)',marginTop:2}}>{isR?'Descanso':`${day.exercises.length} ejercicios · ${day.focus}`}</div></div><div style={{color:'var(--dim)',fontSize:16,fontFamily:'var(--fm)'}}>{isO?'−':'+'}</div></div>{isO&&<div style={{padding:'0 14px 14px',borderTop:'1px solid var(--line)'}}><div style={{display:'flex',gap:8,margin:'10px 0'}}><button className="small-btn" onClick={()=>{setRtn(p=>({...p,[dow]:{focus:'ENTRENAMIENTO',exercises:p[dow]?.exercises?.length?p[dow].exercises:[{id:gid(),name:'',muscle:'',target:'10–12 reps'}]}}))}}>Día de gym</button><button className="small-btn danger" onClick={()=>setRtn(p=>({...p,[dow]:{focus:'DESCANSO',exercises:[]}}))}>Descanso</button></div>{!isR&&<><div style={{marginBottom:10}}><div className="L" style={{marginBottom:4}}>FOCO</div><input value={day.focus} onChange={e=>updFocus(dow,e.target.value)} style={{background:'var(--white)',border:'1px solid var(--line)',color:'var(--ink)',fontFamily:'var(--fm)',fontSize:13,padding:'8px 10px',borderRadius:8,width:'100%',outline:'none'}}/></div>{day.exercises.map(ex=><div key={ex.id} className="ee"><div style={{display:'flex',alignItems:'center',gap:8}}><input value={ex.name} onChange={e=>updEx(dow,ex.id,'name',e.target.value)} placeholder="Ejercicio" style={{flex:1,background:'var(--white)',border:'1px solid var(--line)',color:'var(--ink)',fontFamily:'var(--fb)',fontSize:14,padding:'8px 10px',borderRadius:7,outline:'none'}}/><button className="rm" onClick={()=>rmEx(dow,ex.id)}>×</button></div><div className="ee-row"><input value={ex.muscle} onChange={e=>updEx(dow,ex.id,'muscle',e.target.value)} placeholder="Músculo"/><input value={ex.target} onChange={e=>updEx(dow,ex.id,'target',e.target.value)} placeholder="10–12 reps"/></div></div>)}<button className="add-ex" onClick={()=>addEx(dow)}>+ AGREGAR EJERCICIO</button></>}</div>}</div>})}{footer}</div>}

function Home({st,setSt,onStart,onAv}){
 const td=now(),iso=todayISO(),dow=td.getDay(),rtn=st.routine[dow]||{focus:'DESCANSO',exercises:[]},week=weekRange(iso),wStats=statsForRange(st,week[0],week[6]),mStats=moStats(st,td);const weekGoal=Math.max(1,Math.round((st.user.monthlyGoalMove||20)/4));const pct=Math.min(100,Math.round((wStats.total/weekGoal)*100));
 return <div className="body"><TB user={st.user} onAv={onAv}/><div style={{padding:'0 20px',marginBottom:12}}><div className="card card-ink" style={{padding:'18px'}}><div className="L" style={{color:'rgba(255,255,255,.45)'}}>HOY</div><div className="D" style={{fontSize:30,color:'var(--white)',marginTop:6,lineHeight:1}}>{rtn.exercises.length?`TOCA ${rtn.focus}`:'SIN GYM PROGRAMADO'}</div><div className="M" style={{fontSize:11,color:'rgba(255,255,255,.55)',marginTop:9}}>{hasMovement(st,iso)?'Ya registraste movimiento hoy.':'Registra algo, aunque sea simple.'}</div><button className="btn btn-p" style={{marginTop:14,background:'var(--acc)',color:'var(--ink)'}} onClick={()=>onStart(iso)}><span>{rtn.exercises.length?'EMPEZAR GYM':'ABRIR GYM'}</span><span className="ar" style={{background:'var(--ink)',color:'var(--acc)'}}>→</span></button></div></div><div className="kpi-grid"><div className="mini-card"><div className="L">SEMANA</div><div className="D" style={{fontSize:36,marginTop:4}}>{wStats.total}<span style={{fontSize:17,color:'var(--muted)'}}>/{weekGoal}</span></div><div className="pb" style={{height:6,marginTop:7}}><div className="pf" style={{width:`${pct}%`}}/></div></div><div className="mini-card"><div className="L">MES</div><div className="D" style={{fontSize:36,marginTop:4}}>{mStats.total}<span style={{fontSize:17,color:'var(--muted)'}}>/{st.user.monthlyGoalMove||20}</span></div><div className="M" style={{fontSize:9,color:'var(--muted)'}}>movimientos</div></div></div><Tape>SEMANA EN MOVIMIENTO</Tape><div className="week-row">{week.map(d=>{const k=dk(d),acts=dayActivities(st,k),main=acts[0],isT=k===iso;return <div key={k} className={`week-cell${acts.length?' on':''}${isT?' today':''}`}><div className="week-day">{DOWS[d.getDay()]}</div><div className="week-emoji">{main?ACTS[main.type]?.emoji:'○'}</div><div className="week-num">{d.getDate()}</div></div>})}</div><Tape>REGISTRO RÁPIDO</Tape><div className="quick-grid">{ACT_ORDER.map(type=><button key={type} className="qbtn" onClick={()=> type==='gym'?onStart(iso):markActivity(setSt,iso,type)}><span className="em">{ACTS[type].emoji}</span><span>{type==='gym'?'Gym':ACTS[type].label}</span></button>)}</div><Tape>ÚLTIMO AVANCE</Tape><div style={{padding:'0 20px'}}><div className="note-box">{mStats.total===0?'Empieza registrando tu primer movimiento. MUVIT se vuelve útil cuando acumulas evidencia.':`Este mes llevas ${mStats.total} movimientos. Gym: ${mStats.counts.gym||0}, Pilates: ${mStats.counts.pilates||0}, Caminata: ${mStats.counts.walk||0}.`}</div></div></div>;
}

function Calendar({st,setSt,onAv}){const td=now(),stats=moStats(st,td),days=mDays(td.getFullYear(),td.getMonth()),first=days[0].dow;const [logIso,setLogIso]=useState(null);return <div className="body"><TB user={st.user} sub={fmtMo(td)} onAv={onAv}/><div style={{padding:'0 20px',marginBottom:10}}><div className="card card-ink" style={{padding:'16px 18px'}}><div className="L" style={{color:'rgba(255,255,255,.45)'}}>MOVIMIENTOS DEL MES</div><div className="D" style={{fontSize:58,color:'var(--acc)',marginTop:2}}>{stats.total}<span style={{fontSize:25,color:'rgba(255,255,255,.35)'}}>/{st.user.monthlyGoalMove||20}</span></div><div className="M" style={{fontSize:11,color:'rgba(255,255,255,.55)'}}>{stats.activeDays} días activos · {stats.counts.gym||0} gym</div></div></div><div className="pill-row">{ACT_ORDER.map(t=><div key={t} className="pill"><strong>{stats.counts[t]||0}</strong>{ACTS[t].emoji} {ACTS[t].label}</div>)}</div><Tape>CALENDARIO</Tape><div className="cg" style={{marginBottom:5}}>{['D','L','M','M','J','V','S'].map((d,i)=><div key={i} className="cd-h">{d}</div>)}</div><div className="cg">{Array.from({length:first}).map((_,i)=><div key={'b'+i}/>)}{days.map(d=>{const acts=dayActivities(st,d.iso),main=acts[0],isT=d.iso===todayISO();return <div key={d.iso} className={`month-cell${acts.length?' active':''}${isT?' today':''}`} onClick={()=>setLogIso(d.iso)}><div>{d.day}</div><div className="month-emoji">{main?ACTS[main.type]?.emoji:''}{acts.length>1?`+${acts.length-1}`:''}</div></div>})}</div><div style={{padding:'16px 20px 0'}}><button className="btn btn-p" onClick={()=>setLogIso(todayISO())}><span>REGISTRAR OTRO DÍA</span><span className="ar">+</span></button></div>{logIso&&<ActivityModal iso={logIso} setIso={setLogIso} st={st} setSt={setSt} onClose={()=>setLogIso(null)}/>}</div>}
function ActivityModal({iso,setIso,st,setSt,onClose}){const acts=dayActivities(st,iso);return <div className="modal-bg" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><div><div className="D" style={{fontSize:22}}>REGISTRAR</div><div className="M" style={{fontSize:10,color:'var(--muted)'}}>{iso}</div></div><button onClick={onClose} style={{background:'transparent',border:'none',color:'var(--muted)',fontSize:20}}>✕</button></div><label style={{display:'flex',flexDirection:'column',gap:5,marginBottom:14}}><span className="L">FECHA</span><input className="date-inp" type="date" value={iso} onChange={e=>setIso(e.target.value)}/></label><div className="quick-grid" style={{padding:0}}>{ACT_ORDER.map(type=>{const on=acts.some(a=>a.type===type);return <button key={type} className="qbtn" style={{background:on?'var(--ink)':'var(--white)',color:on?'var(--acc)':'var(--ink)'}} onClick={()=>on?removeActivity(setSt,iso,type):markActivity(setSt,iso,type)}><span className="em">{ACTS[type].emoji}</span><span>{ACTS[type].label}</span></button>})}</div><button className="btn btn-p" style={{marginTop:18}} onClick={onClose}><span>LISTO</span><span className="ar">✓</span></button></div></div>}

function Workout({st,setSt,onAv,activeDate,setActiveDate}){const [selIso,setSelIso]=useState(activeDate||todayISO());useEffect(()=>{if(activeDate)setSelIso(activeDate)},[activeDate]);const date=iso2d(selIso),dow=date.getDay(),rtn=st.routine[dow]||{focus:'DESCANSO',exercises:[]};const day=ensureGym(daySession(st,selIso));const [timer,setTimer]=useState(null);const [adding,setAdding]=useState(false);useEffect(()=>{if(!timer)return;const t=setInterval(()=>setTimer(r=>r&&r>1?r-1:null),1000);return()=>clearInterval(t)},[timer]);const exs=[...(rtn.exercises||[]),...(day.gym.extras||[])];const getSets=id=>day.gym.sets[id]||[{weight:0,reps:0,rir:null,done:false},{weight:0,reps:0,rir:null,done:false},{weight:0,reps:0,rir:null,done:false}];const saveDay=d=>setSt(s=>setDay(s,selIso,d));const upd=(id,si,f,v)=>{const d=ensureGym(daySession(st,selIso));const cur=d.gym.sets[id]||getSets(id);d.gym.sets[id]=cur.map((x,i)=>i===si?{...x,[f]:v}:x);if(!d.activities.some(a=>a.type==='gym'))d.activities.unshift({id:gid(),type:'gym',ts:Date.now()});saveDay(d)};const tog=(id,si)=>{const was=getSets(id)[si].done;upd(id,si,'done',!was);if(!was)setTimer(90)};const omit=id=>{const d=ensureGym(daySession(st,selIso));d.gym.omitted=d.gym.omitted.includes(id)?d.gym.omitted.filter(x=>x!==id):[...d.gym.omitted,id];saveDay(d)};const addExtra=name=>{const d=ensureGym(daySession(st,selIso));d.gym.extras.push({id:gid(),name:name||'Ejercicio extra',muscle:'Extra',target:'10–12 reps'});if(!d.activities.some(a=>a.type==='gym'))d.activities.unshift({id:gid(),type:'gym',ts:Date.now()});saveDay(d);setAdding(false)};const doneS=exs.reduce((n,ex)=>n+(day.gym.omitted.includes(ex.id)?0:getSets(ex.id).filter(s=>s.done).length),0);const total=exs.filter(ex=>!day.gym.omitted.includes(ex.id)).length*3;const pct=total?Math.round(doneS/total*100):0;return <div className="body">{timer&&<div className="timer-b">{Math.floor(timer/60)}:{String(timer%60).padStart(2,'0')}</div>}<TB user={st.user} sub={`${DOWS[dow]} · ${selIso}`} onAv={onAv}/><div style={{padding:'0 20px 12px'}}><label style={{display:'flex',flexDirection:'column',gap:5}}><span className="L">FECHA DE ENTRENAMIENTO</span><input className="date-inp" type="date" value={selIso} onChange={e=>{setSelIso(e.target.value);setActiveDate(e.target.value)}}/></label></div><div style={{padding:'0 20px',marginBottom:4}}><div className="card card-ink"><div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:10}}><div><div className="L" style={{color:'rgba(255,255,255,.5)'}}>SESIÓN REAL</div><div className="D" style={{fontSize:25,color:'var(--white)',marginTop:2}}>{rtn.focus||'GYM'}</div></div><div className="M" style={{fontSize:20,fontWeight:700,color:'var(--acc)'}}>{pct}%</div></div><div style={{height:5,background:'rgba(255,255,255,.15)',borderRadius:999,overflow:'hidden'}}><div style={{width:`${pct}%`,height:'100%',background:'var(--acc)'}}/></div><div className="M" style={{fontSize:9,color:'rgba(255,255,255,.5)',marginTop:6}}>{doneS}/{total} series · puedes omitir o agregar ejercicios</div></div></div><Tape>EJERCICIOS</Tape><div style={{padding:'0 20px'}}>{exs.length===0&&<div className="card" style={{padding:20,textAlign:'center'}}><div className="D" style={{fontSize:20}}>SIN RUTINA BASE</div><div className="M" style={{fontSize:11,color:'var(--muted)',marginTop:6}}>Agrega ejercicios para registrar esta sesión.</div></div>}{exs.map((ex,i)=><ExCard key={ex.id} ex={ex} num={i+1} sets={getSets(ex.id)} omitted={day.gym.omitted.includes(ex.id)} last={lastForExercise(st,ex,selIso)} onUpd={(si,f,v)=>upd(ex.id,si,f,v)} onTog={si=>tog(ex.id,si)} onOmit={()=>omit(ex.id)}/>) }{adding?<AddExerciseInline onAdd={addExtra} onCancel={()=>setAdding(false)}/>:<button className="btn btn-p" style={{marginTop:8}} onClick={()=>setAdding(true)}><span>AGREGAR EJERCICIO HOY</span><span className="ar">+</span></button>}</div></div>}
function AddExerciseInline({onAdd,onCancel}){const [name,setName]=useState('');return <div className="card" style={{marginTop:8}}><div className="L" style={{marginBottom:6}}>EJERCICIO EXTRA</div><input className="modal-inp" value={name} onChange={e=>setName(e.target.value)} placeholder="Ej. Patada de glúteo"/><div style={{display:'flex',gap:8,marginTop:10}}><button className="small-btn" style={{flex:1}} onClick={onCancel}>Cancelar</button><button className="small-btn" style={{flex:2,background:'var(--ink)',color:'var(--acc)'}} onClick={()=>onAdd(name)}>Agregar</button></div></div>}
function ExCard({ex,num,sets,omitted,last,onUpd,onTog,onOmit}){const [open,setOpen]=useState(!omitted);return <div className="ex-row" style={{opacity:omitted?.55:1}}><div style={{display:'flex',justifyContent:'space-between',gap:8,alignItems:'flex-start'}}><div style={{flex:1,cursor:'pointer'}} onClick={()=>setOpen(!open)}><div style={{display:'flex',alignItems:'center',gap:8}}><div className="D" style={{fontSize:11,color:'var(--dim)',width:18}}>0{num}</div><div className="ex-n">{ex.name.toUpperCase()}</div></div><div className="ex-m">{omitted?'OMITIDO HOY':`${(ex.muscle||'').toUpperCase()} · ${ex.target||''}`}</div></div><button className="small-btn" onClick={onOmit}>{omitted?'hacer':'omitir'}</button></div>{!omitted&&<div className="note-box">Última: {last.last?`${last.last.weight} kg · ${last.last.reps} reps (${last.last.iso})`:'sin registro previo'} · Mejor: {last.best?`${last.best.weight} kg · ${last.best.reps} reps`:'—'}</div>}{open&&!omitted&&<><div className="sh"><div/><div className="ch">KG</div><div className="ch">REPS</div><div className="ch">RIR</div><div/></div>{sets.map((s,i)=><div key={i} className="sr"><div className="sn">{i+1}</div><input type="number" inputMode="decimal" className={`inp${s.done?' done':''}`} value={s.weight||''} placeholder="—" onChange={e=>onUpd(i,'weight',parseFloat(e.target.value)||0)}/><input type="number" inputMode="numeric" className={`inp${s.done?' done':''}`} value={s.reps||''} placeholder="—" onChange={e=>onUpd(i,'reps',parseInt(e.target.value)||0)}/><input type="number" inputMode="numeric" className={`inp${s.done?' done':''}`} value={s.rir!=null?s.rir:''} placeholder="—" min={0} max={4} onChange={e=>onUpd(i,'rir',e.target.value===''?null:parseInt(e.target.value))}/><button className={`chk${s.done?' done':''}`} onClick={()=>onTog(i)}>✓</button></div>)}</>}</div>}

function Stats({st,onAv}){const td=now(),m=moStats(st,td),strk=calcStreak(st,td);const prMap={};for(const[iso,day]of Object.entries(st.sessions||{}))for(const[id,arr]of Object.entries(day.gym?.sets||{}))if(Array.isArray(arr))for(const s of arr)if(s&&s.done&&s.weight){const name=findExerciseName(st,id);if(!prMap[name]||Number(s.weight)>prMap[name].kg)prMap[name]={kg:Number(s.weight),reps:s.reps||0,date:iso,name};}const prs=Object.values(prMap).sort((a,b)=>b.kg-a.kg).slice(0,8);return <div className="body"><TB user={st.user} sub="Tu progreso" onAv={onAv}/><div className="kpi-grid"><div className="mini-card"><div className="L">RACHA</div><div className="D" style={{fontSize:40}}>{strk}<span style={{fontSize:14,color:'var(--muted)'}}> días</span></div><div style={{fontSize:19,marginTop:4}}>{Array.from({length:7}).map((_,i)=>i<Math.min(strk,7)?'🔥':'○').join(' ')}</div></div><div className="mini-card"><div className="L">VOLUMEN MES</div><div className="D" style={{fontSize:40}}>{(m.vol/1000).toFixed(1)}<span style={{fontSize:14,color:'var(--muted)'}}>t</span></div><div className="M" style={{fontSize:9,color:'var(--muted)'}}>{m.vol.toLocaleString()} kg</div></div></div><Tape>DISTRIBUCIÓN</Tape><div className="pill-row">{ACT_ORDER.map(t=><div key={t} className="pill"><strong>{m.counts[t]||0}</strong>{ACTS[t].emoji} {ACTS[t].label}</div>)}</div><Tape>RÉCORDS Y MEJORAS</Tape><div style={{padding:'0 20px'}}>{prs.length===0?<div className="card" style={{padding:18,textAlign:'center'}}><div className="M" style={{fontSize:11,color:'var(--muted)'}}>Completa ejercicios para ver tus marcas.</div></div>:prs.map((pr,i)=><div key={i} className="card" style={{padding:'12px 14px',marginBottom:8,display:'flex',alignItems:'center',justifyContent:'space-between'}}><div><div style={{fontFamily:'var(--fd)',fontSize:14,color:'var(--ink)'}}>{(pr.name||'').toUpperCase().slice(0,24)}</div><div className="M" style={{fontSize:9,color:'var(--muted)',marginTop:2}}>{pr.date} · {pr.reps} reps</div></div><div style={{textAlign:'right'}}><div className="D" style={{fontSize:26}}>{pr.kg}</div><div className="M" style={{fontSize:8,color:'var(--muted)'}}>KG</div></div></div>)}</div></div>}

function ProfileModal({st,setSt,onClose}){const [name,setName]=useState(st.user.name||''),[wt,setWt]=useState(st.user.weightKg||''),[bf,setBf]=useState(st.user.bodyFatPct||''),[goal,setGoal]=useState(st.user.goal||'Retomar constancia'),[mg,setMg]=useState(st.user.monthlyGoalGym||12),[mm,setMm]=useState(st.user.monthlyGoalMove||20),[edit,setEdit]=useState(false);const save=()=>{setSt(s=>{const changed=goal!==s.user.goal;return{...s,user:{...s.user,name:name.trim()||s.user.name,weightKg:parseFloat(wt)||null,bodyFatPct:parseFloat(bf)||null,goal,monthlyGoalGym:parseInt(mg)||12,monthlyGoalMove:parseInt(mm)||20,stages:changed?[...(s.user.stages||[]),{id:gid(),goal,start:todayISO()}]:(s.user.stages||[])}}});onClose()};const iStyle={background:'var(--bg2)',border:'1px solid var(--line)',color:'var(--ink)',fontFamily:'var(--fb)',fontSize:15,padding:'10px 12px',borderRadius:10,width:'100%',outline:'none'};if(edit)return <RoutineEditorModal st={st} setSt={setSt} onBack={()=>setEdit(false)}/>;return <div className="modal-bg" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}><div className="D" style={{fontSize:22}}>PERFIL</div><button onClick={onClose} style={{background:'transparent',border:'none',color:'var(--muted)',fontSize:20}}>✕</button></div><div style={{display:'grid',gap:10}}><label><span className="L">NOMBRE</span><input style={iStyle} value={name} onChange={e=>setName(e.target.value)}/></label><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}><label><span className="L">PESO KG</span><input type="number" style={iStyle} value={wt} onChange={e=>setWt(e.target.value)} placeholder="Opcional"/></label><label><span className="L">% GRASA</span><input type="number" style={iStyle} value={bf} onChange={e=>setBf(e.target.value)} placeholder="Opcional"/></label></div><label><span className="L">ETAPA ACTUAL</span><select style={iStyle} value={goal} onChange={e=>setGoal(e.target.value)}><option>Retomar constancia</option><option>Bajar grasa</option><option>Ganar músculo</option><option>Ganar fuerza</option><option>Recomposición</option><option>Mantener</option></select></label><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}><label><span className="L">GYM / MES</span><input type="number" style={iStyle} value={mg} onChange={e=>setMg(e.target.value)}/></label><label><span className="L">MOV. / MES</span><input type="number" style={iStyle} value={mm} onChange={e=>setMm(e.target.value)}/></label></div></div><button className="btn btn-g" style={{marginTop:14}} onClick={()=>setEdit(true)}>EDITAR RUTINA SEMANAL</button><button className="btn btn-p" style={{marginTop:10}} onClick={save}><span>GUARDAR</span><span className="ar">✓</span></button></div></div>}
function RoutineEditorModal({st,setSt,onBack}){const [rtn,setRtn]=useState(JSON.parse(JSON.stringify(normalizeRoutine(st.routine)))),[editDow,setEditDow]=useState(null);const addEx=dow=>setRtn(p=>({...p,[dow]:{...p[dow],focus:p[dow]?.focus==='DESCANSO'?'ENTRENAMIENTO':p[dow]?.focus,exercises:[...(p[dow]?.exercises||[]),{id:gid(),name:'',muscle:'',target:'10–12 reps'}]}}));const updEx=(dow,id,f,v)=>setRtn(p=>({...p,[dow]:{...p[dow],exercises:p[dow].exercises.map(e=>e.id===id?{...e,[f]:v}:e)}}));const rmEx=(dow,id)=>setRtn(p=>({...p,[dow]:{...p[dow],exercises:p[dow].exercises.filter(e=>e.id!==id)}}));const updFocus=(dow,v)=>setRtn(p=>({...p,[dow]:{...p[dow],focus:v}}));const save=()=>{setSt(s=>({...s,routine:normalizeRoutine(rtn)}));onBack()};return <div className="modal-bg"><div className="modal" style={{maxHeight:'92vh',overflowY:'auto'}}><button className="slink" onClick={onBack}>← volver al perfil</button><RoutineEditorContent rtn={rtn} setRtn={setRtn} editDow={editDow} setEditDow={setEditDow} addEx={addEx} updEx={updEx} rmEx={rmEx} updFocus={updFocus} footer={<button className="btn btn-p" style={{marginTop:18}} onClick={save}><span>GUARDAR RUTINA</span><span className="ar">✓</span></button>}/></div></div>}

function App(){const [st,setSt]=useState(()=>load());const [tab,setTab]=useState('home');const [prof,setProf]=useState(false);const [activeDate,setActiveDate]=useState(todayISO());useEffect(()=>persist(st),[st]);if(!st.onboarded)return <Onboarding onDone={s=>setSt({...blank(),...s,onboarded:true})}/>;let body;if(tab==='home')body=<Home st={st} setSt={setSt} onStart={iso=>{setActiveDate(iso);markActivity(setSt,iso,'gym');setTab('workout')}} onAv={()=>setProf(true)}/>;else if(tab==='calendar')body=<Calendar st={st} setSt={setSt} onAv={()=>setProf(true)}/>;else if(tab==='workout')body=<Workout st={st} setSt={setSt} onAv={()=>setProf(true)} activeDate={activeDate} setActiveDate={setActiveDate}/>;else body=<Stats st={st} onAv={()=>setProf(true)}/>;return <><div className="app"><div className="scroll">{body}</div><Nav active={tab} onChange={setTab}/></div>{prof&&<ProfileModal st={st} setSt={setSt} onClose={()=>setProf(false)}/>}</>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
