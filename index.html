<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="MUVIT"/>
<title>MUVIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F2;--bg2:#F1EFE8;--bg3:#E8E6DE;
  --ink:#1A1A2E;--ink2:#2C2C2A;--muted:#888780;--dim:#B4B2A9;
  --line:#D8D6CC;--white:#FFFFFF;
  --acc:#E8FF3A;--acc2:#FF4D1F;--ok:#1F8A5B;
  --fd:'Anton','Impact',sans-serif;
  --fb:'Sora',system-ui,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#root{height:100%}
.app{width:100%;min-height:100vh;max-width:430px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}
.scroll::-webkit-scrollbar{display:none}
.body{padding-top:16px}

/* TOPBAR */
.tb{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.tb-brand{font-family:var(--fd);font-size:18px;letter-spacing:.12em;color:var(--ink);line-height:1;margin-bottom:6px}
.tb-sub{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600;font-family:var(--fm)}
.tb-name{font-family:var(--fd);font-size:24px;letter-spacing:.02em;line-height:1;margin-top:2px;color:var(--ink)}
.av{width:36px;height:36px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--fd);font-size:15px;color:var(--muted);cursor:pointer;flex-shrink:0}

/* TAPE */
.tape{font-family:var(--fd);letter-spacing:.08em;font-size:10px;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:10px;margin:16px 20px 8px}
.tape::after{content:"";flex:1;height:4px;background-image:repeating-linear-gradient(-45deg,var(--line) 0 3px,transparent 3px 6px)}

/* CARDS */
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.card-ink{background:var(--ink);color:var(--white);border:none}
.card-acc{background:var(--acc);color:var(--ink);border:none}
.D{font-family:var(--fd);letter-spacing:.01em;line-height:.9}
.M{font-family:var(--fm)}
.L{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--fm)}

/* PROGRESS */
.pb{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.pf{height:100%;background:var(--ink);border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.2,1);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,0) 0 4px,rgba(255,255,255,.15) 4px 8px)}

/* BUTTONS */
.btn{border:none;font-family:var(--fd);letter-spacing:.055em;text-transform:uppercase;cursor:pointer;transition:transform .12s,background .15s,color .15s,border-color .15s;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:48px;line-height:1}
.btn:active{transform:scale(.985)}
.btn:disabled{cursor:default}
.btn-p{background:var(--ink);color:var(--acc);padding:15px 18px;border-radius:14px;font-size:16px;width:100%;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.btn-p .ar{background:transparent;color:currentColor;border-radius:0;width:auto;height:auto;display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1;margin-left:2px;opacity:.9;transform:translateY(-1px)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--muted);padding:13px 16px;border-radius:14px;font-size:13px;width:100%;justify-content:center}

/* NAV */
.nav{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.nt{flex:1;border:none;background:transparent;color:var(--muted);padding:9px 0;font-family:var(--fb);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s}
.nt.on{background:var(--ink);color:var(--acc)}
.nt .ic{font-size:14px}

/* CALENDAR */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 20px}
.cd-h{font-family:var(--fm);font-size:9px;color:var(--muted);text-align:center;letter-spacing:.08em}
.cd{aspect-ratio:1;border-radius:7px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:11px;color:var(--muted);position:relative;cursor:pointer;transition:transform .1s}
.cd:active{transform:scale(.9)}
.cd.done{background:var(--ink);color:var(--acc);border-color:var(--ink);font-weight:700}
.cd.today{border:2px solid var(--ink);color:var(--ink);font-weight:600}
.cd.rest{opacity:.35}
.cd.future{opacity:.22}
.cd.missed::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:2px;background:var(--acc2)}

/* EXERCISE */
.ex-row{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:8px;display:flex;flex-direction:column;gap:9px}
.ex-n{font-family:var(--fd);font-size:17px;letter-spacing:.02em;line-height:1;color:var(--ink)}
.ex-m{font-family:var(--fm);font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.06em}
.sh{display:grid;grid-template-columns:22px 1fr 1fr 1fr 30px;gap:5px}
.ch{text-align:center;font-family:var(--fm);font-size:8px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.sr{display:grid;grid-template-columns:22px 1fr 1fr 1fr 30px;gap:5px;align-items:center}
.sn{font-family:var(--fd);font-size:14px;color:var(--dim)}
.inp{background:var(--bg2);border:1px solid var(--line);color:var(--ink);font-family:var(--fm);font-size:14px;font-weight:500;padding:8px 3px;border-radius:9px;text-align:center;width:100%;outline:none;transition:border-color .15s;-moz-appearance:textfield}
.inp::-webkit-outer-spin-button,.inp::-webkit-inner-spin-button{-webkit-appearance:none}
.inp:focus{border-color:var(--ink)}
.inp.done{background:rgba(26,26,46,.06);border-color:var(--ink);color:var(--ink);font-weight:700}
.chk{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg2);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:12px;transition:all .15s;flex-shrink:0}
.chk.done{background:var(--ink);color:var(--acc);border-color:var(--ink)}
.chk:disabled{opacity:.35;cursor:default}

/* DAY PILLS */
.dp{flex:0 0 auto;padding:7px 12px;background:var(--white);color:var(--muted);border:1px solid var(--line);border-radius:9px;font-family:var(--fd);font-size:11px;letter-spacing:.06em;cursor:pointer;position:relative;transition:all .15s}
.dp.on{background:var(--ink);color:var(--acc);border-color:var(--ink)}
.dp .dot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--acc2)}

/* TIMER */
.timer-b{position:fixed;top:16px;right:16px;background:var(--ink);color:var(--acc);border-radius:999px;padding:8px 16px;font-family:var(--fd);font-size:18px;letter-spacing:.04em;z-index:50}

/* ONBOARDING */
.onb{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;padding:40px 24px 60px;max-width:430px;margin:0 auto}
.onb h1{font-family:var(--fd);font-size:48px;line-height:.9;letter-spacing:.01em;color:var(--ink);margin:14px 0 10px}
.onb h1 .a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:6px;text-decoration-thickness:4px}
.onb .lead{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:22px}
.onb label{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.onb label span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--fm)}
.onb input,.onb select{background:var(--white);border:1px solid var(--line);color:var(--ink);font-family:var(--fb);font-size:16px;padding:12px 14px;border-radius:10px;width:100%;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
.onb input:focus,.onb select:focus{border-color:var(--ink)}
.onb .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dots{display:flex;gap:6px;margin-bottom:22px}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s}
.dots span.on{width:18px;border-radius:3px;background:var(--ink)}
.dtog-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.dtog{padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--white);color:var(--muted);font-family:var(--fd);font-size:13px;letter-spacing:.06em;cursor:pointer;transition:all .15s}
.dtog.on{background:var(--ink);color:var(--acc);border-color:var(--ink)}
.tpl-box{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:16px}
.add-ex{width:100%;padding:10px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font-family:var(--fm);font-size:12px;letter-spacing:.08em;cursor:pointer;margin-top:6px;transition:border-color .15s}
.add-ex:hover{border-color:var(--ink);color:var(--ink)}
.ee{background:var(--bg2);border-radius:10px;padding:10px;margin-bottom:8px}
.ee-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.ee-row input{background:var(--white);border:1px solid var(--line);color:var(--ink);font-family:var(--fm);font-size:12px;padding:7px 10px;border-radius:7px;width:100%;outline:none}
.ee-row input:focus{border-color:var(--ink)}
.rm{background:transparent;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.rm:hover{color:var(--acc2)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end}
.modal{background:var(--white);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:24px 22px 40px;width:100%;max-width:430px;margin:0 auto}
.modal-inp{background:var(--bg2);border:1px solid var(--line);color:var(--ink);font-family:var(--fb);font-size:15px;padding:10px 12px;border-radius:10px;width:100%;outline:none}
.modal-inp:focus{border-color:var(--ink)}

/* LOGO */
.logo{display:inline-flex;align-items:center;gap:8px}
.logo svg{display:none}
.logo span{font-family:var(--fd);font-size:24px;letter-spacing:.12em;color:var(--ink)}

/* WEEK STRIP */
.wday{flex:0 0 auto;background:var(--bg2);border:1.5px solid var(--line);border-radius:9px;padding:6px 3px;text-align:center}
.wday.wt{background:var(--ink);border-color:var(--ink)}
.wday.wd{background:rgba(26,26,46,.06);border-color:rgba(26,26,46,.18)}

@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fu .25s ease both}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;

const dk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const now=()=>new Date();
const todayISO=()=>dk(now());
const iso2d=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);};
const gid=()=>'x'+Math.random().toString(36).slice(2,9);
const DOWS=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MTHS=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
const fmtSub=d=>{const ds=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],ms=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return`${ds[d.getDay()]} · ${String(d.getDate()).padStart(2,'0')} ${ms[d.getMonth()]}`;};
const fmtMo=d=>`${MTHS[d.getMonth()]} ${d.getFullYear()}`;
function mDays(y,m){const l=new Date(y,m+1,0).getDate(),a=[];for(let d=1;d<=l;d++){const dt=new Date(y,m,d);a.push({day:d,dow:dt.getDay(),iso:dk(dt),date:dt});}return a;}
function hasLogs(st,iso){const s=st.sessions[iso];return!!(s&&Object.values(s).some(a=>Array.isArray(a)&&a.some(x=>x&&x.done)));}
function dayStatus(day,st,td){
  const tiso=dk(td),r=st.routine[day.dow];
  const isR=!r||!r.exercises||r.exercises.length===0;
  if(hasLogs(st,day.iso))return'done';
  if(day.iso===tiso)return isR?'rest-today':'today';
  if(isR)return day.iso<tiso?'rest':'rest-future';
  if(day.iso<tiso)return'missed';
  return'future';
}
function calcStreak(st,td){let s=0;const d=new Date(td);for(let i=0;i<90;i++){const iso=dk(d),dow=d.getDay(),r=st.routine[dow];const isR=!r||!r.exercises||r.exercises.length===0;if(isR)s++;else if(hasLogs(st,iso))s++;else if(iso===dk(td)){}else break;d.setDate(d.getDate()-1);}return s;}
function moStats(st,td){const days=mDays(td.getFullYear(),td.getMonth());let done=0,missed=0,rest=0,vol=0;for(const d of days){const s=dayStatus(d,st,td);if(s==='done')done++;else if(s==='missed')missed++;else if(s==='rest')rest++;const ses=st.sessions[d.iso];if(ses)for(const arr of Object.values(ses))if(Array.isArray(arr))for(const s of arr)if(s&&s.done&&s.weight&&s.reps)vol+=s.weight*s.reps;}return{done,missed,rest,vol};}

const TPL={
  1:{focus:'GLÚTEOS · POSTERIOR',exercises:[{id:gid(),name:'Hip thrust',muscle:'Glúteo',target:'10–12 reps'},{id:gid(),name:'Curl femoral',muscle:'Femoral',target:'12 reps'},{id:gid(),name:'Peso muerto rumano',muscle:'Posterior',target:'8–10 reps'},{id:gid(),name:'Abductores en máquina',muscle:'Glúteo medio',target:'15 reps'}]},
  2:{focus:'BRAZOS · HOMBRO',exercises:[{id:gid(),name:'Tríceps polea',muscle:'Tríceps',target:'12 reps'},{id:gid(),name:'Pull down',muscle:'Espalda',target:'10–12 reps'},{id:gid(),name:'Curl bíceps',muscle:'Bíceps',target:'10–12 reps'},{id:gid(),name:'Elevaciones laterales',muscle:'Hombro',target:'12–15 reps'}]},
  3:{focus:'DESCANSO',exercises:[]},
  4:{focus:'CUÁDRICEPS · GLÚTEO',exercises:[{id:gid(),name:'Prensa',muscle:'Cuádriceps',target:'10–12 reps'},{id:gid(),name:'Sentadilla en Smith',muscle:'Pierna',target:'8–10 reps'},{id:gid(),name:'Extensión cuádriceps',muscle:'Cuádriceps',target:'12–15 reps'},{id:gid(),name:'Abductores en máquina',muscle:'Glúteo medio',target:'15 reps'}]},
  5:{focus:'CORE · CARDIO',exercises:[{id:gid(),name:'Plank',muscle:'Core',target:'45–60 seg'},{id:gid(),name:'Crunch polea',muscle:'Abdomen',target:'15–20 reps'},{id:gid(),name:'Cardio (cinta/escalera)',muscle:'Cardio',target:'20 min'}]},
  6:{focus:'FULL PIERNAS',exercises:[{id:gid(),name:'Hip thrust pesado',muscle:'Glúteo',target:'8 reps'},{id:gid(),name:'Sentadilla en Smith',muscle:'Pierna',target:'8 reps'},{id:gid(),name:'Peso muerto rumano',muscle:'Posterior',target:'8 reps'},{id:gid(),name:'Prensa',muscle:'Cuádriceps',target:'12–15 reps'}]},
  0:{focus:'DESCANSO',exercises:[]},
};

const KEY='muvit_v1';
const LEGACY_KEY='lifts_v1';
const load=()=>{try{const r=localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY);if(r)return JSON.parse(r);}catch(e){}return null;};
const persist=s=>{try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}};
const blank=()=>({onboarded:false,user:{name:'',weightKg:null,heightCm:null,goal:'',monthlyGoal:16},routine:{},sessions:{},notes:{}});
const resetApp=()=>{
  const ok=confirm('Esto borrará tu rutina, sesiones y progreso guardado en este dispositivo. ¿Quieres reiniciar MUVIT?');
  if(!ok)return;
  const sure=confirm('Última confirmación: esta acción no se puede deshacer.');
  if(!sure)return;
  try{localStorage.removeItem(KEY);localStorage.removeItem(LEGACY_KEY);}catch(e){}
  window.location.reload();
};

function Logo(){return(
  <div className="logo">
    <span>MUVIT</span>
  </div>
);}

function Onboarding({onDone}){
  const [step,setStep]=useState(0);
  const [u,setU]=useState({name:'',weightKg:'',heightCm:'',goal:'Bajar grasa',monthlyGoal:16});
  const [tDays,setTDays]=useState([1,2,4,5,6]);
  const [rtn,setRtn]=useState({});
  const [editDow,setEditDow]=useState(null);
  const DL=[{d:1,l:'LUN'},{d:2,l:'MAR'},{d:3,l:'MIÉ'},{d:4,l:'JUE'},{d:5,l:'VIE'},{d:6,l:'SÁB'},{d:0,l:'DOM'}];
  const tog=d=>setTDays(p=>p.includes(d)?p.filter(x=>x!==d):[...p,d]);
  const useTpl=()=>{
    const r={},src=[1,2,4,5,6,0,3].filter(d=>TPL[d]&&TPL[d].exercises.length>0);
    let i=0;for(const dow of [...tDays].sort()){const s=TPL[src[i%src.length]];r[dow]={focus:s.focus,exercises:s.exercises.map(e=>({...e,id:gid()}))};i++;}
    for(const d of[0,1,2,3,4,5,6])if(!r[d])r[d]={focus:'DESCANSO',exercises:[]};
    setRtn(r);setStep(3);
  };
  const useBlank=()=>{
    const r={};for(const d of tDays)r[d]={focus:'ENTRENAMIENTO',exercises:[]};
    for(const d of[0,1,2,3,4,5,6])if(!r[d])r[d]={focus:'DESCANSO',exercises:[]};
    setRtn(r);setStep(3);
  };
  const addEx=dow=>setRtn(p=>({...p,[dow]:{...p[dow],exercises:[...(p[dow]?.exercises||[]),{id:gid(),name:'',muscle:'',target:'10–12 reps'}]}}));
  const updEx=(dow,id,f,v)=>setRtn(p=>({...p,[dow]:{...p[dow],exercises:p[dow].exercises.map(e=>e.id===id?{...e,[f]:v}:e)}}));
  const rmEx=(dow,id)=>setRtn(p=>({...p,[dow]:{...p[dow],exercises:p[dow].exercises.filter(e=>e.id!==id)}}));
  const updFocus=(dow,v)=>setRtn(p=>({...p,[dow]:{...p[dow],focus:v}}));
  const finish=()=>onDone({onboarded:true,user:{name:u.name.trim()||'ATLETA',weightKg:parseFloat(u.weightKg)||null,heightCm:parseInt(u.heightCm)||null,goal:u.goal,monthlyGoal:parseInt(u.monthlyGoal)||16},routine:rtn,sessions:{},notes:{}});
  const can0=u.name.trim().length>0,can1=tDays.length>0;

  return(
    <div className="onb">
      <Logo/>
      <div className="dots" style={{marginTop:22}}>{[0,1,2,3].map(i=><span key={i} className={i<=step?'on':''}/>)}</div>
      {step===0&&<div className="fade">
        <div className="L">PASO 1 DE 4</div>
        <h1>HO<span className="a">LA</span></h1>
        <p className="lead"><strong style={{color:'var(--ink)'}}>Todo movimiento cuenta.</strong><br/>Planifica tu semana, registra tus sesiones y mira tu progreso sin complicarte.</p>
        <label><span>¿Cómo te llamas?</span><input value={u.name} onChange={e=>setU({...u,name:e.target.value})} placeholder="Tu nombre" autoFocus/></label>
        <div className="row2">
          <label><span>Peso (kg)</span><input type="number" inputMode="decimal" value={u.weightKg} onChange={e=>setU({...u,weightKg:e.target.value})} placeholder="60"/></label>
          <label><span>Altura (cm)</span><input type="number" inputMode="numeric" value={u.heightCm} onChange={e=>setU({...u,heightCm:e.target.value})} placeholder="165"/></label>
        </div>
        <label><span>Objetivo</span><select value={u.goal} onChange={e=>setU({...u,goal:e.target.value})}><option>Bajar grasa</option><option>Ganar músculo</option><option>Ganar fuerza</option><option>Mantener</option><option>Recomposición</option></select></label>

                  <input value={ex.muscle} onChange={e=>updEx(dow,ex.id,'muscle',e.target.value)} placeholder="Músculo"/>

}

function CalMini({st,td,onPick}){
  const days=mDays(td.getFullYear(),td.getMonth()),first=days[0].dow;

      {days.map(d=>{const s=dayStatus(d,st,td);let c='cd';if(s==='done')c+=' done';else if(s==='today')c+=' today';else if(s.startsWith('rest'))c+=' rest';else if(s==='future')c+=' future';else if(s==='missed')c+=' missed';return<div key={d.day} className={c} onClick={()=>onPick&&onPick(d.iso)}>{d.day}</div>;})}
    </div>
  </>);
}

function Workout({st,setSt}){
  const td=now(),tdDow=td.getDay();
  const [selDow,setSelDow]=useState(tdDow);
  const [timer,setTimer]=useState(null);
  const rtn=st.routine[selDow]||{focus:'DESCANSO',exercises:[]};
  const iso=todayISO();
  useEffect(()=>{if(!timer)return;const t=setInterval(()=>setTimer(r=>r&&r>1?r-1:null),1000);return()=>clearInterval(t);},[timer]);
  const getSets=exId=>(st.sessions[iso]||{})[exId]||[{weight:0,reps:0,rir:null,done:false},{weight:0,reps:0,rir:null,done:false},{weight:0,reps:0,rir:null,done:false}];
  const upd=(exId,si,f,v)=>setSt(s=>{const ses={...s.sessions},day={...(ses[iso]||{})},cur=day[exId]||getSets(exId);day[exId]=cur.map((x,i)=>i===si?{...x,[f]:v}:x);ses[iso]=day;return{...s,sessions:ses};});
  const tog=(exId,si)=>{const was=getSets(exId)[si].done;upd(exId,si,'done',!was);if(!was)setTimer(90);};
  const totS=rtn.exercises.length*3,doneS=rtn.exercises.reduce((n,ex)=>n+getSets(ex.id).filter(s=>s.done).length,0),pct=totS?Math.round((doneS/totS)*100):0;
  const DP=[{d:1,l:'LUN'},{d:2,l:'MAR'},{d:3,l:'MIÉ'},{d:4,l:'JUE'},{d:5,l:'VIE'},{d:6,l:'SÁB'},{d:0,l:'DOM'}];
  const isRest=rtn.exercises.length===0;

  return(<div className="body">
    {timer&&<div className="timer-b">{Math.floor(timer/60)}:{String(timer%60).padStart(2,'0')}</div>}
    <TB user={st.user} sub={rtn.focus}/>
    <div style={{display:'flex',gap:5,padding:'4px 20px 12px',overflowX:'auto'}}>
      {DP.map(d=>{const isOn=d.d===selDow,isT=d.d===tdDow;return(<button key={d.d} className={`dp${isOn?' on':''}`} onClick={()=>setSelDow(d.d)}>{d.l}{isT&&!isOn&&<span className="dot"/>}</button>);})}
    </div>
    {isRest
      ?<div style={{padding:'0 20px'}}><div className="card" style={{padding:28,textAlign:'center'}}><div className="D" style={{fontSize:24,color:'var(--ink)'}}>DESCANSO</div><div className="M" style={{fontSize:11,color:'var(--muted)',marginTop:10}}>Hidratación · sueño · recuperación</div></div></div>
      :<>
        <div style={{padding:'0 20px',marginBottom:4}}>
          <div className="card card-ink" style={{padding:'14px 16px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:10}}>
              <div><div className="L" style={{color:'rgba(255,255,255,.5)'}}>{selDow===tdDow?'SESIÓN DE HOY':'VISTA PREVIA'}</div><div className="D" style={{fontSize:26,color:'var(--white)',marginTop:2}}>{doneS}<span style={{opacity:.4}}>/{totS}</span> SETS</div></div>
              <div className="M" style={{fontSize:20,fontWeight:700,color:'var(--acc)'}}>{pct}<span style={{fontSize:12}}>%</span></div>
            </div>
            <div style={{height:5,background:'rgba(255,255,255,.15)',borderRadius:999,overflow:'hidden'}}><div style={{width:`${pct}%`,height:'100%',background:'var(--acc)',transition:'width .4s'}}/></div>
          </div>
        </div>
        <Tape>EJERCICIOS · 3 SERIES · 8–10 REPS</Tape>
        <div style={{padding:'0 20px'}}>
          {rtn.exercises.map((ex,idx)=><ExCard key={ex.id} ex={ex} num={idx+1} sets={getSets(ex.id)} editable={selDow===tdDow} onUpd={(si,f,v)=>upd(ex.id,si,f,v)} onTog={si=>tog(ex.id,si)}/>)}
          {selDow===tdDow&&doneS===totS&&totS>0&&<div className="card card-ink" style={{padding:20,textAlign:'center',marginTop:8}}><div className="D" style={{fontSize:22,color:'var(--acc)'}}>SESIÓN COMPLETADA</div><div className="M" style={{fontSize:11,color:'rgba(255,255,255,.6)',marginTop:4}}>+1 día de racha</div></div>}
        </div>
      </>
    }
  </div>);
}

  const td=now(),stats=moStats(st,td);
  const weeks=[];
  for(let w=5;w>=0;w--){const end=new Date(td);end.setDate(end.getDate()-w*7);const start=new Date(end);start.setDate(start.getDate()-6);let kg=0;for(const[iso,day]of Object.entries(st.sessions)){const d=iso2d(iso);if(d>=start&&d<=end)for(const arr of Object.values(day))if(Array.isArray(arr))for(const s of arr)if(s&&s.done&&s.weight&&s.reps)kg+=s.weight*s.reps;}const tmp=new Date(end);tmp.setDate(tmp.getDate()-end.getDay()+1);const oj=new Date(tmp.getFullYear(),0,1);weeks.push({w:'W'+Math.ceil((((tmp-oj)/86400000)+oj.getDay()+1)/7),kg});}
  const maxKg=Math.max(1,...weeks.map(w=>w.kg));
  const prMap={};
  for(const[iso,day]of Object.entries(st.sessions))for(const[exId,arr]of Object.entries(day)){if(!Array.isArray(arr))continue;for(const s of arr)if(s&&s.done&&s.weight&&(!prMap[exId]||s.weight>prMap[exId].kg))prMap[exId]={kg:s.weight,reps:s.reps||0,date:iso};}
  const exN={};for(const dow of Object.keys(st.routine))for(const ex of(st.routine[dow].exercises||[]))exN[ex.id]=ex.name;
  const prs=Object.entries(prMap).map(([id,v])=>({...v,name:exN[id]||id})).sort((a,b)=>b.kg-a.kg).slice(0,8);
  let rS=0,rC=0;for(const day of Object.values(st.sessions))for(const arr of Object.values(day))if(Array.isArray(arr))for(const s of arr)if(s&&s.done&&s.rir!=null){rS+=s.rir;rC++;}
  const avgRIR=rC?rS/rC:null;
  const empty=stats.done===0&&prs.length===0;

  return(<div className="body">
    <TB user={st.user} sub="Tu progreso"/>
    <div style={{padding:'0 20px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:4}}>
      <div className="card" style={{padding:13}}><div className="L">VOLUMEN MES</div><div className="D" style={{fontSize:32,marginTop:4,color:'var(--ink)'}}>{(stats.vol/1000).toFixed(1)}<span style={{fontSize:13,color:'var(--muted)'}}>t</span></div><div className="M" style={{fontSize:9,color:'var(--muted)'}}>{stats.vol.toLocaleString()} KG</div></div>
      <div className="card" style={{padding:13}}><div className="L">RIR PROM.</div><div className="D" style={{fontSize:32,marginTop:4,color:'var(--ink)'}}>{avgRIR==null?'—':avgRIR.toFixed(1)}</div><div className="M" style={{fontSize:9,color:'var(--muted)'}}>{avgRIR==null?'SIN DATOS':avgRIR<1.5?'INTENSIDAD ALTA':'MODERADA'}</div></div>
    </div>
    <Tape>VOLUMEN POR SEMANA</Tape>
    <div style={{padding:'0 20px'}}><div className="card" style={{padding:'14px 14px 10px'}}>
      {empty?<div style={{padding:'26px 0',textAlign:'center'}}><div className="D" style={{fontSize:16,color:'var(--dim)'}}>SIN DATOS AÚN</div><div className="M" style={{fontSize:11,color:'var(--muted)',marginTop:6}}>Completa sesiones para ver tu progreso</div></div>
        :<>
          <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',height:110,gap:5,borderBottom:'1px dashed var(--line)',paddingBottom:5}}>
            {weeks.map((w,i)=>{const h=(w.kg/maxKg)*100,isL=i===weeks.length-1;return(<div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',height:'100%'}}>
              <div className="M" style={{fontSize:7,color:'var(--muted)',marginBottom:2}}>{w.kg>0?(w.kg/1000).toFixed(1)+'t':'—'}</div>
              <div style={{width:'100%',height:w.kg>0?`${h}%`:'2px',background:isL?'var(--ink)':'var(--bg3)',border:`1px solid ${isL?'var(--ink)':'var(--line)'}`,borderRadius:3}}/>
            </div>);})}
          </div>
          <div style={{display:'flex',marginTop:4}}>{weeks.map((w,i)=><div key={i} className="M" style={{fontSize:7,color:'var(--muted)',flex:1,textAlign:'center'}}>{w.w}</div>)}</div>
        </>}
    </div></div>
    <Tape>RÉCORDS PERSONALES</Tape>
    <div style={{padding:'0 20px'}}>
      {prs.length===0?<div className="card" style={{padding:18,textAlign:'center'}}><div className="M" style={{fontSize:11,color:'var(--muted)'}}>Tus PRs aparecerán al completar series</div></div>
        :prs.map((pr,i)=><div key={i} className="card" style={{padding:'12px 14px',marginBottom:8,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div><div style={{display:'flex',alignItems:'center',gap:8}}><span className="D" style={{fontSize:9,color:'var(--acc2)'}}>PR</span><span style={{fontFamily:'var(--fd)',fontSize:14,color:'var(--ink)'}}>{(pr.name||'').toUpperCase().slice(0,22)}</span></div><div className="M" style={{fontSize:9,color:'var(--muted)',marginTop:2}}>{pr.date} · {pr.reps} reps</div></div>
          <div style={{textAlign:'right'}}><div className="D" style={{fontSize:26,color:'var(--ink)'}}>{pr.kg}</div><div className="M" style={{fontSize:8,color:'var(--muted)',letterSpacing:'.1em'}}>KG</div></div>
        </div>)}
    </div>
  </div>);
}

function ProfileModal({st,setSt,onClose}){
  const [name,setName]=useState(st.user.name||'');
  const [wt,setWt]=useState(st.user.weightKg||'');
  const [ht,setHt]=useState(st.user.heightCm||'');
  const [mg,setMg]=useState(st.user.monthlyGoal||16);
  const iStyle={background:'var(--bg2)',border:'1px solid var(--line)',color:'var(--ink)',fontFamily:'var(--fb)',fontSize:15,padding:'10px 12px',borderRadius:10,width:'100%',outline:'none'};
  const save=()=>{setSt(s=>({...s,user:{...s.user,name:name.trim()||s.user.name,weightKg:parseFloat(wt)||s.user.weightKg,heightCm:parseInt(ht)||s.user.heightCm,monthlyGoal:parseInt(mg)||s.user.monthlyGoal}}));onClose();};
  const reset=()=>resetApp();
  return(<div className="modal-bg" onClick={onClose}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div className="D" style={{fontSize:22,color:'var(--ink)'}}>PERFIL</div>
        <button onClick={onClose} style={{background:'transparent',border:'none',color:'var(--muted)',fontSize:20,cursor:'pointer'}}>✕</button>
      </div>
      <div style={{display:'grid',gap:10}}>
        <label style={{display:'flex',flexDirection:'column',gap:4}}><span className="L">NOMBRE</span><input style={iStyle} value={name} onChange={e=>setName(e.target.value)}/></label>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <label style={{display:'flex',flexDirection:'column',gap:4}}><span className="L">PESO KG</span><input type="number" style={{...iStyle,fontFamily:'var(--fm)'}} value={wt} onChange={e=>setWt(e.target.value)}/></label>
          <label style={{display:'flex',flexDirection:'column',gap:4}}><span className="L">ALTURA CM</span><input type="number" style={{...iStyle,fontFamily:'var(--fm)'}} value={ht} onChange={e=>setHt(e.target.value)}/></label>
        </div>
        <label style={{display:'flex',flexDirection:'column',gap:4}}><span className="L">META SESIONES/MES</span><input type="number" style={{...iStyle,fontFamily:'var(--fm)'}} value={mg} onChange={e=>setMg(e.target.value)}/></label>
      </div>
      <button className="btn btn-p" style={{marginTop:18}} onClick={save}><span>GUARDAR</span><span className="ar">✓</span></button>
      <button onClick={reset} style={{width:'100%',marginTop:10,padding:12,border:'1px solid var(--line)',borderRadius:12,background:'transparent',color:'var(--acc2)',fontFamily:'var(--fm)',fontSize:11,letterSpacing:'.06em',cursor:'pointer'}}>BORRAR TODOS LOS DATOS</button>
    </div>
  </div>);
}

function App(){
  const [st,setSt]=useState(()=>load()||blank());
  const [tab,setTab]=useState('home');
  const [prof,setProf]=useState(false);
  useEffect(()=>{persist(st);},[st]);
  if(!st.onboarded)return <Onboarding onDone={s=>setSt({...blank(),...s,onboarded:true})}/>;
  let body;
  if(tab==='home')body=<Home st={st} onStart={()=>setTab('workout')} onCal={()=>setTab('calendar')} onAv={()=>setProf(true)} onReset={resetApp}/>;
  else if(tab==='calendar')body=<Calendar st={st}/>;
  else if(tab==='workout')body=<Workout st={st} setSt={setSt}/>;
  else if(tab==='stats')body=<Stats st={st}/>;
  return(<>
    <div className="app"><div className="scroll">{body}</div><Nav active={tab} onChange={setTab}/></div>
    {prof&&<ProfileModal st={st} setSt={setSt} onClose={()=>setProf(false)}/>}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
