<style>
:root{
  --bg:#F7F6F2;--bg2:#F1EFE8;--card:#FFFFFF;--ink:#171717;--muted:#77706A;--dim:#B8B1A7;--line:#E3DCD1;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
body{background:radial-gradient(circle at top left,rgba(232,111,58,.10),transparent 30%),linear-gradient(180deg,var(--bg),var(--bg2))}
button,input,select,textarea{font:inherit}button{border:0;background:none;cursor:pointer;color:inherit}
input,select,textarea{width:100%;border:1px solid var(--line);background:#FFFDF9;color:var(--ink);border-radius:16px;padding:12px 13px;outline:none}
textarea{min-height:74px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin:0 0 7px 2px}
h1,h2,h3,p{margin:0} h1{font-size:28px;line-height:1.05;letter-spacing:-.9px} h2{font-size:18px;letter-spacing:-.35px;margin-bottom:10px} p{font-size:14px;line-height:1.45;color:var(--muted)}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 15px 100px}.view{display:none}.view.active{display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px}.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:17px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:950;letter-spacing:-1px;box-shadow:var(--shadow);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}.brand-title{font-weight:950;font-size:24px;line-height:1;letter-spacing:-.8px}.date{font-size:13px;color:var(--muted);margin-top:5px;text-transform:capitalize}
.profile-btn{width:43px;height:43px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-weight:950;box-shadow:var(--shadow)}
.card{background:rgba(255,255,255,.94);border:1px solid rgba(227,220,209,.92);border-radius:24px;padding:16px;box-shadow:var(--shadow)}.card.dark{background:var(--ink);border-color:var(--ink);color:#fff}.section{margin-top:14px}.hero{padding:20px;border-radius:28px;background:linear-gradient(135deg,#fff,rgba(255,255,255,.72));border:1px solid rgba(227,220,209,.92);box-shadow:var(--shadow);margin-bottom:14px}
.eyebrow{font-size:12px;color:var(--orange);font-weight:950;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}.micro{font-size:13px;color:var(--muted);font-weight:700}.tiny{font-size:12px;color:var(--muted)}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.row-start{display:flex;gap:10px;align-items:flex-start}.min0{min-width:0}
.btn{border-radius:16px;background:var(--ink);color:#fff;min-height:46px;padding:12px 14px;font-weight:950;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 9px 18px rgba(0,0,0,.12)}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.ghost{background:#F7F1E9;color:var(--ink);box-shadow:none;border:1px solid var(--line)}.btn.danger{background:#FFF0EE;color:var(--red);border:1px solid #F5C8C4;box-shadow:none}.btn.small{min-height:34px;border-radius:12px;padding:7px 10px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;background:#F7F1E9;border:1px solid var(--line);font-size:12px;font-weight:850;color:#5F5751;white-space:nowrap}.pill.ok{background:#EAF7EF;color:#247249;border-color:#CBEBD8}.pill.warn{background:#FFF5D6;color:#8B6200;border-color:#F2D889}.pill.blue{background:#ECF1FF;color:#3158AF;border-color:#CFDAFF}.pill.no{background:#FFF0EE;color:#B4433C;border-color:#F5C8C4}
.grid{display:grid;gap:12px}.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}
.stat-number{font-size:26px;font-weight:950;letter-spacing:-.8px}.stat-label{font-size:12px;color:var(--muted);font-weight:750;margin-top:4px}
.tabs{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(452px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;padding:7px;box-shadow:var(--shadow);z-index:50}.tab{height:50px;border-radius:18px;font-size:11px;font-weight:950;color:var(--muted)}.tab span{display:block;font-size:18px;margin-bottom:1px}.tab.active{background:var(--ink);color:#fff}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px}.day{min-height:52px;border-radius:15px;background:#F8F3EC;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);font-weight:850;text-align:center;padding:5px 2px}.day.done{background:#EAF7EF;color:#247249;border-color:#CBEBD8}.day.no{background:#FFF0EE;color:#B4433C;border-color:#F5C8C4}.day.today{outline:2px solid var(--ink)}.day .em{font-size:17px;line-height:1.1}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick{border:1px solid var(--line);background:#FFFDF9;border-radius:18px;padding:11px 8px;font-weight:950;color:var(--muted);min-height:70px}.quick.active{background:var(--ink);color:#fff;border-color:var(--ink)}.quick.no.active{background:#FFF0EE;color:#B4433C;border-color:#F5C8C4}.quick small{display:block;font-size:11px;font-weight:750;margin-top:2px;opacity:.78}
.calendar-head,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calendar-head{font-size:11px;font-weight:900;color:var(--muted);text-align:center;margin:12px 0 6px}.cal{height:52px;border-radius:15px;background:#FFFDF9;border:1px solid var(--line);padding:6px;text-align:left;color:var(--muted);font-size:12px;font-weight:850;position:relative}.cal.done{background:#EAF7EF;color:#247249;border-color:#CBEBD8}.cal.no{background:#FFF0EE;color:#B4433C;border-color:#F5C8C4}.cal.selected{outline:2px solid var(--ink)}.cal .ems{position:absolute;bottom:5px;left:6px;font-size:12px;white-space:nowrap}
.exercise{background:#FFFDF9;border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:12px}.exercise-title{font-weight:950;font-size:17px;letter-spacing:-.3px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.reference{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.series{display:grid;gap:8px;margin-top:12px}.serie{display:grid;grid-template-columns:44px 1fr 1fr 42px;gap:7px;align-items:center}.serie .slabel{font-size:12px;font-weight:900;color:var(--muted)}.check{height:40px;border-radius:14px;border:1px solid var(--line);background:#F7F1E9;font-weight:950}.check.on{background:var(--green);border-color:var(--green);color:#fff}.exercise-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.icon{width:36px;height:36px;border-radius:13px;background:#F7F1E9;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0}.select-day{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day-plan{padding:10px 3px;border-radius:14px;background:#FFFDF9;border:1px solid var(--line);font-size:12px;font-weight:950;color:var(--muted)}.day-plan.active{background:var(--ink);color:#fff}
.list-item{padding:12px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}.list-title{font-weight:950}.list-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.chart{height:170px;border-radius:18px;border:1px solid var(--line);background:#FFFDF9;margin-top:10px;overflow:hidden}.barline{display:flex;align-items:flex-end;gap:6px;height:150px;padding:15px}.bar{flex:1;min-height:8px;border-radius:8px 8px 3px 3px;background:var(--orange);position:relative}.bar span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:var(--muted)}.empty{border:1px dashed #D7CCC1;background:#FFFDF9;border-radius:20px;padding:15px;text-align:center;color:var(--muted);font-weight:650}.progress{height:10px;background:#F7F1E9;border:1px solid var(--line);border-radius:999px;overflow:hidden}.progress .fill{height:100%;background:var(--ink);border-radius:999px}
.modal-backdrop{position:fixed;inset:0;background:rgba(32,22,14,.45);z-index:90;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal-backdrop.open{display:flex}.modal{width:min(480px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:28px;padding:18px;box-shadow:0 22px 55px rgba(0,0,0,.2)}.form{display:grid;gap:12px;margin-top:12px}.suggestions{position:relative}.suggestion-list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);max-height:220px;overflow:auto;z-index:120}.suggestion{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:750}.suggestion:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%) translateY(18px);background:#171717;color:#fff;border-radius:16px;padding:12px 14px;font-weight:900;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.22s;z-index:130}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.hidden{display:none!important}.credit{text-align:center;color:var(--dim);font-size:11px;font-weight:750;margin:22px 0 6px}.group-tags{display:flex;gap:7px;flex-wrap:wrap}.group-check{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#FFFDF9;border-radius:999px;padding:9px 11px;font-size:12px;font-weight:850;color:var(--muted)}.group-check.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.onb{max-width:480px;margin:0 auto;min-height:100vh;padding:36px 20px 56px}.onb h1{font-size:42px}.dots{display:flex;gap:6px;margin:22px 0}.dots span{width:6px;height:6px;border-radius:50%;background:var(--line)}.dots span.on{width:18px;border-radius:8px;background:var(--ink)}
@media(max-width:360px){.grid2,.grid3{grid-template-columns:1fr}.quick-grid{grid-template-columns:1fr}.serie{grid-template-columns:38px 1fr 1fr 38px}.app{padding-left:12px;padding-right:12px}h1{font-size:25px}.onb h1{font-size:36px}}
</style>

<body>

    <div class="brand">
      <div class="logo"><img src="apple-touch-icon.png" alt="MUVIT" onerror="this.style.display='none';this.parentElement.textContent='M'"></div>
      <div><div class="brand-title">MUVIT</div><div class="date" id="dateHeader"></div></div>
    </div>

<nav class="tabs">

</nav>

<script>
const KEY='muvit_final_v1';
const MIGRATE_KEYS=['muvit_final_v1','muvit_v3','muvit_v2','lifts_v1','muvit_app_v4_light','muvit_app_v3','muvit_app_v2'];
const DAYS=['L','M','M','J','V','S','D'];
const DAYNAMES=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const GROUPS=[
 {id:'gluteos',name:'Glúteos',emoji:'🍑'},
 {id:'posterior',name:'Posterior / femoral',emoji:'🦵'},
 {id:'cuadriceps',name:'Cuádriceps',emoji:'🦵'},
 {id:'espalda',name:'Espalda',emoji:'🪽'},
 {id:'pecho',name:'Pecho',emoji:'◼️'},
 {id:'hombros',name:'Hombros',emoji:'💪'},
 {id:'biceps',name:'Bíceps',emoji:'💪'},
 {id:'triceps',name:'Tríceps',emoji:'💪'},
 {id:'core',name:'Core / abdomen',emoji:'⭕'},
 {id:'cardio',name:'Cardio',emoji:'❤️'},
 {id:'movilidad',name:'Movilidad',emoji:'🧘'}
];
const GROUP_MAP=Object.fromEntries(GROUPS.map(g=>[g.id,g]));
const EXERCISES=[
 {name:'Hip thrust',groups:['gluteos'],target:'8–12 reps'},
 {name:'Puente de glúteos',groups:['gluteos'],target:'12–15 reps'},
 {name:'Patada de glúteo en polea',groups:['gluteos'],target:'12–15 reps'},
 {name:'Abducción de cadera',groups:['gluteos'],target:'15–20 reps'},
 {name:'Abductores en máquina',groups:['gluteos'],target:'15–20 reps'},
 {name:'Peso muerto rumano',groups:['posterior','gluteos'],target:'8–10 reps'},
 {name:'Curl femoral sentado',groups:['posterior'],target:'10–12 reps'},
 {name:'Curl femoral echado',groups:['posterior'],target:'10–12 reps'},
 {name:'Buenos días',groups:['posterior'],target:'10–12 reps'},
 {name:'Prensa de piernas',groups:['cuadriceps','gluteos'],target:'10–12 reps'},
 {name:'Sentadilla en Smith',groups:['cuadriceps','gluteos'],target:'8–10 reps'},
 {name:'Sentadilla libre',groups:['cuadriceps','gluteos'],target:'6–10 reps'},
 {name:'Sentadilla búlgara',groups:['cuadriceps','gluteos'],target:'8–10 reps'},
 {name:'Extensión de cuádriceps',groups:['cuadriceps'],target:'12–15 reps'},
 {name:'Zancadas caminando',groups:['cuadriceps','gluteos'],target:'10–12 reps'},
 {name:'Jalón al pecho',groups:['espalda'],target:'10–12 reps'},
 {name:'Remo sentado',groups:['espalda'],target:'10–12 reps'},
 {name:'Remo con mancuerna',groups:['espalda'],target:'8–12 reps'},
 {name:'Pull down',groups:['espalda'],target:'10–12 reps'},
 {name:'Dominadas asistidas',groups:['espalda'],target:'8–10 reps'},
 {name:'Press banca',groups:['pecho'],target:'8–10 reps'},
 {name:'Press inclinado mancuernas',groups:['pecho'],target:'8–12 reps'},
 {name:'Aperturas en máquina',groups:['pecho'],target:'12–15 reps'},
 {name:'Press militar',groups:['hombros'],target:'8–10 reps'},
 {name:'Press hombro con mancuernas',groups:['hombros'],target:'8–10 reps'},
 {name:'Elevaciones laterales',groups:['hombros'],target:'12–15 reps'},
 {name:'Face pull',groups:['hombros','espalda'],target:'12–15 reps'},
 {name:'Curl bíceps',groups:['biceps'],target:'10–12 reps'},
 {name:'Curl martillo',groups:['biceps'],target:'10–12 reps'},
 {name:'Curl predicador',groups:['biceps'],target:'10–12 reps'},
 {name:'Tríceps en polea',groups:['triceps'],target:'10–12 reps'},
 {name:'Fondos asistidos',groups:['triceps','pecho'],target:'8–12 reps'},
 {name:'Extensión de tríceps sobre cabeza',groups:['triceps'],target:'10–12 reps'},
 {name:'Plancha',groups:['core'],target:'45–60 seg'},
 {name:'Crunch en polea',groups:['core'],target:'12–15 reps'},
 {name:'Elevación de piernas',groups:['core'],target:'10–15 reps'},
 {name:'Russian twist',groups:['core'],target:'12–20 reps'},
 {name:'Cardio en cinta',groups:['cardio'],target:'20 min'},
 {name:'Caminata inclinada',groups:['cardio'],target:'20–30 min'},
 {name:'Escaladora',groups:['cardio'],target:'15–20 min'},
 {name:'Bicicleta',groups:['cardio'],target:'20 min'},
 {name:'Movilidad de cadera',groups:['movilidad'],target:'8–10 min'},
 {name:'Estiramientos dinámicos',groups:['movilidad'],target:'8–10 min'}
];
const QUICK=[
 {id:'gym',label:'Gym',emoji:'🏋️',sub:'fuerza'},
 {id:'pilates',label:'Pilates',emoji:'🧘‍♀️',sub:'clase'},
 {id:'yoga',label:'Yoga',emoji:'🧘',sub:'práctica'},
 {id:'running',label:'Running',emoji:'🏃',sub:'cardio'},
 {id:'walk',label:'Caminata',emoji:'🚶',sub:'pasos'},
 {id:'other',label:'Otro',emoji:'✨',sub:'actividad'},
 {id:'none',label:'No entrené',emoji:'—',sub:'registro'}
];
const ACTS=Object.fromEntries(QUICK.map(q=>[q.id,q]));
let view='Today', monthCursor=new Date(), selectedDay=todayKey(), activeDate=todayKey();
let state=load();

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function todayKey(){return key(new Date())}
function parse(k){const [y,m,d]=String(k).split('-').map(Number);return new Date(y,m-1,d)}
function dayIndex(d){return (d.getDay()+6)%7}
function pretty(d=new Date()){return d.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase())}
function norm(s=''){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function esc(s=''){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function groupNames(ids=[]){return ids.map(id=>GROUP_MAP[id]?.name).filter(Boolean).join(' · ')||'Rutina libre'}
function groupEmojis(ids=[]){return ids.map(id=>GROUP_MAP[id]?.emoji).filter(Boolean).slice(0,2).join('')||'🏋️'}
function mkEx(name){const e=EXERCISES.find(x=>norm(x.name)===norm(name));return {id:uid(),name:e?.name||name,groups:e?.groups||[],target:e?.target||'10–12 reps',sets:3,defaultReps:'10'}}
function defaultRoutine(){
 return [
  {day:0,groups:['gluteos','posterior'],exercises:['Hip thrust','Peso muerto rumano','Curl femoral sentado','Abductores en máquina','Patada de glúteo en polea'].map(mkEx)},
  {day:1,groups:['espalda','biceps'],exercises:['Jalón al pecho','Remo sentado','Pull down','Curl bíceps','Curl martillo'].map(mkEx)},
  {day:2,groups:[],exercises:[]},
  {day:3,groups:['cuadriceps','gluteos'],exercises:['Prensa de piernas','Sentadilla en Smith','Extensión de cuádriceps','Sentadilla búlgara','Abducción de cadera'].map(mkEx)},
  {day:4,groups:['hombros','triceps','core'],exercises:['Press hombro con mancuernas','Elevaciones laterales','Face pull','Tríceps en polea','Plancha'].map(mkEx)},
  {day:5,groups:['cardio','movilidad'],exercises:['Caminata inclinada','Movilidad de cadera','Estiramientos dinámicos'].map(mkEx)},
  {day:6,groups:[],exercises:[]}
 ];
}
function defaults(){return {version:1,onboarded:false,user:{name:'Giulliana',goal:'Bajar grasa',monthlyGoal:20,weight:'',fat:''},routine:defaultRoutine(),logs:{},body:[]}}
function normalizeRoutine(r){
 if(Array.isArray(r)) return [0,1,2,3,4,5,6].map(i=>{
   const p=r.find(x=>Number(x.day)===i)||r[i]||{};
   let groups=p.groups||p.groupIds||[];
   if(typeof groups==='string') groups=groups.split(',').map(x=>x.trim()).filter(Boolean);
   if(!groups.length && p.focus) groups=inferGroups(p.focus);
   return {day:i,groups,exercises:(p.exercises||[]).map(e=>normalizeEx(e,groups))}
 });
 const out=[]; for(let i=0;i<7;i++){const p=r?.[i]||{};let groups=p.groups||p.groupIds||[];if(!groups.length&&p.focus)groups=inferGroups(p.focus);out.push({day:i,groups,exercises:(p.exercises||[]).map(e=>normalizeEx(e,groups))})} return out;
}
function inferGroups(txt=''){const t=norm(txt), ids=[]; GROUPS.forEach(g=>{if(t.includes(norm(g.name).split(' ')[0])||t.includes(g.id))ids.push(g.id)}); if(t.includes('brazo'))ids.push('biceps','triceps'); if(t.includes('pierna'))ids.push('cuadriceps','gluteos'); return [...new Set(ids)]}
function normalizeEx(e,dayGroups=[]){const lib=EXERCISES.find(x=>norm(x.name)===norm(e.name));return {id:e.id||uid(),name:e.name||'Ejercicio',groups:e.groups||lib?.groups||dayGroups||[],target:e.target||lib?.target||e.defaultReps||'10–12 reps',sets:Number(e.sets||3),defaultReps:String(e.defaultReps||e.reps||'10')}}
function migrate(d){
 const base=defaults(); if(!d||typeof d!=='object') return base;
 const user={...base.user,...(d.user||{})};
 user.monthlyGoal=Number(user.monthlyGoal||user.monthlyGoalMove||user.monthlyGoalGym||d.user?.weeklyGoal*4||20);
 if(!['Bajar grasa','Ganar músculo','Ganar fuerza','Recomposición','Mantener'].includes(user.goal)) user.goal='Bajar grasa';
 const routine=normalizeRoutine(d.routine||d.plan||base.routine);
 const logs={};

   state.logs[k]={date:k,activities:[],noTraining:false,notes:'',gym:{groups:[...(p.groups||[])],exercises:(p.exercises||[]).map(e=>({id:uid(),sourceId:e.id,name:e.name,groups:e.groups||p.groups||[],target:e.target||'',removed:false,extra:false,sets:Array.from({length:Number(e.sets||3)},(_,i)=>({n:i+1,weight:'',reps:e.defaultReps||'',done:false}))}))}};

function logActivities(k){const l=getLog(k); if(!l) return []; return [...new Set([...(l.activities||[]),...(hasGym(k)?['gym']:[])])].filter(x=>x!=='none')}
function hasGym(k){const l=getLog(k); return !!(l&&((l.activities||[]).includes('gym')||(l.gym?.exercises||[]).some(e=>!e.removed&&e.sets?.some(s=>s.done))))}

function weekKeys(d=new Date()){const idx=dayIndex(d);const monday=new Date(d);monday.setDate(d.getDate()-idx);return Array.from({length:7},(_,i)=>{const x=new Date(monday);x.setDate(monday.getDate()+i);return key(x)})}

function closeModal(e){if(!e||e.target.id==='modalBackdrop'){document.getElementById('modalBackdrop').classList.remove('open');document.getElementById('modal').innerHTML=''}}
function openProfile(){openModal(`<div class="row"><h2>Perfil</h2><button class="icon" onclick="closeModal()">×</button></div><div class="form"><div><label>Nombre</label><input id="uName" value="${esc(state.user.name)}"></div><div><label>Objetivo actual</label><select id="uGoal">${['Bajar grasa','Ganar músculo','Ganar fuerza','Recomposición','Mantener'].map(g=>`<option ${state.user.goal===g?'selected':''}>${g}</option>`).join('')}</select></div><div><label>Meta mensual de entrenamiento</label><input id="uMonthly" type="number" min="1" value="${state.user.monthlyGoal||20}"></div><div class="grid grid2"><div><label>Peso actual</label><input id="uWeight" value="${esc(state.user.weight||'')}" inputmode="decimal"></div><div><label>% grasa actual</label><input id="uFat" value="${esc(state.user.fat||'')}" inputmode="decimal"></div></div><button class="btn" onclick="saveProfile()">Guardar</button><button class="btn secondary" onclick="exportData()">Exportar backup</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Importar backup</button><input class="hidden" id="importFile" type="file" accept="application/json" onchange="importData(event)"><details><summary class="tiny" style="margin-top:8px">Ajustes avanzados</summary><button class="btn danger" style="width:100%;margin-top:10px" onclick="resetApp()">Borrar datos y reiniciar</button></details></div>`)}
function saveProfile(){state.user.name=document.getElementById('uName').value||'G';state.user.goal=document.getElementById('uGoal').value;state.user.monthlyGoal=Number(document.getElementById('uMonthly').value||20);state.user.weight=document.getElementById('uWeight').value;state.user.fat=document.getElementById('uFat').value;if(state.user.weight||state.user.fat)state.body.push({id:uid(),date:todayKey(),weight:state.user.weight,fat:state.user.fat});save();closeModal();render();toast('Perfil guardado')}
function openExerciseModal(index=null){const l=ensureLog(activeDate), e=index!==null?l.gym.exercises[index]:{name:'',groups:l.gym.groups||[],target:'10–12 reps',sets:[{n:1},{n:2},{n:3}]};const allowed=EXERCISES.filter(x=>!e.groups?.length||x.groups.some(g=>e.groups.includes(g)));openModal(`<div class="row"><h2>${index!==null?'Editar ejercicio':'Agregar ejercicio'}</h2><button class="icon" onclick="closeModal()">×</button></div><div class="form"><div class="suggestions"><label>Ejercicio</label><input id="exName" value="${esc(e.name)}" oninput="showSuggest(this.value,'exSug','exName')"><div id="exSug" class="suggestion-list hidden">${allowed.map(x=>`<div class="suggestion" onclick="pickExercise('${esc(x.name)}')">${esc(x.name)} · ${esc(x.groups.map(g=>GROUP_MAP[g]?.name).join(' / '))}</div>`).join('')}</div></div><label>Series</label><input id="exSets" type="number" min="1" value="${e.sets?.length||3}"><button class="btn" onclick="saveExercise(${index===null?-1:index})">Guardar ejercicio</button></div>`)}
function showSuggest(q,boxId,inputId){const box=document.getElementById(boxId);const nq=norm(q);const l=ensureLog(activeDate);const hits=EXERCISES.filter(x=>(!l.gym.groups.length||x.groups.some(g=>l.gym.groups.includes(g)))&&norm(x.name).includes(nq)).slice(0,12);box.innerHTML=hits.map(h=>`<div class="suggestion" onclick="pickExercise('${esc(h.name)}')">${esc(h.name)} · ${esc(h.groups.map(g=>GROUP_MAP[g]?.name).join(' / '))}</div>`).join('');box.classList.toggle('hidden',!nq||!hits.length)}
function pickExercise(name){document.getElementById('exName').value=name;document.getElementById('exSug').classList.add('hidden')}
function saveExercise(index){const l=ensureLog(activeDate), name=document.getElementById('exName').value||'Ejercicio', lib=EXERCISES.find(x=>norm(x.name)===norm(name)), count=Number(document.getElementById('exSets').value||3);const obj={id:uid(),name:lib?.name||name,groups:lib?.groups||l.gym.groups||[],target:lib?.target||'10–12 reps',extra:true,removed:false,sets:Array.from({length:count},(_,i)=>({n:i+1,weight:'',reps:'',done:false}))};if(index<0)l.gym.exercises.push(obj);else{const old=l.gym.exercises[index];l.gym.exercises[index]={...old,...obj,id:old.id,sets:Array.from({length:count},(_,i)=>old.sets?.[i]||{n:i+1,weight:'',reps:'',done:false})}}if(!l.activities.includes('gym'))l.activities.push('gym');save();closeModal();renderGym()}
function openBodyModal(){openModal(`<div class="row"><h2>Dato corporal</h2><button class="icon" onclick="closeModal()">×</button></div><div class="form"><div><label>Fecha</label><input id="bDate" type="date" value="${todayKey()}"></div><div class="grid grid2"><div><label>Peso</label><input id="bWeight" inputmode="decimal"></div><div><label>% grasa</label><input id="bFat" inputmode="decimal"></div></div><button class="btn" onclick="saveBody()">Guardar dato</button></div>`)}
function saveBody(){state.body.push({id:uid(),date:document.getElementById('bDate').value||todayKey(),weight:document.getElementById('bWeight').value,fat:document.getElementById('bFat').value});save();closeModal();renderStats()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='muvit-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=migrate(JSON.parse(r.result));save();closeModal();render();toast('Backup importado')}catch(err){alert('No se pudo importar el archivo')}};r.readAsText(f)}
function resetApp(){if(!confirm('¿Borrar todos los datos de MUVIT en este dispositivo?'))return;if(!confirm('Última confirmación: esta acción no se puede deshacer.'))return;MIGRATE_KEYS.concat([KEY]).forEach(k=>localStorage.removeItem(k));state=defaults();save();closeModal();render();toast('App reiniciada')}
function renderOnboarding(){document.querySelector('.topbar').style.display='none';document.querySelector('.tabs').style.display='none';document.querySelector('.credit').style.display='none';document.getElementById('viewToday').innerHTML=`<div class="onb"><div class="logo" style="margin-bottom:20px"><img src="apple-touch-icon.png" onerror="this.style.display='none';this.parentElement.textContent='M'"></div><div class="eyebrow">MUVIT</div><h1>¡EMPIEZA HOY!</h1><p style="margin-top:8px"><strong style="color:var(--ink)">Todo entrenamiento cuenta.</strong> Planifica tu semana, registra tus sesiones y mira tu progreso sin complicarte.</p><div class="form" style="margin-top:20px"><div><label>Nombre</label><input id="onName" placeholder="Tu nombre"></div><div><label>Objetivo</label><select id="onGoal"><option>Bajar grasa</option><option>Ganar músculo</option><option>Ganar fuerza</option><option>Recomposición</option><option>Mantener</option></select></div><div><label>Meta mensual de entrenamiento</label><input id="onMonthly" type="number" value="20"></div><button class="btn" onclick="finishOnboarding()">Crear MUVIT</button></div><div class="credit">Desarrollado por Gicoder26</div></div>`}
function finishOnboarding(){state=defaults();state.user.name=document.getElementById('onName').value||'Atleta';state.user.goal=document.getElementById('onGoal').value;state.user.monthlyGoal=Number(document.getElementById('onMonthly').value||20);state.onboarded=true;save();view='Today';['Today','Gym','Month','Stats'].forEach(x=>{document.getElementById('view'+x).classList.toggle('active',x==='Today');document.getElementById('tab'+x).classList.toggle('active',x==='Today')});render();toast('MUVIT creado')}
if(!state.onboarded){renderOnboarding()}else{render()}
</script>
</body>
</html>
