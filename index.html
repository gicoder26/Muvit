<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>MUVIT</title>
  <style>
    :root{
      --bg:#0f0f10;
      --panel:#171719;
      --panel-2:#202024;
      --card:#1c1c20;
      --text:#f7f7f8;
      --muted:#a7a7ad;
      --soft:#74747d;
      --line:#2d2d33;
      --brand:#f7f7f8;
      --accent:#f4c542;
      --accent-2:#ff7a45;
      --ok:#72e0a8;
      --danger:#ff6b6b;
      --radius:22px;
      --shadow:0 16px 45px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at top left, rgba(244,197,66,.18), transparent 34%),
        radial-gradient(circle at 85% 5%, rgba(255,122,69,.12), transparent 28%),
        var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    }

    button,input,select,textarea{font:inherit}
    button{border:0;cursor:pointer;color:inherit}
    input,select,textarea{
      width:100%;
      border:1px solid var(--line);
      background:#121214;
      color:var(--text);
      border-radius:16px;
      padding:13px 14px;
      outline:none;
    }
    textarea{min-height:86px;resize:vertical}
    label{display:block;color:var(--muted);font-size:12px;margin:0 0 8px 2px}

    .app{max-width:480px;margin:0 auto;min-height:100vh;padding:18px 16px 92px}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;margin:6px 0 18px}
    .logo-wrap{display:flex;gap:12px;align-items:center}
    .logo{
      width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,#fff,#f1c847 60%,#ff7a45);
      display:grid;place-items:center;color:#111;font-weight:900;letter-spacing:-1px;box-shadow:var(--shadow)
    }
    .brand-title{font-size:25px;line-height:1;font-weight:900;letter-spacing:-.8px;margin-top:3px}
    .brand-date{font-size:13px;color:var(--muted);margin-top:6px}
    .icon-btn{width:44px;height:44px;border-radius:16px;background:rgba(255,255,255,.07);display:grid;place-items:center;border:1px solid rgba(255,255,255,.07)}

    .hero{
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
      border-radius:28px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px;
    }
    .eyebrow{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
    h1,h2,h3,p{margin:0}
    h1{font-size:28px;line-height:1.05;letter-spacing:-1px;margin-bottom:10px}
    h2{font-size:19px;letter-spacing:-.4px;margin-bottom:12px}
    h3{font-size:15px;letter-spacing:-.25px;margin-bottom:8px}
    p{color:var(--muted);line-height:1.45;font-size:14px}

    .grid{display:grid;gap:12px}
    .grid-2{grid-template-columns:1fr 1fr}
    .card{
      background:rgba(28,28,32,.94);
      border:1px solid rgba(255,255,255,.075);
      border-radius:var(--radius);
      padding:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.18);
    }
    .section{margin-top:16px}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .row-left{display:flex;gap:10px;align-items:center;min-width:0}
    .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.08);font-size:12px;color:var(--muted);border:1px solid rgba(255,255,255,.06)}
    .stat-num{font-size:25px;font-weight:900;letter-spacing:-.8px}
    .stat-label{font-size:12px;color:var(--muted);margin-top:3px}
    .btn{
      border-radius:16px;background:#fff;color:#111;padding:13px 15px;font-weight:800;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px
    }
    .btn.secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.08)}
    .btn.danger{background:rgba(255,107,107,.16);color:#ffd1d1;border:1px solid rgba(255,107,107,.35)}
    .btn.small{min-height:36px;padding:8px 10px;border-radius:13px;font-size:12px}
    .muted{color:var(--muted)}
    .tiny{font-size:12px;color:var(--muted)}
    .hide{display:none!important}

    .tabs{
      position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(452px,calc(100% - 24px));
      background:rgba(25,25,28,.88);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.09);
      border-radius:24px;padding:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;z-index:50;box-shadow:var(--shadow)
    }
    .tab{padding:9px 4px;border-radius:17px;background:transparent;color:var(--muted);font-size:11px;font-weight:700;text-align:center}
    .tab span{display:block;font-size:18px;margin-bottom:2px}
    .tab.active{background:#fff;color:#111}

    .quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .quick{
      display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;
      padding:14px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.065);
    }
    .quick.active{background:rgba(244,197,66,.18);border-color:rgba(244,197,66,.55)}
    .check{width:22px;height:22px;border-radius:8px;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;color:#111;background:transparent;font-size:13px;flex:0 0 auto}
    .quick.active .check{background:var(--accent);border-color:var(--accent)}

    .week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px}
    .day-dot{height:44px;border-radius:15px;background:rgba(255,255,255,.055);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.06);font-size:11px;color:var(--muted)}
    .day-dot.done{background:rgba(244,197,66,.18);color:var(--text);border-color:rgba(244,197,66,.45)}
    .day-dot.today{outline:2px solid rgba(255,255,255,.18)}

    .exercise-item,.group-item,.metric-item{
      background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.065);border-radius:18px;padding:13px;margin-top:10px
    }
    .item-title{font-weight:850;letter-spacing:-.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
    .actions{display:flex;gap:7px;flex-shrink:0}
    .action-btn{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center}

    .suggestions{position:relative}
    .suggestion-list{
      position:absolute;top:calc(100% + 6px);left:0;right:0;background:#19191d;border:1px solid var(--line);border-radius:16px;max-height:220px;overflow:auto;z-index:20;box-shadow:var(--shadow)
    }
    .suggestion{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
    .suggestion:last-child{border-bottom:0}

    .calendar-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 6px;color:var(--muted);font-size:11px;text-align:center}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .cal-day{height:52px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.055);display:flex;align-items:flex-start;justify-content:space-between;padding:8px;font-size:12px;color:var(--muted);position:relative}
    .cal-day.has{background:rgba(244,197,66,.16);border-color:rgba(244,197,66,.35);color:var(--text)}
    .cal-day.selected{outline:2px solid #fff}
    .cal-day .mark{position:absolute;bottom:7px;left:8px;width:8px;height:8px;border-radius:999px;background:var(--accent)}

    .chart{width:100%;height:180px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);border-radius:18px;margin-top:10px;overflow:hidden}
    svg{display:block;width:100%;height:100%}
    .empty{border:1px dashed rgba(255,255,255,.17);border-radius:18px;padding:16px;text-align:center;color:var(--muted);background:rgba(255,255,255,.025)}

    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:80;display:none;align-items:flex-end;justify-content:center;padding:14px}
    .modal-backdrop.open{display:flex}
    .modal{width:min(480px,100%);max-height:88vh;overflow:auto;background:#171719;border:1px solid rgba(255,255,255,.09);border-radius:28px;padding:18px;box-shadow:var(--shadow)}
    .form-grid{display:grid;gap:12px;margin-top:12px}
    .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

    .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;border-radius:16px;padding:12px 15px;font-weight:800;opacity:0;pointer-events:none;transition:.22s;z-index:100;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 40px)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media (max-width:360px){
      .app{padding-left:12px;padding-right:12px}.hero{padding:17px}h1{font-size:25px}.stat-num{font-size:22px}.quick-grid{grid-template-columns:1fr}.three{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="logo-wrap">
        <div class="logo">MV</div>
        <div>
          <div class="brand-title">MUVIT</div>
          <div class="brand-date" id="globalDate"></div>
        </div>
      </div>
      <button class="icon-btn" onclick="go('settings')" aria-label="Ajustes">⚙️</button>
    </header>

    <section id="view-home"></section>
    <section id="view-gym" class="hide"></section>
    <section id="view-month" class="hide"></section>
    <section id="view-stats" class="hide"></section>
    <section id="view-settings" class="hide"></section>
  </main>

  <nav class="tabs">
    <button class="tab active" data-tab="home" onclick="go('home')"><span>🏠</span>Hoy</button>
    <button class="tab" data-tab="gym" onclick="go('gym')"><span>🏋️</span>Gym</button>
    <button class="tab" data-tab="month" onclick="go('month')"><span>🗓️</span>Mes</button>
    <button class="tab" data-tab="stats" onclick="go('stats')"><span>📈</span>Stats</button>
    <button class="tab" data-tab="settings" onclick="go('settings')"><span>⚙️</span>Ajustes</button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'muvit_app_v2';
    const OLD_KEYS = ['muvitData','gymData','muvit_app','muvit'];
    const WEEK = ['L','M','M','J','V','S','D'];
    const WEEK_FULL = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
    const QUICK_OPTIONS = [
      {id:'gym', label:'Entrenamiento', icon:'🏋️'},
      {id:'cardio', label:'Cardio', icon:'🚶'},
      {id:'mobility', label:'Movilidad', icon:'🧘'},
      {id:'water', label:'Hidratación', icon:'💧'}
    ];
    const EXERCISES = [
      'Sentadilla','Sentadilla goblet','Sentadilla sumo','Sentadilla búlgara','Prensa de piernas','Hip thrust','Puente de glúteos','Peso muerto rumano','Peso muerto convencional','Peso muerto sumo','Zancadas','Caminata con zancadas','Step up','Curl femoral','Extensión de cuádriceps','Abducción de cadera','Aducción de cadera','Patada de glúteo en polea','Elevación de talones','Gemelos sentado','Gemelos de pie',
      'Jalón al pecho','Remo sentado','Remo con barra','Remo con mancuerna','Dominadas','Pull over en polea','Peso muerto','Face pull','Remo en máquina','Jalón agarre cerrado',
      'Press banca','Press inclinado','Press declinado','Press con mancuernas','Aperturas con mancuernas','Aperturas en máquina','Fondos','Flexiones','Cruce de poleas',
      'Press militar','Press hombro con mancuernas','Elevaciones laterales','Elevaciones frontales','Pájaros','Arnold press','Remo al mentón',
      'Curl bíceps','Curl martillo','Curl predicador','Curl en polea','Extensión de tríceps en polea','Press francés','Fondos para tríceps','Patada de tríceps','Extensión de tríceps sobre cabeza',
      'Plancha','Crunch','Crunch en máquina','Elevación de piernas','Russian twist','Mountain climbers','Dead bug','Hollow hold','Bicicleta abdominal','Plancha lateral',
      'Caminata inclinada','Bicicleta','Elíptica','Escaladora','Cuerda','Burpees','Battle rope','Sled push','Remo ergómetro'
    ];

    let state = loadState();
    let currentTab = 'home';
    let selectedMonthDate = new Date();
    let selectedCalendarDate = todayKey();

    function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
    function todayKey(){ return dateKey(new Date()); }
    function dateKey(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
    function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
    function mondayIndex(d=new Date()){ return (d.getDay()+6)%7; }
    function normalize(s=''){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
    function formatDate(d=new Date()){
      return d.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase());
    }
    function monthName(d=selectedMonthDate){ return d.toLocaleDateString('es-PE',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase()); }

    function defaultState(){
      return {
        version:2,
        createdAt:new Date().toISOString(),
        groups:[
          {id:uid(), name:'Piernas y glúteos', dayIndex:0, exercises:[
            {id:uid(), name:'Hip thrust', sets:'4', reps:'10', weight:'', notes:''},
            {id:uid(), name:'Sentadilla búlgara', sets:'3', reps:'10', weight:'', notes:''}
          ]},
          {id:uid(), name:'Espalda y bíceps', dayIndex:2, exercises:[
            {id:uid(), name:'Jalón al pecho', sets:'4', reps:'12', weight:'', notes:''},
            {id:uid(), name:'Remo sentado', sets:'3', reps:'12', weight:'', notes:''}
          ]},
          {id:uid(), name:'Core y movilidad', dayIndex:4, exercises:[
            {id:uid(), name:'Plancha', sets:'3', reps:'40 seg', weight:'', notes:''}
          ]}
        ],
        logs:{},
        bodyMetrics:[],
        settings:{weeklyGoal:5}
      };
    }

    function loadState(){
      let raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        try { return migrate(JSON.parse(raw)); } catch(e){}
      }
      for(const key of OLD_KEYS){
        const old = localStorage.getItem(key);
        if(old){
          try{
            const migrated = migrate(JSON.parse(old));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            return migrated;
          }catch(e){}
        }
      }
      const s = defaultState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
      return s;
    }

    function migrate(data){
      const base = defaultState();
      if(!data || typeof data !== 'object') return base;
      return {
        version:2,
        createdAt:data.createdAt || base.createdAt,
        groups:Array.isArray(data.groups) ? data.groups.map(g=>({
          id:g.id || uid(),
          name:g.name || g.title || 'Grupo sin nombre',
          dayIndex:Number.isInteger(g.dayIndex) ? g.dayIndex : null,
          exercises:Array.isArray(g.exercises) ? g.exercises.map(e=>({
            id:e.id || uid(), name:e.name || e.title || 'Ejercicio', sets:String(e.sets || ''), reps:String(e.reps || ''), weight:String(e.weight || ''), notes:e.notes || ''
          })) : []
        })) : base.groups,
        logs:data.logs && typeof data.logs==='object' ? data.logs : {},
        bodyMetrics:Array.isArray(data.bodyMetrics) ? data.bodyMetrics.map(m=>({
          id:m.id || uid(), date:m.date || todayKey(), weight:String(m.weight || ''), fat:String(m.fat || '')
        })) : [],
        settings:{weeklyGoal: Number(data.settings?.weeklyGoal || data.weeklyGoal || 5)}
      };
    }

    function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

    function getLog(k=todayKey()){
      if(!state.logs[k]) state.logs[k] = {quick:[], completedExercises:[], groupId:null, notes:'', status:'empty'};
      return state.logs[k];
    }
    function hasWorkout(k){ const l=state.logs[k]; return !!(l && (l.quick?.includes('gym') || l.completedExercises?.length || l.groupId)); }
    function monthKeys(date=selectedMonthDate){
      const y=date.getFullYear(), m=date.getMonth();
      const start = new Date(y,m,1), end = new Date(y,m+1,0);
      const arr=[]; for(let d=1; d<=end.getDate(); d++) arr.push(dateKey(new Date(y,m,d))); return arr;
    }
    function weekKeys(d=new Date()){
      const idx=mondayIndex(d); const monday=new Date(d); monday.setDate(d.getDate()-idx);
      return Array.from({length:7},(_,i)=>{ const x=new Date(monday); x.setDate(monday.getDate()+i); return dateKey(x); });
    }
    function currentStreak(){
      let streak=0; let d=new Date();
      while(true){ const k=dateKey(d); if(hasWorkout(k)){ streak++; d.setDate(d.getDate()-1); } else break; }
      return streak;
    }
    function bestStreak(){
      const keys=Object.keys(state.logs).filter(hasWorkout).sort(); if(!keys.length) return 0;
      let best=1, cur=1;
      for(let i=1;i<keys.length;i++){
        const prev=parseKey(keys[i-1]), now=parseKey(keys[i]); const diff=(now-prev)/(1000*60*60*24);
        if(diff===1) cur++; else cur=1; best=Math.max(best,cur);
      }
      return best;
    }

    function go(tab){
      currentTab=tab;
      ['home','gym','month','stats','settings'].forEach(t=>{
        document.getElementById('view-'+t).classList.toggle('hide',t!==tab);
        document.querySelector(`[data-tab="${t}"]`).classList.toggle('active',t===tab);
      });
      render();
    }

    function render(){
      document.getElementById('globalDate').textContent = formatDate(new Date());
      if(currentTab==='home') renderHome();
      if(currentTab==='gym') renderGym();
      if(currentTab==='month') renderMonth();
      if(currentTab==='stats') renderStats();
      if(currentTab==='settings') renderSettings();
    }

    function renderHome(){
      const log=getLog();
      const todayIdx=mondayIndex();
      const todayPlan=state.groups.find(g=>g.dayIndex===todayIdx) || state.groups[0];
      const wKeys=weekKeys();
      const weekCount=wKeys.filter(hasWorkout).length;
      const goal=state.settings.weeklyGoal || 5;
      const view=document.getElementById('view-home');
      view.innerHTML=`
        <div class="hero">
          <div class="eyebrow">Hoy suma</div>
          <h1>Registra tu entrenamiento y sigue avanzando.</h1>
          <p>No necesitas hacerlo perfecto. Necesitas volver, marcarlo y construir constancia.</p>
        </div>

        <div class="grid grid-2">
          <div class="card"><div class="stat-num">🔥 ${currentStreak()}</div><div class="stat-label">Racha actual</div></div>
          <div class="card"><div class="stat-num">${weekCount}/${goal}</div><div class="stat-label">Entrenamientos esta semana</div></div>
        </div>

        <div class="card section">
          <div class="row"><h2>Tu semana</h2><span class="pill">Mejor racha: ${bestStreak()} días</span></div>
          <div class="week">
            ${wKeys.map((k,i)=>`<div class="day-dot ${hasWorkout(k)?'done':''} ${k===todayKey()?'today':''}"><strong>${WEEK[i]}</strong><span>${parseKey(k).getDate()}</span></div>`).join('')}
          </div>
        </div>

        <div class="card section">
          <div class="row"><h2>Registrar rápido</h2><span class="tiny">Toca para marcar o desmarcar</span></div>
          <div class="quick-grid">
            ${QUICK_OPTIONS.map(o=>`<button class="quick ${log.quick.includes(o.id)?'active':''}" onclick="toggleQuick('${o.id}')"><span class="check">${log.quick.includes(o.id)?'✓':''}</span><span>${o.icon} ${o.label}</span></button>`).join('')}
          </div>
        </div>

        <div class="card section">
          <div class="row"><h2>Plan de hoy</h2><button class="btn secondary small" onclick="openPlanModal()">Cambiar</button></div>
          ${todayPlan ? `
            <div class="pill">${WEEK_FULL[todayPlan.dayIndex ?? todayIdx] || 'Sin día fijo'}</div>
            <h1 style="font-size:24px;margin-top:12px">${escapeHtml(todayPlan.name)}</h1>
            <p>${todayPlan.exercises.length} ejercicios guardados en Gym.</p>
            <div class="grid" style="margin-top:12px">
              ${todayPlan.exercises.slice(0,4).map(e=>`<div class="exercise-item"><div class="row"><div><div class="item-title">${escapeHtml(e.name)}</div><div class="item-meta">${e.sets || '-'} series · ${e.reps || '-'} reps ${e.weight ? '· '+escapeHtml(e.weight)+' kg' : ''}</div></div><button class="action-btn" onclick="toggleExerciseDone('${todayPlan.id}','${e.id}')">${log.completedExercises.includes(e.id)?'✓':'○'}</button></div></div>`).join('')}
            </div>
          ` : `<div class="empty">Crea tu primer grupo en Gym para ver tu plan de hoy.</div>`}
        </div>
      `;
    }

    function toggleQuick(id){
      const log=getLog();
      log.quick = log.quick || [];
      log.quick = log.quick.includes(id) ? log.quick.filter(x=>x!==id) : [...log.quick,id];
      if(id==='gym' && log.quick.includes(id) && !log.groupId){
        const plan=state.groups.find(g=>g.dayIndex===mondayIndex()) || state.groups[0];
        if(plan) log.groupId=plan.id;
      }
      save(); renderHome();
    }
    function toggleExerciseDone(groupId, exerciseId){
      const log=getLog(); log.groupId=groupId; log.quick=[...new Set([...(log.quick||[]),'gym'])];
      log.completedExercises = log.completedExercises || [];
      log.completedExercises = log.completedExercises.includes(exerciseId) ? log.completedExercises.filter(x=>x!==exerciseId) : [...log.completedExercises,exerciseId];
      save(); renderHome();
    }

    function renderGym(){
      document.getElementById('view-gym').innerHTML=`
        <div class="hero"><div class="eyebrow">Rutina</div><h1>Arma tu plan y corrígelo cuando lo necesites.</h1><p>Los cambios de Gym se reflejan en Hoy, Mes y Stats.</p></div>
        <button class="btn" style="width:100%" onclick="openGroupModal()">+ Crear grupo muscular</button>
        <div class="section grid">
          ${state.groups.map(g=>`
            <div class="card">
              <div class="row">
                <div><h2>${escapeHtml(g.name)}</h2><p>${g.dayIndex===null || g.dayIndex===undefined ? 'Sin día fijo' : WEEK_FULL[g.dayIndex]} · ${g.exercises.length} ejercicios</p></div>
                <div class="actions"><button class="action-btn" onclick="openGroupModal('${g.id}')">✏️</button><button class="action-btn" onclick="deleteGroup('${g.id}')">🗑️</button></div>
              </div>
              <div style="margin-top:10px">
                ${g.exercises.map(e=>`
                  <div class="exercise-item">
                    <div class="row">
                      <div><div class="item-title">${escapeHtml(e.name)}</div><div class="item-meta">${e.sets || '-'} series · ${e.reps || '-'} reps ${e.weight ? '· '+escapeHtml(e.weight)+' kg' : ''}${e.notes ? '<br>'+escapeHtml(e.notes) : ''}</div></div>
                      <div class="actions"><button class="action-btn" onclick="openExerciseModal('${g.id}','${e.id}')">✏️</button><button class="action-btn" onclick="deleteExercise('${g.id}','${e.id}')">🗑️</button></div>
                    </div>
                  </div>`).join('')}
              </div>
              <button class="btn secondary" style="width:100%;margin-top:12px" onclick="openExerciseModal('${g.id}')">+ Agregar ejercicio</button>
            </div>`).join('')}
        </div>
      `;
    }

    function renderMonth(){
      const y=selectedMonthDate.getFullYear(), m=selectedMonthDate.getMonth();
      const first=new Date(y,m,1); const offset=mondayIndex(first); const days=new Date(y,m+1,0).getDate();
      const cells=[]; for(let i=0;i<offset;i++) cells.push(null); for(let d=1;d<=days;d++) cells.push(new Date(y,m,d));
      const selectedLog=state.logs[selectedCalendarDate];
      const selectedGroup=selectedLog?.groupId ? state.groups.find(g=>g.id===selectedLog.groupId) : null;
      document.getElementById('view-month').innerHTML=`
        <div class="hero"><div class="eyebrow">Calendario</div><h1>Tu historial, día por día.</h1><p>Toca una fecha para ver qué registraste.</p></div>
        <div class="card">
          <div class="row"><button class="btn secondary small" onclick="changeMonth(-1)">←</button><h2>${monthName()}</h2><button class="btn secondary small" onclick="changeMonth(1)">→</button></div>
          <div class="calendar-head">${WEEK.map(d=>`<div>${d}</div>`).join('')}</div>
          <div class="calendar">
            ${cells.map(d=> d ? `<button class="cal-day ${hasWorkout(dateKey(d))?'has':''} ${selectedCalendarDate===dateKey(d)?'selected':''}" onclick="selectDay('${dateKey(d)}')"><span>${d.getDate()}</span>${hasWorkout(dateKey(d))?'<span class="mark"></span>':''}</button>` : `<div></div>`).join('')}
          </div>
        </div>
        <div class="card section">
          <div class="row"><h2>${formatDate(parseKey(selectedCalendarDate))}</h2><span class="pill">${hasWorkout(selectedCalendarDate)?'Completado':'Sin entrenamiento'}</span></div>
          ${selectedLog && hasWorkout(selectedCalendarDate) ? `
            <p>${selectedGroup ? 'Grupo: '+escapeHtml(selectedGroup.name) : 'Registro rápido guardado.'}</p>
            <div class="section">
              ${(selectedLog.quick||[]).map(q=>`<span class="pill">${QUICK_OPTIONS.find(o=>o.id===q)?.icon || '•'} ${QUICK_OPTIONS.find(o=>o.id===q)?.label || q}</span>`).join(' ')}
            </div>
            ${selectedGroup ? `<div style="margin-top:12px">${selectedGroup.exercises.filter(e=>selectedLog.completedExercises?.includes(e.id)).map(e=>`<div class="exercise-item"><div class="item-title">${escapeHtml(e.name)}</div><div class="item-meta">${e.sets || '-'} series · ${e.reps || '-'} reps</div></div>`).join('') || '<p>No marcaste ejercicios específicos.</p>'}</div>` : ''}
          ` : `<div class="empty">Este día todavía no tiene registros. Cuando entrenes, aparecerá aquí.</div>`}
        </div>
      `;
    }
    function changeMonth(delta){ selectedMonthDate.setMonth(selectedMonthDate.getMonth()+delta); renderMonth(); }
    function selectDay(k){ selectedCalendarDate=k; renderMonth(); }

    function renderStats(){
      const keys=monthKeys(); const monthWorkouts=keys.filter(hasWorkout).length;
      const weeksInMonth=Math.max(1, Math.ceil(keys.length/7));
      const avg=(monthWorkouts/weeksInMonth).toFixed(1);
      const groupCounts={};
      keys.forEach(k=>{ const gid=state.logs[k]?.groupId; if(gid) groupCounts[gid]=(groupCounts[gid]||0)+1; });
      const topGroupId=Object.entries(groupCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];
      const lowGroupId=state.groups.map(g=>[g.id,groupCounts[g.id]||0]).sort((a,b)=>a[1]-b[1])[0]?.[0];
      const topGroup=state.groups.find(g=>g.id===topGroupId);
      const lowGroup=state.groups.find(g=>g.id===lowGroupId);
      const bestWeekCount = bestWeekInMonth();
      document.getElementById('view-stats').innerHTML=`
        <div class="hero"><div class="eyebrow">Progreso</div><h1>Stats que te ayudan a decidir tu siguiente entrenamiento.</h1><p>Menos ruido, más señales útiles.</p></div>
        <div class="grid grid-2">
          <div class="card"><div class="stat-num">${monthWorkouts}</div><div class="stat-label">Entrenamientos del mes</div></div>
          <div class="card"><div class="stat-num">${avg}</div><div class="stat-label">Promedio semanal</div></div>
          <div class="card"><div class="stat-num">${bestWeekCount}</div><div class="stat-label">Mejor semana</div></div>
          <div class="card"><div class="stat-num">🔥 ${currentStreak()}</div><div class="stat-label">Racha actual</div></div>
        </div>

        <div class="card section">
          <div class="row"><h2>Evolución corporal</h2><button class="btn secondary small" onclick="openMetricModal()">+ Registro</button></div>
          <h3>Peso</h3>${renderLineChart('weight')}
          <h3 style="margin-top:14px">Porcentaje de grasa</h3>${renderLineChart('fat')}
          <div style="margin-top:10px">
            ${state.bodyMetrics.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(m=>`<div class="metric-item"><div class="row"><div><div class="item-title">${formatDate(parseKey(m.date))}</div><div class="item-meta">Peso: ${m.weight || '-'} kg · Grasa: ${m.fat || '-'}%</div></div><div class="actions"><button class="action-btn" onclick="openMetricModal('${m.id}')">✏️</button><button class="action-btn" onclick="deleteMetric('${m.id}')">🗑️</button></div></div></div>`).join('')}
          </div>
        </div>

        <div class="card section">
          <h2>Insight del mes</h2>
          ${monthWorkouts ? `<p>Este mes registraste <strong style="color:#fff">${monthWorkouts}</strong> entrenamientos. Tu grupo más trabajado fue <strong style="color:#fff">${escapeHtml(topGroup?.name || 'sin grupo')}</strong>. Tu mejor semana tuvo <strong style="color:#fff">${bestWeekCount}</strong> entrenamientos.</p><p style="margin-top:10px">${lowGroup ? 'Podrías equilibrar tu rutina sumando una sesión de '+escapeHtml(lowGroup.name)+' esta semana.' : 'Sigue registrando para recibir mejores señales.'}</p>` : `<div class="empty">Registra tu primer entrenamiento del mes para ver insights reales.</div>`}
        </div>
      `;
    }

    function bestWeekInMonth(){
      const keys=monthKeys(); let best=0;
      for(let i=0;i<keys.length;i+=7) best=Math.max(best, keys.slice(i,i+7).filter(hasWorkout).length);
      return best;
    }

    function renderLineChart(field){
      const data=state.bodyMetrics.filter(m=>m[field]!=='' && !isNaN(Number(m[field]))).sort((a,b)=>a.date.localeCompare(b.date));
      if(data.length<2) return `<div class="empty">Agrega al menos 2 registros para ver tu evolución.</div>`;
      const w=360,h=160,p=24;
      const vals=data.map(m=>Number(m[field])); const min=Math.min(...vals), max=Math.max(...vals); const range=max-min || 1;
      const points=data.map((m,i)=>{
        const x=p + (i*(w-2*p))/(data.length-1);
        const y=h-p - ((Number(m[field])-min)/range)*(h-2*p);
        return {x,y,val:m[field],date:m.date};
      });
      const poly=points.map(p=>`${p.x},${p.y}`).join(' ');
      return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="rgba(255,255,255,.15)" />
        <polyline points="${poly}" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        ${points.map(pt=>`<circle cx="${pt.x}" cy="${pt.y}" r="4" fill="#f4c542"><title>${pt.date}: ${pt.val}</title></circle><text x="${pt.x}" y="${Math.max(14,pt.y-8)}" fill="rgba(255,255,255,.8)" font-size="10" text-anchor="middle">${pt.val}</text>`).join('')}
      </svg></div>`;
    }

    function renderSettings(){
      document.getElementById('view-settings').innerHTML=`
        <div class="hero"><div class="eyebrow">Ajustes</div><h1>Controla tus datos y tu meta semanal.</h1><p>Tu información se guarda en este celular usando almacenamiento local.</p></div>
        <div class="card">
          <label>Meta semanal de entrenamientos</label>
          <input type="number" min="1" max="7" value="${state.settings.weeklyGoal}" onchange="state.settings.weeklyGoal=Number(this.value||5);save();renderSettings();showToast('Meta actualizada')" />
        </div>
        <div class="card section grid">
          <button class="btn secondary" onclick="exportData()">Exportar datos</button>
          <button class="btn secondary" onclick="document.getElementById('importFile').click()">Importar datos</button>
          <input id="importFile" class="hide" type="file" accept="application/json" onchange="importData(event)" />
        </div>
        <div class="card section">
          <h2>Zona de seguridad</h2>
          <p>Usa esto solo si quieres empezar desde cero en este dispositivo.</p>
          <button class="btn danger" style="width:100%;margin-top:12px" onclick="resetApp()">Reiniciar app</button>
        </div>
      `;
    }

    function openModal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('modalBackdrop').classList.add('open'); }
    function closeModal(e){ if(!e || e.target.id==='modalBackdrop'){ document.getElementById('modalBackdrop').classList.remove('open'); document.getElementById('modal').innerHTML=''; } }

    function openGroupModal(id=null){
      const g=id ? state.groups.find(x=>x.id===id) : {name:'', dayIndex:null};
      openModal(`<div class="row"><h2>${id?'Editar grupo':'Nuevo grupo'}</h2><button class="icon-btn" onclick="closeModal()">×</button></div>
        <div class="form-grid">
          <div><label>Nombre del grupo</label><input id="groupName" value="${escapeAttr(g.name||'')}" placeholder="Ej. Piernas y glúteos" /></div>
          <div><label>Día sugerido</label><select id="groupDay"><option value="">Sin día fijo</option>${WEEK_FULL.map((d,i)=>`<option value="${i}" ${g.dayIndex===i?'selected':''}>${d}</option>`).join('')}</select></div>
          <button class="btn" onclick="saveGroup('${id||''}')">Guardar grupo</button>
        </div>`);
    }
    function saveGroup(id){
      const name=document.getElementById('groupName').value.trim() || 'Grupo sin nombre';
      const dayVal=document.getElementById('groupDay').value;
      if(id){ const g=state.groups.find(x=>x.id===id); g.name=name; g.dayIndex=dayVal===''?null:Number(dayVal); }
      else state.groups.push({id:uid(), name, dayIndex:dayVal===''?null:Number(dayVal), exercises:[]});
      save(); closeModal(); render(); showToast('Grupo guardado');
    }
    function deleteGroup(id){ if(!confirm('¿Eliminar este grupo?')) return; state.groups=state.groups.filter(g=>g.id!==id); Object.values(state.logs).forEach(l=>{ if(l.groupId===id) l.groupId=null; }); save(); renderGym(); }

    function openExerciseModal(groupId, exerciseId=null){
      const group=state.groups.find(g=>g.id===groupId); const e=exerciseId ? group.exercises.find(x=>x.id===exerciseId) : {name:'',sets:'',reps:'',weight:'',notes:''};
      openModal(`<div class="row"><h2>${exerciseId?'Editar ejercicio':'Nuevo ejercicio'}</h2><button class="icon-btn" onclick="closeModal()">×</button></div>
        <div class="form-grid">
          <div class="suggestions"><label>Ejercicio</label><input id="exName" value="${escapeAttr(e.name)}" placeholder="Busca o escribe un ejercicio" oninput="showSuggestions(this.value)" autocomplete="off" /><div id="suggestions" class="suggestion-list hide"></div></div>
          <div class="three"><div><label>Series</label><input id="exSets" value="${escapeAttr(e.sets)}" placeholder="4" /></div><div><label>Reps</label><input id="exReps" value="${escapeAttr(e.reps)}" placeholder="10" /></div><div><label>Peso</label><input id="exWeight" value="${escapeAttr(e.weight)}" placeholder="kg" /></div></div>
          <div><label>Notas</label><textarea id="exNotes" placeholder="Ej. Subir peso la próxima semana">${escapeHtml(e.notes)}</textarea></div>
          <button class="btn" onclick="saveExercise('${groupId}','${exerciseId||''}')">Guardar ejercicio</button>
        </div>`);
    }
    function showSuggestions(q){
      const box=document.getElementById('suggestions'); const nq=normalize(q);
      if(!nq){ box.classList.add('hide'); box.innerHTML=''; return; }
      const hits=EXERCISES.filter(x=>normalize(x).includes(nq)).slice(0,14);
      box.innerHTML=hits.map(x=>`<div class="suggestion" onclick="document.getElementById('exName').value='${escapeAttr(x)}';document.getElementById('suggestions').classList.add('hide')">${escapeHtml(x)}</div>`).join('');
      box.classList.toggle('hide',hits.length===0);
    }
    function saveExercise(groupId, exerciseId){
      const group=state.groups.find(g=>g.id===groupId);
      const data={name:document.getElementById('exName').value.trim()||'Ejercicio',sets:document.getElementById('exSets').value.trim(),reps:document.getElementById('exReps').value.trim(),weight:document.getElementById('exWeight').value.trim(),notes:document.getElementById('exNotes').value.trim()};
      if(exerciseId){ const e=group.exercises.find(x=>x.id===exerciseId); Object.assign(e,data); }
      else group.exercises.push({id:uid(),...data});
      save(); closeModal(); renderGym(); showToast('Ejercicio guardado');
    }
    function deleteExercise(groupId, exerciseId){ if(!confirm('¿Eliminar este ejercicio?')) return; const g=state.groups.find(x=>x.id===groupId); g.exercises=g.exercises.filter(e=>e.id!==exerciseId); Object.values(state.logs).forEach(l=>{ l.completedExercises=(l.completedExercises||[]).filter(id=>id!==exerciseId); }); save(); renderGym(); }

    function openPlanModal(){
      const log=getLog();
      openModal(`<div class="row"><h2>Cambiar plan de hoy</h2><button class="icon-btn" onclick="closeModal()">×</button></div>
        <div class="form-grid">
          <div><label>Grupo muscular</label><select id="todayGroup">${state.groups.map(g=>`<option value="${g.id}" ${log.groupId===g.id?'selected':''}>${escapeHtml(g.name)}</option>`).join('')}</select></div>
          <button class="btn" onclick="saveTodayPlan()">Usar este plan hoy</button>
        </div>`);
    }
    function saveTodayPlan(){ const log=getLog(); log.groupId=document.getElementById('todayGroup').value; log.quick=[...new Set([...(log.quick||[]),'gym'])]; save(); closeModal(); renderHome(); }

    function openMetricModal(id=null){
      const m=id ? state.bodyMetrics.find(x=>x.id===id) : {date:todayKey(),weight:'',fat:''};
      openModal(`<div class="row"><h2>${id?'Editar registro':'Nuevo registro corporal'}</h2><button class="icon-btn" onclick="closeModal()">×</button></div>
        <div class="form-grid">
          <div><label>Fecha</label><input id="metricDate" type="date" value="${m.date}" /></div>
          <div class="grid grid-2"><div><label>Peso</label><input id="metricWeight" inputmode="decimal" value="${escapeAttr(m.weight)}" placeholder="kg" /></div><div><label>% grasa</label><input id="metricFat" inputmode="decimal" value="${escapeAttr(m.fat)}" placeholder="%" /></div></div>
          <button class="btn" onclick="saveMetric('${id||''}')">Guardar registro</button>
        </div>`);
    }
    function saveMetric(id){
      const data={date:document.getElementById('metricDate').value||todayKey(),weight:document.getElementById('metricWeight').value.trim(),fat:document.getElementById('metricFat').value.trim()};
      if(id){ Object.assign(state.bodyMetrics.find(x=>x.id===id),data); }
      else state.bodyMetrics.push({id:uid(),...data});
      save(); closeModal(); renderStats(); showToast('Registro guardado');
    }
    function deleteMetric(id){ if(!confirm('¿Eliminar este registro?')) return; state.bodyMetrics=state.bodyMetrics.filter(m=>m.id!==id); save(); renderStats(); }

    function exportData(){
      const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='muvit-backup.json'; a.click(); URL.revokeObjectURL(a.href); showToast('Backup descargado');
    }
    function importData(event){
      const file=event.target.files[0]; if(!file) return;
      const reader=new FileReader(); reader.onload=()=>{ try{ state=migrate(JSON.parse(reader.result)); save(); render(); showToast('Datos importados'); }catch(e){ alert('No se pudo importar el archivo.'); } }; reader.readAsText(file);
    }
    function resetApp(){ if(!confirm('Esto borrará los datos de MUVIT en este celular. ¿Continuar?')) return; localStorage.removeItem(STORAGE_KEY); state=defaultState(); save(); render(); showToast('App reiniciada'); }

    function escapeHtml(str=''){ return String(str).replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function escapeAttr(str=''){ return escapeHtml(str).replace(/`/g,'&#96;'); }

    render();
  </script>
</body>
</html>
