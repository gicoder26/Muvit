function emptyDay(){return {gym:{sets:{},omitted:[],extras:[]},activities:[]}}
function getDay(st,iso){return st.sessions?.[iso]||emptyDay()}
function updateDay(setSt,iso,fn){setSt(s=>{const d=getDay(s,iso);return {...s,sessions:{...s.sessions,[iso]:fn(JSON.parse(JSON.stringify(d)))}}})}
function noTraining(st,iso){const d=getDay(st,iso);return (d.activities||[]).some(a=>a.type==='none')}
function hasGym(st,iso){if(noTraining(st,iso))return false;const d=getDay(st,iso);return (d.activities||[]).some(a=>a.type==='gym')||Object.values(d.gym?.sets||{}).some(arr=>arr?.some(x=>x?.done))}
function dayActs(st,iso){if(noTraining(st,iso))return [];const d=getDay(st,iso);const a=[...(d.activities||[]).filter(x=>x.type!=='none')];if(hasGym(st,iso)&&!a.some(x=>x.type==='gym'))a.unshift({id:'auto-gym',type:'gym'});return a}
function markActivity(setSt,iso,type){updateDay(setSt,iso,d=>{d.activities=d.activities||[];if(type==='none'){d.activities=[{id:gid(),type:'none',ts:Date.now()}];return d}d.activities=d.activities.filter(a=>a.type!=='none');if(!d.activities.some(a=>a.type===type))d.activities.push({id:gid(),type,ts:Date.now()});return d})}

function weekDates(base=todayISO()){const d=iso2d(base),diff=d.getDay()===0?-6:1-d.getDay(),start=new Date(d);start.setDate(d.getDate()+diff);return Array.from({length:7},(_,i)=>{const x=new Date(start);x.setDate(start.getDate()+i);return x})}
function calcStreak(st){let n=0,d=new Date();for(let i=0;i<180;i++){const iso=dk(d);if(dayActs(st,iso).length)n++;else if(iso===todayISO()){}else break;d.setDate(d.getDate()-1)}return n}
function isTrainingActivity(type){return type && type!=='sauna' && type!=='none'}
function rangeStats(st,dates){const counts=Object.fromEntries(ACT_ORDER.map(k=>[k,0]));let activeDays=0,total=0,care=0,vol=0;dates.forEach(dt=>{const iso=dk(dt),acts=dayActs(st,iso);if(acts.some(a=>isTrainingActivity(a.type)))activeDays++;acts.forEach(a=>{counts[a.type]=(counts[a.type]||0)+1;if(isTrainingActivity(a.type))total++;else if(a.type==='sauna')care++});const g=getDay(st,iso).gym;Object.values(g.sets||{}).forEach(arr=>(arr||[]).forEach(s=>{if(s?.done&&s.weight&&s.reps)vol+=Number(s.weight)*Number(s.reps)}))});return{counts,activeDays,total,care,vol}}

function exerciseHistory(st,ex){const names=allExerciseNames(st);const target=String(ex.name||'').toLowerCase();const hist=[];for(const[iso,day]of Object.entries(st.sessions||{})){for(const[id,arr]of Object.entries(day.gym?.sets||{})){if((names[id]||'').toLowerCase()!==target)continue;(arr||[]).forEach(s=>{if(s?.done&&s.weight)hist.push({iso,weight:Number(s.weight),reps:Number(s.reps)||0})})}}hist.sort((a,b)=>a.iso.localeCompare(b.iso));return{last:hist[hist.length-1]||null,best:hist.slice().sort((a,b)=>b.weight-a.weight)[0]||null,all:hist}}

function BodyMetricChart({items=[],field,label,suffix}){

  if(!rows.length){
    return <div className="empty" style={{border:'none',background:'transparent'}}>Aún no hay datos de {label.toLowerCase()}.</div>;
  }

    return <div style={{padding:'18px 4px'}}>

      <div className="D" style={{fontSize:36,marginTop:6}}>{rows[0].value}<span style={{fontSize:13,color:'var(--muted)'}}>{suffix}</span></div>

    <div className="line" style={{height:105}}>
      {rows.slice(-8).map((r,i)=>{

    <div className="M" style={{fontSize:10,color:'var(--muted)',marginTop:8}}>

  </div>;
}

function muscleGroupFromExercise(ex){
  const txt=String(`${ex?.muscle||''} ${ex?.name||''}`).toLowerCase();
  if(txt.includes('glúte')||txt.includes('glute')||txt.includes('hip thrust')||txt.includes('abductor')||txt.includes('patada'))return 'Glúteos';
  if(txt.includes('femoral')||txt.includes('posterior')||txt.includes('rumano')||txt.includes('peso muerto'))return 'Posterior';
  if(txt.includes('cuádr')||txt.includes('cuadr')||txt.includes('prensa')||txt.includes('sentadilla')||txt.includes('extensión'))return 'Cuádriceps';
  if(txt.includes('espalda')||txt.includes('jalón')||txt.includes('jalon')||txt.includes('remo')||txt.includes('pull down')||txt.includes('dominada'))return 'Espalda';
  if(txt.includes('pecho')||txt.includes('press banca')||txt.includes('apertura'))return 'Pecho';
  if(txt.includes('hombro')||txt.includes('militar')||txt.includes('laterales')||txt.includes('face pull'))return 'Hombros';
  if(txt.includes('bíceps')||txt.includes('biceps')||txt.includes('curl'))return 'Bíceps';
  if(txt.includes('tríceps')||txt.includes('triceps')||txt.includes('fondos'))return 'Tríceps';
  if(txt.includes('core')||txt.includes('abdomen')||txt.includes('plancha')||txt.includes('crunch')||txt.includes('piernas'))return 'Core';
  if(txt.includes('cardio')||txt.includes('cinta')||txt.includes('escaladora'))return 'Cardio';
  return 'Otros';
}
function weeklyMuscleGroups(st,base=todayISO()){
  const dates=weekDates(base).map(dk),names=allExerciseNames(st),counts={};
  dates.forEach(iso=>{
    const day=getDay(st,iso),baseDay=st.routine?.[iso2d(iso).getDay()]||{exercises:[]};
    const exMap={};
    (baseDay.exercises||[]).forEach(e=>exMap[e.id]=e);
    (day.gym?.extras||[]).forEach(e=>exMap[e.id]=e);
    Object.entries(day.gym?.sets||{}).forEach(([id,arr])=>{
      const done=(arr||[]).some(s=>s?.done);
      if(!done)return;
      const ex=exMap[id]||{name:names[id]||''};
      const group=muscleGroupFromExercise(ex);
      counts[group]=(counts[group]||0)+1;
    });
  });
  return Object.entries(counts).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
}

function Stats({st,onAv}){const allDates=Object.keys(st.sessions||{}).sort(),allStats=rangeStats(st,allDates.map(iso2d)),activeDays=allStats.activeDays,totalTrainings=allStats.total,gymDays=allDates.filter(iso=>hasGym(st,iso)).length,weeks=Array.from({length:8},(_,i)=>{const end=new Date();end.setDate(end.getDate()-(7-i)*7);return rangeStats(st,weekDates(dk(end)))}),weeklyGroups=weeklyMuscleGroups(st,todayISO()),maxGroup=Math.max(1,...weeklyGroups.map(g=>g.count)),maxW=Math.max(1,...weeks.map(w=>w.total));const names=allExerciseNames(st),prs=[];let setCount=0;Object.values(st.sessions||{}).forEach(day=>Object.entries(day.gym?.sets||{}).forEach(([id,arr])=>(arr||[]).forEach(s=>{if(s?.done){setCount++;if(s.weight)prs.push({name:names[id]||'Ejercicio',kg:Number(s.weight),reps:s.reps||0})}})));prs.sort((a,b)=>b.kg-a.kg);const unique=[];prs.forEach(p=>{if(!unique.some(u=>u.name===p.name))unique.push(p)});const body=st.user.bodyLog||[],avgWeek=weeks.length?(weeks.reduce((n,w)=>n+w.total,0)/weeks.length).toFixed(1):'0';return <div className="body fade"><TB user={st.user} sub="Análisis de progreso" onAv={onAv}/><div className="grid2"><div className="kpi"><div className="L">Entrenamientos</div><div className="num">{totalTrainings}</div><div className="M" style={{fontSize:9,color:'var(--muted)',marginTop:5}}>Desde que iniciaste</div></div><div className="kpi"><div className="L">Días activos</div><div className="num">{activeDays}</div><div className="M" style={{fontSize:9,color:'var(--muted)',marginTop:5}}>{avgWeek} prom./semana</div></div></div><div className="grid2" style={{marginTop:10}}><div className="kpi"><div className="L">Sesiones gym</div><div className="num">{gymDays}</div><div className="M" style={{fontSize:9,color:'var(--muted)',marginTop:5}}>Con ejercicios registrados</div></div><div className="kpi"><div className="L">Sauna</div><div className="num">{allStats.counts.sauna||0}</div><div className="M" style={{fontSize:9,color:'var(--muted)',marginTop:5}}>Cuidado acumulado</div></div></div><Section>Grupos musculares esta semana</Section><div className="chart">{weeklyGroups.length===0?<div className="empty">Aún no hay grupos musculares registrados esta semana.</div>:weeklyGroups.map(g=><div className="hbar" key={g.name}><label>{g.name}</label><div className="track"><div className="fill" style={{width:`${g.count/maxGroup*100}%`}}/></div><b>{g.count}</b></div>)}</div><Section>Entrenamientos por semana</Section><div className="chart"><div className="bars">{weeks.map((w,i)=><div key={i} className="bar" style={{height:`${Math.max(4,w.total/maxW*100)}%`}}><span>{w.total}</span></div>)}</div><div className="xaxis">{weeks.map((_,i)=><span key={i}>S{i+1}</span>)}</div></div><Section>Distribución acumulada</Section><div className="chart">{ACT_ORDER.map(t=>{const max=Math.max(1,...ACT_ORDER.map(k=>allStats.counts[k]||0));return <div className="hbar" key={t}><label>{ACTS[t].emoji} {ACTS[t].label}</label><div className="track"><div className="fill" style={{width:`${(allStats.counts[t]||0)/max*100}%`}}/></div><b>{allStats.counts[t]||0}</b></div>})}</div><Section>Récords de fuerza</Section><div>{unique.length===0?<div className="empty card">Completa series para ver récords y comparativas.</div>:unique.slice(0,7).map((p,i)=><div key={i} className="card" style={{marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}><div><div className="D" style={{fontSize:15}}>{p.name.toUpperCase()}</div><div className="M" style={{fontSize:9,color:'var(--muted)',marginTop:4}}>{p.reps} reps</div></div><div className="D" style={{fontSize:28}}>{p.kg}<span style={{fontSize:11,color:'var(--muted)'}}>kg</span></div></div>)}</div><Section>Evolución corporal</Section><MiniBodyChart items={body} field="weightKg" label="Peso" suffix="kg"/><div style={{height:10}}/><MiniBodyChart items={body} field="bodyFatPct" label="Grasa corporal" suffix="%"/></div>}

function exportData(st){
  try{
    const payload={app:'MUVIT',version:'muvit_v3',exportedAt:new Date().toISOString(),data:st};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`muvit-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),500);
  }catch(e){
    alert('No se pudo exportar el backup.');
  }
}
function importDataFile(event,setSt,onDone){
  const file=event.target.files&&event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      const incoming=parsed.data||parsed;
      const migrated=migrate(incoming);
      const ok=confirm('¿Importar este backup? Reemplazará los datos actuales guardados en este dispositivo.');
      if(!ok)return;
      setSt(migrated);
      try{localStorage.setItem(KEY,JSON.stringify(migrated))}catch(e){}
      onDone&&onDone();
      alert('Backup importado correctamente.');
    }catch(e){
      alert('No se pudo importar. Revisa que sea un archivo de backup de MUVIT.');
    }finally{
      event.target.value='';
    }
  };
  reader.readAsText(file);
}


function clearAppCacheOnly(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations()
        .then(regs=>regs.forEach(reg=>reg.unregister()))
        .catch(()=>{});
    }
    if(window.caches){
      caches.keys()
        .then(keys=>keys.forEach(k=>caches.delete(k)))
        .catch(()=>{});
    }
  }catch(e){}
}
function updateAppVersion(){
  clearAppCacheOnly();
  const base=window.location.origin+window.location.pathname;
  const sep=base.includes('?')?'&':'?';
  window.location.href=base+sep+'v='+Date.now();
}

function ProfileModal({st,setSt,onClose}){const [name,setName]=useState(st.user.name||''),[goal,setGoal]=useState(st.user.goal||'Bajar grasa'),[wt,setWt]=useState(st.user.weightKg||''),[bf,setBf]=useState(st.user.bodyFatPct||''),[mg,setMg]=useState(st.user.monthlyGoalGym||12),[mm,setMm]=useState(st.user.monthlyGoalMove||20),[edit,setEdit]=useState(false);const save=()=>{setSt(s=>{const stages=goal!==s.user.goal?[...(s.user.stages||[]),{id:gid(),goal,start:todayISO()}]:(s.user.stages||[]);const bodyLog=[...(s.user.bodyLog||[])];const nw=parseFloat(wt)||null,nb=parseFloat(bf)||null;if(nw!==s.user.weightKg||nb!==s.user.bodyFatPct)bodyLog.push({id:gid(),date:todayISO(),weightKg:nw,bodyFatPct:nb});return {...s,user:{...s.user,name:name.trim()||s.user.name,goal,weightKg:nw,bodyFatPct:nb,monthlyGoalGym:parseInt(mm)||20,monthlyGoalMove:parseInt(mm)||20,stages,bodyLog}}});onClose()};if(edit)return <RoutineEditor st={st} setSt={setSt} onBack={()=>setEdit(false)}/>;return <div className="modal-bg" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><div className="D" style={{fontSize:24}}>PERFIL</div><button className="small-btn" onClick={onClose}>cerrar</button></div><label className="field"><span>Nombre</span><input value={name} onChange={e=>setName(e.target.value)}/></label><label className="field"><span>Objetivo</span><select value={goal} onChange={e=>setGoal(e.target.value)}><option>Bajar grasa</option><option>Ganar músculo</option><option>Ganar fuerza</option><option>Recomposición</option><option>Mantener</option></select></label><div className="grid2"><label className="field"><span>Peso kg</span><input type="number" value={wt} onChange={e=>setWt(e.target.value)} placeholder="Opcional"/></label><label className="field"><span>% grasa</span><input type="number" value={bf} onChange={e=>setBf(e.target.value)} placeholder="Opcional"/></label></div><label className="field"><span>Meta mensual de entrenamiento</span><input type="number" value={mm} onChange={e=>{setMm(e.target.value);setMg(e.target.value)}}/></label><p className="M" style={{fontSize:10,color:'var(--muted)',marginTop:-6,marginBottom:10}}>Esta meta cuenta entrenamientos. Sauna se guarda como cuidado, sin sumar a la meta.</p><button className="btn btn-s" style={{width:'100%',marginTop:8}} onClick={()=>setEdit(true)}><span>Editar rutina semanal</span><span>→</span></button><button className="btn btn-p" style={{width:'100%',marginTop:10}} onClick={save}><span>Guardar perfil</span><span className="round">✓</span></button><div style={{borderTop:'1px solid var(--line)',marginTop:18,paddingTop:14}}><div className="L" style={{marginBottom:8,color:'var(--dim)'}}>BACKUP Y AJUSTES</div><button className="small-btn" style={{width:'100%',borderRadius:14,padding:12,marginBottom:8}} onClick={()=>exportData(st)}>Descargar backup</button><button className="small-btn" style={{width:'100%',borderRadius:14,padding:12,marginBottom:8}} onClick={()=>document.getElementById('muvitImportFile').click()}>Importar backup</button><button className="small-btn dark" style={{width:'100%',borderRadius:14,padding:12,marginBottom:8}} onClick={updateAppVersion}>Actualizar app</button><input id="muvitImportFile" className="hidden" type="file" accept="application/json" onChange={e=>importDataFile(e,setSt,onClose)}/><div className="M" style={{fontSize:9,color:'var(--dim)',textAlign:'center',marginBottom:10}}>Usa el backup antes de cambios grandes. Actualizar app no borra tus datos.</div><button className="small-btn" style={{width:'100%',borderColor:'var(--acc2)',color:'var(--acc2)',borderRadius:14,padding:12}} onClick={resetApp}>Borrar datos y reiniciar</button><div className="M" style={{fontSize:9,color:'var(--dim)',textAlign:'center',marginTop:6}}>Reinicia MUVIT solo en este dispositivo.</div></div></div></div>}

function focusMatchesExercise(focus,ex){
  const f=focusKey(focus),m=String(ex?.muscle||'').toLowerCase(),n=String(ex?.name||'').toLowerCase();
  if(f.includes('descanso'))return false;
  if(f.includes('rutina libre'))return true;
  if(f.includes('glúte'))return m.includes('glúte')||m.includes('glute')||n.includes('hip thrust')||n.includes('abductor')||n.includes('patada');
  if(f.includes('posterior'))return m.includes('posterior')||m.includes('femoral')||n.includes('rumano')||n.includes('peso muerto')||n.includes('hiperextensiones');
  if(f.includes('cuádr')||f.includes('cuadr'))return m.includes('cuádr')||m.includes('cuadr')||n.includes('prensa')||n.includes('sentadilla')||n.includes('extensión')||n.includes('bulgarian')||n.includes('hack');
  if(f.includes('piernas'))return ['glúte','glute','posterior','femoral','cuádr','cuadr','pierna','pantorrilla'].some(x=>m.includes(x)||n.includes(x));
  if(f.includes('espalda'))return m.includes('espalda')||n.includes('jalón')||n.includes('jalon')||n.includes('remo')||n.includes('pull down')||n.includes('dominada')||n.includes('pullover');
  if(f.includes('pecho'))return m.includes('pecho')||n.includes('press banca')||n.includes('apertura')||n.includes('poleas');
  if(f.includes('hombros')||f.includes('hombro'))return m.includes('hombro')||m.includes('trapecio')||n.includes('laterales')||n.includes('militar')||n.includes('face pull');
  if(f.includes('bíceps')||f.includes('biceps'))return m.includes('bíceps')||m.includes('biceps')||n.includes('curl');
  if(f.includes('tríceps')||f.includes('triceps'))return m.includes('tríceps')||m.includes('triceps')||n.includes('fondos')||n.includes('francés');
  if(f.includes('brazos'))return m.includes('bíceps')||m.includes('biceps')||m.includes('tríceps')||m.includes('triceps')||n.includes('curl')||n.includes('tríceps');
  if(f.includes('core'))return m.includes('core')||m.includes('abdomen')||n.includes('plancha')||n.includes('crunch')||n.includes('dead bug')||n.includes('twist')||n.includes('pallof');
  if(f.includes('cardio'))return m.includes('cardio')||n.includes('cinta')||n.includes('escaladora')||n.includes('bicicleta')||n.includes('elíptica')||n.includes('remo ergómetro');
  if(f.includes('movilidad'))return m.includes('movilidad')||n.includes('movilidad')||n.includes('estiramiento');
  return true;
}
function exercisesForFocus(focus){return EX_LIBRARY.filter(e=>focusMatchesExercise(focus,e))}
function RoutineEditor({st,setSt,onBack}){const [rtn,setRtn]=useState(JSON.parse(JSON.stringify(normalizeRoutine(st.routine)))),[dow,setDow]=useState(1);const day=rtn[dow]||{focus:'Descanso',exercises:[]};const updateFocus=v=>setRtn(r=>({...r,[dow]:{...r[dow],focus:v,exercises:r[dow]?.exercises||[]}}));const updateEx=(id,field,val)=>setRtn(r=>({...r,[dow]:{...r[dow],exercises:r[dow].exercises.map(e=>e.id===id?{...e,[field]:val}:e)}}));const add=ex=>setRtn(r=>({...r,[dow]:{...r[dow],focus:r[dow].focus==='DESCANSO'?'Rutina libre':r[dow].focus,exercises:[...r[dow].exercises,{...ex,id:gid()}]}}));const addFromLibrary=ex=>add(libEx(ex.name));const addPreset=()=>{const preset=presetExercisesForFocus(day.focus);setRtn(r=>{const current=r[dow]?.exercises||[],existing=new Set(current.map(e=>String(e.name).toLowerCase()));const toAdd=preset.filter(e=>!existing.has(String(e.name).toLowerCase()));return {...r,[dow]:{...r[dow],exercises:[...current,...toAdd]}}})};const del=id=>setRtn(r=>({...r,[dow]:{...r[dow],exercises:r[dow].exercises.filter(e=>e.id!==id)}}));const save=()=>{setSt(s=>({...s,routine:normalizeRoutine(rtn)}));onBack()};const suggestions=exercisesForFocus(day.focus).slice(0,18);return <div className="modal-bg"><div className="modal"><button className="small-btn" onClick={onBack}>← perfil</button><div className="D" style={{fontSize:25,margin:'14px 0'}}>EDITAR RUTINA</div><div className="dtog-wrap">{[1,2,3,4,5,6,0].map(d=><button key={d} className={`dtog${dow===d?' on':''}`} onClick={()=>setDow(d)}>{DOWS[d]}</button>)}</div><label className="field"><span>Foco del día</span><select value={day.focus||'Rutina libre'} onChange={e=>updateFocus(e.target.value)}>{FOCUS_OPTIONS.map(f=><option key={f} value={f}>{f}</option>)}</select></label><div style={{display:'flex',gap:8,marginBottom:10}}><button className="small-btn dark" style={{flex:1}} onClick={addPreset}>Agregar sugeridos del foco</button><button className="small-btn" style={{flex:1}} onClick={()=>setRtn(r=>({...r,[dow]:{...r[dow],exercises:[]}}))}>Limpiar día</button></div><div className="card soft" style={{marginBottom:10}}><div className="L" style={{marginBottom:8}}>SUGERENCIAS PARA {String(day.focus||'').toUpperCase()}</div><div className="pill-row" style={{flexWrap:'wrap',overflow:'visible'}}>{suggestions.length? suggestions.map(ex=><button key={ex.name} className="pill" onClick={()=>addFromLibrary(ex)}>{ex.name}</button>):<div className="M" style={{fontSize:11,color:'var(--muted)'}}>Elige un foco para ver ejercicios asociados.</div>}</div></div>{day.exercises.map(ex=><div className="card" key={ex.id} style={{marginBottom:8}}><div className="suggest"><input className="input" value={ex.name} onChange={e=>updateEx(ex.id,'name',e.target.value)} placeholder="Ejercicio"/></div><div className="grid2" style={{marginTop:8}}><input className="input" value={ex.muscle} onChange={e=>updateEx(ex.id,'muscle',e.target.value)} placeholder="Músculo"/><input className="input" value={ex.target} onChange={e=>updateEx(ex.id,'target',e.target.value)} placeholder="Objetivo"/></div><button className="small-btn" style={{marginTop:8}} onClick={()=>del(ex.id)}>Eliminar</button></div>)}<AddExercise onAdd={add}/><button className="btn btn-p" style={{width:'100%',marginTop:12}} onClick={save}><span>Guardar rutina</span><span className="round">✓</span></button></div></div>}
function App(){const [st,setSt]=useState(()=>load()),[tab,setTab]=useState('home'),[prof,setProf]=useState(false),[activeDate,setActiveDate]=useState(todayISO());useEffect(()=>persist(st),[st]);if(!st.onboarded)return <Onboarding onDone={setSt}/>;const openGym=iso=>{setActiveDate(iso);markActivity(setSt,iso,'gym');setTab('workout')};let body=tab==='home'?<Home st={st} setSt={setSt} onAv={()=>setProf(true)} onStartGym={openGym}/>:tab==='calendar'?<Calendar st={st} setSt={setSt} onAv={()=>setProf(true)} onGym={openGym}/>:tab==='workout'?<Workout st={st} setSt={setSt} onAv={()=>setProf(true)} activeDate={activeDate} setActiveDate={setActiveDate}/>:<Stats st={st} onAv={()=>setProf(true)}/>;return <><div className="app"><div className="scroll">{body}</div><Nav active={tab} onChange={setTab}/></div>{prof&&<ProfileModal st={st} setSt={setSt} onClose={()=>setProf(false)}/>}</>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
