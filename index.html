<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F3EA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MUVIT" />
  <title>MUVIT</title>
  <style>
    :root{
      --bg:#F7F3EA;
      --bg2:#EFE8DA;
      --card:#FFFFFF;
      --text:#171717;
      --muted:#77706A;
      --soft:#AAA098;
      --line:#E7DED4;
      --brand:#171717;
      --accent:#E86F3A;
      --accent2:#F6C857;
      --green:#3FA66E;
      --red:#D75D55;
      --blue:#5378D8;
      --radius:24px;
      --shadow:0 14px 34px rgba(38,27,18,.08);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
    body{background:radial-gradient(circle at top left,rgba(232,111,58,.16),transparent 28%),linear-gradient(180deg,var(--bg),var(--bg2));}
    button,input,select,textarea{font:inherit}
    button{border:0;background:none;color:inherit;cursor:pointer}
    input,select,textarea{width:100%;border:1px solid var(--line);background:#FFFDF9;color:var(--text);border-radius:16px;padding:12px 13px;outline:none}
    textarea{min-height:76px;resize:vertical}
    label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 7px 2px}
    h1,h2,h3,p{margin:0}
    h1{font-size:28px;line-height:1.05;letter-spacing:-.9px}
    h2{font-size:18px;letter-spacing:-.35px;margin-bottom:10px}
    h3{font-size:15px;letter-spacing:-.2px;margin-bottom:8px}
    p{font-size:14px;line-height:1.42;color:var(--muted)}

    .app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 15px 92px}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:17px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:-1px;box-shadow:var(--shadow)}
    .brand-title{font-weight:950;font-size:24px;line-height:1;letter-spacing:-.8px}
    .date{font-size:13px;color:var(--muted);margin-top:5px;text-transform:capitalize}
    .profile-btn{width:43px;height:43px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-weight:900;box-shadow:var(--shadow)}

    .view{display:none}.view.active{display:block}
    .card{background:rgba(255,255,255,.92);border:1px solid rgba(231,222,212,.9);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
    .hero{padding:20px;border-radius:28px;background:linear-gradient(135deg,#fff,rgba(255,255,255,.72));border:1px solid rgba(231,222,212,.95);box-shadow:var(--shadow);margin-bottom:14px}
    .section{margin-top:14px}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between}.row-start{display:flex;gap:10px;align-items:flex-start}.min0{min-width:0}
    .eyebrow{font-size:12px;color:var(--accent);font-weight:900;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
    .micro{font-size:13px;color:var(--muted);font-weight:650}
    .tiny{font-size:12px;color:var(--muted)}
    .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;background:#F7F1E9;border:1px solid var(--line);font-size:12px;font-weight:800;color:#5F5751;white-space:nowrap}
    .pill.ok{background:#EAF7EF;color:#247249;border-color:#CBEBD8}.pill.warn{background:#FFF5D6;color:#8B6200;border-color:#F2D889}.pill.blue{background:#ECF1FF;color:#3158AF;border-color:#CFDAFF}
    .btn{border-radius:16px;background:var(--brand);color:#fff;min-height:46px;padding:12px 14px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 9px 18px rgba(0,0,0,.12)}
    .btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line);box-shadow:none}.btn.ghost{background:#F7F1E9;color:var(--text);box-shadow:none}.btn.danger{background:#FFF0EE;color:var(--red);border:1px solid #F5C8C4;box-shadow:none}.btn.small{min-height:34px;border-radius:12px;padding:7px 10px;font-size:12px}
    .grid{display:grid;gap:12px}.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr 1fr}
    .stat-number{font-size:26px;font-weight:950;letter-spacing:-.8px}.stat-label{font-size:12px;color:var(--muted);font-weight:750;margin-top:4px}
    .tabs{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(452px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(255,255,255,.85);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;padding:7px;box-shadow:var(--shadow);z-index:50}
    .tab{height:50px;border-radius:18px;font-size:11px;font-weight:900;color:var(--muted)}.tab span{display:block;font-size:18px;margin-bottom:1px}.tab.active{background:var(--brand);color:#fff}

    .week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:12px}.day{height:48px;border-radius:15px;background:#F8F3EC;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);font-weight:800}.day.done{background:#EAF7EF;color:#247249;border-color:#CBEBD8}.day.today{outline:2px solid var(--brand)}
    .quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick{border:1px solid var(--line);background:#FFFDF9;border-radius:18px;padding:11px 8px;font-weight:900;color:var(--muted)}.quick.active{background:#171717;color:#fff;border-color:#171717}.quick small{display:block;font-size:11px;font-weight:750;margin-top:2px;opacity:.78}

    .exercise{background:#FFFDF9;border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:12px}.exercise-title{font-weight:950;font-size:17px;letter-spacing:-.3px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.reference{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.series{display:grid;gap:8px;margin-top:12px}.serie{display:grid;grid-template-columns:44px 1fr 1fr 42px;gap:7px;align-items:center}.serie .slabel{font-size:12px;font-weight:900;color:var(--muted)}.check{height:40px;border-radius:14px;border:1px solid var(--line);background:#F7F1E9;font-weight:950}.check.on{background:var(--green);border-color:var(--green);color:#fff}.exercise-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.icon{width:36px;height:36px;border-radius:13px;background:#F7F1E9;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0}
    .select-day{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day-plan{padding:10px 3px;border-radius:14px;background:#FFFDF9;border:1px solid var(--line);font-size:12px;font-weight:950;color:var(--muted)}.day-plan.active{background:var(--brand);color:#fff}
    .group-card{background:#FFFDF9;border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:10px}

    .calendar-head,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calendar-head{font-size:11px;font-weight:900;color:var(--muted);text-align:center;margin:12px 0 6px}.cal{height:52px;border-radius:15px;background:#FFFDF9;border:1px solid var(--line);padding:8px;text-align:left;color:var(--muted);font-size:12px;font-weight:850;position:relative}.cal.done{background:#EAF7EF;color:#247249;border-color:#CBEBD8}.cal.selected{outline:2px solid var(--brand)}.cal .dot{position:absolute;bottom:7px;left:8px;width:8px;height:8px;border-radius:50%;background:var(--green)}
    .list-item{padding:12px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}.list-title{font-weight:900}.list-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
    .chart{height:170px;border-radius:18px;border:1px solid var(--line);background:#FFFDF9;margin-top:10px;overflow:hidden}.barline{display:flex;align-items:flex-end;gap:6px;height:150px;padding:15px}.bar{flex:1;min-height:8px;border-radius:8px 8px 3px 3px;background:var(--accent)}.empty{border:1px dashed #D7CCC1;background:#FFFDF9;border-radius:20px;padding:15px;text-align:center;color:var(--muted);font-weight:650}
    .modal-backdrop{position:fixed;inset:0;background:rgba(32,22,14,.45);z-index:90;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal-backdrop.open{display:flex}.modal{width:min(480px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:28px;padding:18px;box-shadow:0 22px 55px rgba(0,0,0,.2)}.form{display:grid;gap:12px;margin-top:12px}
    .suggestions{position:relative}.suggestion-list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);max-height:220px;overflow:auto;z-index:120}.suggestion{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:750}.suggestion:last-child{border-bottom:0}
    .toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%) translateY(18px);background:#171717;color:#fff;border-radius:16px;padding:12px 14px;font-weight:900;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.22s;z-index:130}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .hidden{display:none!important}
    @media(max-width:360px){.grid2,.grid3{grid-template-columns:1fr}.quick-grid{grid-template-columns:1fr}.serie{grid-template-columns:38px 1fr 1fr 38px}.app{padding-left:12px;padding-right:12px}h1{font-size:25px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">MV</div>
        <div>
          <div class="brand-title">MUVIT</div>
          <div class="date" id="dateHeader"></div>
        </div>
      </div>
      <button class="profile-btn" id="profileBtn" onclick="openProfile()">G</button>
    </header>

    <section class="view active" id="viewToday"></section>
    <section class="view" id="viewGym"></section>
    <section class="view" id="viewMonth"></section>
    <section class="view" id="viewStats"></section>
  </main>

  <nav class="tabs">
    <button class="tab active" id="tabToday" onclick="go('Today')"><span>☀️</span>Hoy</button>
    <button class="tab" id="tabGym" onclick="go('Gym')"><span>🏋️</span>GYM</button>
    <button class="tab" id="tabMonth" onclick="go('Month')"><span>🗓️</span>MES</button>
    <button class="tab" id="tabStats" onclick="go('Stats')"><span>📈</span>STATS</button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

<script>
const KEY='muvit_app_v4_light';
const MIGRATE_KEYS=['muvit_app_v3','muvit_app_v2','muvitData','gymData','muvit'];
const DAYS=['L','M','M','J','V','S','D'];
const DAYNAMES=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const QUICK=[{id:'trained',t:'Entrené',s:'sesión'},{id:'cardio',t:'Cardio',s:'extra'},{id:'rest',t:'Descanso',s:'activo'}];
const SUGGESTIONS=['Sentadilla','Sentadilla goblet','Sentadilla sumo','Sentadilla búlgara','Prensa de piernas','Hip thrust','Puente de glúteos','Peso muerto rumano','Peso muerto convencional','Peso muerto sumo','Zancadas','Caminata con zancadas','Step up','Curl femoral','Extensión de cuádriceps','Abducción de cadera','Aducción de cadera','Patada de glúteo en polea','Elevación de talones','Gemelos sentado','Gemelos de pie','Jalón al pecho','Remo sentado','Remo con barra','Remo con mancuerna','Dominadas','Pull over en polea','Peso muerto','Face pull','Remo en máquina','Jalón agarre cerrado','Press banca','Press inclinado','Press declinado','Press con mancuernas','Aperturas con mancuernas','Aperturas en máquina','Fondos','Flexiones','Cruce de poleas','Press militar','Press hombro con mancuernas','Elevaciones laterales','Elevaciones frontales','Pájaros','Arnold press','Remo al mentón','Curl bíceps','Curl martillo','Curl predicador','Curl en polea','Extensión de tríceps en polea','Press francés','Fondos para tríceps','Patada de tríceps','Extensión de tríceps sobre cabeza','Plancha','Crunch','Crunch en máquina','Elevación de piernas','Russian twist','Mountain climbers','Dead bug','Hollow hold','Bicicleta abdominal','Plancha lateral','Caminata inclinada','Bicicleta','Elíptica','Escaladora','Cuerda','Burpees','Battle rope','Sled push','Remo ergómetro'];
let view='Today';
let monthCursor=new Date();
let selectedDay=todayKey();
let activePlanDay=dayIndex(new Date());
let state=load();

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function todayKey(){return key(new Date())}
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parse(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function dayIndex(d){return (d.getDay()+6)%7}
function pretty(d=new Date()){return d.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase())}
function norm(s=''){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return Number(n||0).toLocaleString('es-PE',{maximumFractionDigits:0})}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function defaults(){
 return {version:4,user:{name:'Giulliana',goal:'Retomar constancia, bajar grasa corporal y fortalecer piernas/glúteos',weight:'',fat:'',weeklyGoal:5},
 plan:[
  {day:0,group:'Piernas y glúteos',exercises:[mkEx('Hip thrust',4),mkEx('Sentadilla búlgara',3),mkEx('Prensa de piernas',4),mkEx('Abducción de cadera',3)]},
  {day:1,group:'Espalda y bíceps',exercises:[mkEx('Jalón al pecho',4),mkEx('Remo sentado',3),mkEx('Curl bíceps',3)]},
  {day:2,group:'Glúteos y femoral',exercises:[mkEx('Peso muerto rumano',4),mkEx('Curl femoral',3),mkEx('Patada de glúteo en polea',3)]},
  {day:3,group:'Hombros y core',exercises:[mkEx('Press hombro con mancuernas',3),mkEx('Elevaciones laterales',3),mkEx('Plancha',3)]},
  {day:4,group:'Piernas completo',exercises:[mkEx('Sentadilla',4),mkEx('Zancadas',3),mkEx('Extensión de cuádriceps',3)]},
  {day:5,group:'Cardio / movilidad',exercises:[mkEx('Caminata inclinada',1),mkEx('Movilidad',1)]},
  {day:6,group:'Descanso activo',exercises:[]}
 ],logs:{},body:[]}
}
function mkEx(name,sets=3){return {id:uid(),name,sets,defaultReps:'10',notes:''}}
function load(){
 const raw=localStorage.getItem(KEY); if(raw){try{return migrate(JSON.parse(raw))}catch(e){}}
 for(const k of MIGRATE_KEYS){const old=localStorage.getItem(k); if(old){try{const s=migrate(JSON.parse(old));localStorage.setItem(KEY,JSON.stringify(s));return s}catch(e){}}}
 const s=defaults(); localStorage.setItem(KEY,JSON.stringify(s)); return s;
}
function migrate(d){
 const base=defaults(); if(!d||typeof d!=='object')return base;
 const user={...base.user,...(d.user||{}),weeklyGoal:Number(d.user?.weeklyGoal||d.settings?.weeklyGoal||d.weeklyGoal||base.user.weeklyGoal)};
 let plan=base.plan;
 if(Array.isArray(d.plan)) plan=d.plan.map((p,i)=>({day:Number.isInteger(p.day)?p.day:i,group:p.group||p.name||`Día ${i+1}`,exercises:Array.isArray(p.exercises)?p.exercises.map(e=>({id:e.id||uid(),name:e.name||'Ejercicio',sets:Number(e.sets||e.series||3),defaultReps:String(e.defaultReps||e.reps||'10'),notes:e.notes||''})):[]}));
 if(Array.isArray(d.groups)) plan=d.groups.slice(0,7).map((g,i)=>({day:Number.isInteger(g.dayIndex)?g.dayIndex:i,group:g.name||`Día ${i+1}`,exercises:Array.isArray(g.exercises)?g.exercises.map(e=>({id:e.id||uid(),name:e.name||'Ejercicio',sets:Number(e.sets||3),defaultReps:String(e.reps||'10'),notes:e.notes||''})):[]}));
 return {version:4,user,plan,logs:d.logs&&typeof d.logs==='object'?d.logs:{},body:Array.isArray(d.body)?d.body:(Array.isArray(d.bodyMetrics)?d.bodyMetrics.map(m=>({id:m.id||uid(),date:m.date||todayKey(),weight:m.weight||'',fat:m.fat||''})):[])};
}
function getPlan(day=dayIndex(new Date())){return state.plan.find(p=>p.day===day)||state.plan[day]||state.plan[0]}
function ensureLog(k=todayKey()){
 if(!state.logs[k]){
  const p=getPlan(dayIndex(parse(k)));
  state.logs[k]={date:k,day:dayIndex(parse(k)),group:p?.group||'',quick:[],status:'pending',notes:'',exercises:(p?.exercises||[]).map(e=>({sourceId:e.id,id:uid(),name:e.name,sets:Array.from({length:Number(e.sets||3)},(_,i)=>({n:i+1,weight:'',reps:e.defaultReps||'',done:false})),removed:false,extra:false}))};
 }
 return state.logs[k];
}
function isWorkout(k){const l=state.logs[k];return !!(l&&(l.status==='completed'||l.exercises?.some(e=>e.sets?.some(s=>s.done))||l.quick?.includes('trained')))}
function completedSets(k=todayKey()){const l=state.logs[k]; if(!l)return 0; return (l.exercises||[]).reduce((a,e)=>a+(e.removed?0:e.sets.filter(s=>s.done).length),0)}
function totalSets(k=todayKey()){const l=state.logs[k]; if(!l)return 0; return (l.exercises||[]).reduce((a,e)=>a+(e.removed?0:e.sets.length),0)}
function weekKeys(d=new Date()){const idx=dayIndex(d);const monday=new Date(d);monday.setDate(d.getDate()-idx);return Array.from({length:7},(_,i)=>{const x=new Date(monday);x.setDate(monday.getDate()+i);return key(x)})}
function monthKeys(d=monthCursor){const arr=[];const y=d.getFullYear(),m=d.getMonth(),last=new Date(y,m+1,0).getDate();for(let i=1;i<=last;i++)arr.push(key(new Date(y,m,i)));return arr}

function go(v){view=v;['Today','Gym','Month','Stats'].forEach(x=>{document.getElementById('view'+x).classList.toggle('active',x===v);document.getElementById('tab'+x).classList.toggle('active',x===v)});render()}
function render(){document.getElementById('dateHeader').textContent=pretty(new Date());document.getElementById('profileBtn').textContent=(state.user.name||'G').trim().charAt(0).toUpperCase(); if(view==='Today')renderToday(); if(view==='Gym')renderGym(); if(view==='Month')renderMonth(); if(view==='Stats')renderStats()}

function renderToday(){
 const k=todayKey(), p=getPlan(), l=ensureLog(k), wk=weekKeys(), done=wk.filter(isWorkout).length, goal=state.user.weeklyGoal||5, setsDone=completedSets(k), setsTotal=totalSets(k);
 let status='Pendiente', statusClass='warn', statusText='Aún no registras tu entrenamiento.';
 if(setsDone>0&&setsDone<setsTotal){status='En progreso';statusClass='blue';statusText=`Llevas ${setsDone} de ${setsTotal} series.`}
 if(l.status==='completed'||(setsTotal>0&&setsDone===setsTotal)){status='Completado';statusClass='ok';statusText='Entrenamiento guardado.'}
 document.getElementById('viewToday').innerHTML=`
  <div class="hero"><div class="eyebrow">HOY</div><h1>Menos perfecto, más constante.</h1><p style="margin-top:8px">Abre GYM, completa lo que puedas y guarda tu progreso real.</p></div>
  <div class="card">
    <div class="row"><div><p class="micro">Hoy toca</p><h1 style="margin-top:4px">${esc(p.group)}</h1><p style="margin-top:7px">${p.exercises.length} ejercicios planificados</p></div><span class="pill ${statusClass}">${status}</span></div>
    <button class="btn" style="width:100%;margin-top:16px" onclick="go('Gym')">Ir a GYM</button>
  </div>
  <div class="card section"><div class="row"><h2>Estado de hoy</h2><span class="pill ${statusClass}">${status}</span></div><p>${statusText}</p></div>
  <div class="card section"><div class="row"><h2>Esta semana</h2><span class="pill">${done}/${goal} entrenamientos</span></div><div class="week">${wk.map((x,i)=>`<div class="day ${isWorkout(x)?'done':''} ${x===k?'today':''}"><span>${DAYS[i]}</span><span>${parse(x).getDate()}</span></div>`).join('')}</div></div>
  <div class="card section"><h2>Registro rápido</h2><div class="quick-grid">${QUICK.map(q=>`<button class="quick ${l.quick.includes(q.id)?'active':''}" onclick="toggleQuick('${q.id}')">${q.t}<small>${q.s}</small></button>`).join('')}</div></div>
 `; save();
}
function toggleQuick(id){const l=ensureLog(); l.quick=l.quick||[]; l.quick=l.quick.includes(id)?l.quick.filter(x=>x!==id):[...l.quick,id]; if(id==='trained'&&l.quick.includes(id))l.status='completed'; save(); renderToday()}

function renderGym(){
 const k=todayKey(), l=ensureLog(k); const day=activePlanDay;
 document.getElementById('viewGym').innerHTML=`
  <div class="hero"><div class="eyebrow">GYM</div><h1>Completa tus ejercicios de hoy.</h1><p style="margin-top:8px">Registra peso, reps y series. Ajusta el plan si el gym te cambia la jugada.</p></div>
  <div class="card"><div class="row"><h2>Plan semanal</h2><button class="btn secondary small" onclick="openPlanEditor(${day})">Editar día</button></div><div class="select-day">${DAYNAMES.map((d,i)=>`<button class="day-plan ${i===day?'active':''}" onclick="activePlanDay=${i};renderGym()">${DAYS[i]}</button>`).join('')}</div><div style="margin-top:13px"><p class="micro">${DAYNAMES[day]}</p><h1 style="font-size:24px;margin-top:4px">${esc(getPlan(day).group)}</h1></div></div>
  ${day===dayIndex(new Date()) ? renderTodayWorkout(l) : renderPlanPreview(day)}
 `;
}
function renderPlanPreview(day){const p=getPlan(day);return `<div class="card section"><div class="row"><h2>Ejercicios planificados</h2><button class="btn secondary small" onclick="openExercisePlanModal(${day})">+ Agregar</button></div>${p.exercises.length?p.exercises.map(e=>`<div class="list-item"><div class="row"><div><div class="list-title">${esc(e.name)}</div><div class="list-meta">${e.sets} series · reps base: ${esc(e.defaultReps)}</div></div><div class="row-start"><button class="icon" onclick="openExercisePlanModal(${day},'${e.id}')">✏️</button><button class="icon" onclick="deletePlanExercise(${day},'${e.id}')">🗑️</button></div></div></div>`).join(''):`<div class="empty">Este día no tiene ejercicios planificados.</div>`}</div>`}
function renderTodayWorkout(l){
 return `<div class="card section"><div class="row"><div><p class="micro">Entrenamiento de hoy</p><h1 style="font-size:25px;margin-top:4px">${esc(l.group)}</h1></div><span class="pill">${completedSets()}/${totalSets()} series</span></div>
  <div style="margin-top:8px"><button class="btn secondary small" onclick="openExerciseLogModal()">+ Agregar ejercicio</button></div>
  ${l.exercises.filter(e=>!e.removed).map((e,ei)=>exerciseLogHTML(e,ei)).join('') || '<div class="empty section">No hay ejercicios para hoy. Agrega uno para empezar.</div>'}
  <div class="section"><label>Nota del día</label><textarea id="dayNotes" oninput="ensureLog().notes=this.value;save()" placeholder="Ej. Hoy bajé peso porque la máquina estaba ocupada.">${esc(l.notes||'')}</textarea></div>
  <button class="btn" style="width:100%;margin-top:14px" onclick="finishWorkout()">Guardar entrenamiento</button>
 </div>`
}
function exerciseLogHTML(e,ei){const ref=exerciseReference(e.name);return `<div class="exercise"><div class="row"><div class="min0"><div class="exercise-title">${esc(e.name)}</div>${ref}</div><button class="icon" onclick="openExerciseLogModal(${ei})">✏️</button></div><div class="series">${e.sets.map((s,si)=>`<div class="serie"><div class="slabel">S${s.n}</div><input inputmode="decimal" placeholder="kg" value="${esc(s.weight)}" oninput="updateSet(${ei},${si},'weight',this.value)"><input inputmode="numeric" placeholder="reps" value="${esc(s.reps)}" oninput="updateSet(${ei},${si},'reps',this.value)"><button class="check ${s.done?'on':''}" onclick="toggleSet(${ei},${si})">${s.done?'✓':''}</button></div>`).join('')}</div><div class="exercise-actions"><button class="btn ghost small" onclick="addSet(${ei})">+ Serie</button><button class="btn ghost small" onclick="removeSet(${ei})">− Serie</button><button class="btn secondary small" onclick="replaceExercise(${ei})">Reemplazar</button><button class="btn danger small" onclick="removeExerciseToday(${ei})">Eliminar hoy</button></div></div>`}
function updateSet(ei,si,field,val){const l=ensureLog();l.exercises[ei].sets[si][field]=val;save()}
function toggleSet(ei,si){const l=ensureLog();l.exercises[ei].sets[si].done=!l.exercises[ei].sets[si].done;l.status=completedSets()>0?'progress':'pending';save();renderGym()}
function addSet(ei){const e=ensureLog().exercises[ei];e.sets.push({n:e.sets.length+1,weight:'',reps:'',done:false});save();renderGym()}
function removeSet(ei){const e=ensureLog().exercises[ei];if(e.sets.length>1)e.sets.pop();save();renderGym()}
function removeExerciseToday(ei){if(!confirm('¿Eliminar este ejercicio solo por hoy? El plan semanal no se borra.'))return;ensureLog().exercises[ei].removed=true;save();renderGym()}
function replaceExercise(ei){openExerciseLogModal(ei,true)}
function finishWorkout(){const l=ensureLog();l.status='completed';l.quick=[...new Set([...(l.quick||[]),'trained'])];save();toast('Entrenamiento guardado');renderGym()}

function exerciseReference(name){
 const rows=[]; Object.values(state.logs).forEach(l=>(l.exercises||[]).forEach(e=>{if(norm(e.name)===norm(name)&&!e.removed){e.sets.forEach(s=>{if(s.done&&Number(s.weight||0)>0&&Number(s.reps||0)>0)rows.push({w:Number(s.weight),r:Number(s.reps),v:Number(s.weight)*Number(s.reps),date:l.date})})}}));
 if(!rows.length)return `<div class="reference"><span class="pill">Referencia: sin registros aún</span></div>`;
 const bestLoad=rows.slice().sort((a,b)=>b.w-a.w||b.r-a.r)[0]; const bestVol=rows.slice().sort((a,b)=>b.v-a.v)[0];
 return `<div class="reference"><span class="pill blue">Mejor carga: ${bestLoad.w} kg x ${bestLoad.r}</span><span class="pill">Mejor volumen: ${money(bestVol.v)} kg</span></div>`
}

function renderMonth(){
 const y=monthCursor.getFullYear(),m=monthCursor.getMonth(),first=new Date(y,m,1),offset=dayIndex(first),last=new Date(y,m+1,0).getDate(); const cells=[];for(let i=0;i<offset;i++)cells.push(null);for(let d=1;d<=last;d++)cells.push(new Date(y,m,d)); const l=state.logs[selectedDay];
 document.getElementById('viewMonth').innerHTML=`
  <div class="hero"><div class="eyebrow">MES</div><h1>Revisa tu historial sin ruido.</h1><p style="margin-top:8px">Toca un día para ver el resumen registrado.</p></div>
  <div class="card"><div class="row"><button class="btn secondary small" onclick="changeMonth(-1)">←</button><h2>${monthCursor.toLocaleDateString('es-PE',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}</h2><button class="btn secondary small" onclick="changeMonth(1)">→</button></div><div class="calendar-head">${DAYS.map(d=>`<div>${d}</div>`).join('')}</div><div class="calendar">${cells.map(d=>d?`<button class="cal ${isWorkout(key(d))?'done':''} ${selectedDay===key(d)?'selected':''}" onclick="selectedDay='${key(d)}';renderMonth()"><span>${d.getDate()}</span>${isWorkout(key(d))?'<span class="dot"></span>':''}</button>`:'<div></div>').join('')}</div></div>
  <div class="card section"><div class="row"><h2>${pretty(parse(selectedDay))}</h2><span class="pill ${isWorkout(selectedDay)?'ok':'warn'}">${isWorkout(selectedDay)?'Registrado':'Sin registro'}</span></div>${l&&isWorkout(selectedDay)?`<p><strong style="color:#171717">${esc(l.group||'Entrenamiento')}</strong></p><p style="margin-top:6px">${completedSets(selectedDay)} series completadas.</p>${l.notes?`<p style="margin-top:8px">Nota: ${esc(l.notes)}</p>`:''}`:`<div class="empty">Este día todavía no tiene entrenamiento guardado.</div>`}</div>
 `;
}
function changeMonth(n){monthCursor.setMonth(monthCursor.getMonth()+n);renderMonth()}

function renderStats(){
 const records=exerciseRecords(); const names=[...new Set(records.map(r=>r.name))].sort(); const selected=window.selectedExercise&&names.includes(window.selectedExercise)?window.selectedExercise:names[0]; window.selectedExercise=selected;
 const prs=bestMarks(records).slice(0,6); const volumeThisMonth=monthVolume(new Date()); const prev=new Date(); prev.setMonth(prev.getMonth()-1); const volumePrev=monthVolume(prev); const freq=frequencyByGroup();
 document.getElementById('viewStats').innerHTML=`
  <div class="hero"><div class="eyebrow">STATS</div><h1>Progreso real, no decoración.</h1><p style="margin-top:8px">Mira si estás mejorando por ejercicio, volumen y consistencia muscular.</p></div>
  <div class="card"><div class="row"><h2>1. Progreso por ejercicio</h2></div>${names.length?`<select onchange="window.selectedExercise=this.value;renderStats()">${names.map(n=>`<option ${n===selected?'selected':''}>${esc(n)}</option>`).join('')}</select>${exerciseProgressHTML(selected,records)}`:`<div class="empty">Guarda series con peso y reps para ver progreso por ejercicio.</div>`}</div>
  <div class="card section"><h2>2. Mejores marcas</h2>${prs.length?prs.map(p=>`<div class="list-item"><div class="list-title">${esc(p.name)}</div><div class="list-meta">Mejor carga: ${p.w} kg x ${p.r} reps · Mejor volumen por serie: ${money(p.v)} kg</div></div>`).join(''):`<div class="empty">Aún no hay marcas registradas.</div>`}</div>
  <div class="card section"><h2>3. Volumen de entrenamiento</h2><div class="grid grid2"><div><div class="stat-number">${money(volumeThisMonth)}</div><div class="stat-label">kg movidos este mes</div></div><div><div class="stat-number">${volumePrev?((volumeThisMonth-volumePrev)>=0?'+':'')+money(volumeThisMonth-volumePrev):'—'}</div><div class="stat-label">vs mes anterior</div></div></div></div>
  <div class="card section"><h2>4. Frecuencia por grupo muscular</h2>${freq.length?freq.map(f=>`<div class="list-item"><div class="row"><div class="list-title">${esc(f.group)}</div><span class="pill">${f.count} veces</span></div></div>`).join(''):`<div class="empty">Cuando guardes entrenamientos, verás qué grupos trabajas más.</div>`}</div>
  <div class="card section"><div class="row"><h2>5. Evolución corporal</h2><button class="btn secondary small" onclick="openBodyModal()">+ Dato</button></div>${bodyHTML()}</div>
  <div class="card section"><h2>6. Recomendación simple</h2><p>${recommendation(freq,records)}</p></div>
 `;
}
function exerciseRecords(){const arr=[];Object.values(state.logs).forEach(l=>(l.exercises||[]).forEach(e=>{if(e.removed)return;e.sets.forEach(s=>{if(s.done&&Number(s.weight)>0&&Number(s.reps)>0)arr.push({date:l.date,group:l.group,name:e.name,w:Number(s.weight),r:Number(s.reps),v:Number(s.weight)*Number(s.reps)})})}));return arr.sort((a,b)=>a.date.localeCompare(b.date))}
function bestMarks(records){const map={};records.forEach(r=>{const x=map[r.name]||{name:r.name,w:0,r:0,v:0}; if(r.w>x.w||(r.w===x.w&&r.r>x.r)){x.w=r.w;x.r=r.r} if(r.v>x.v)x.v=r.v; map[r.name]=x});return Object.values(map).sort((a,b)=>b.w-a.w)}
function exerciseProgressHTML(name,records){const rs=records.filter(r=>r.name===name); if(!rs.length)return '<div class="empty section">Este ejercicio aún no tiene registros.</div>'; const first=rs[0], best=bestMarks(rs)[0], total=rs.reduce((a,r)=>a+r.v,0); const bars=rs.slice(-10); const max=Math.max(...bars.map(b=>b.w));return `<div class="grid grid3 section"><div><div class="stat-number">${best.w}</div><div class="stat-label">mejor kg</div></div><div><div class="stat-number">${best.r}</div><div class="stat-label">reps con mejor kg</div></div><div><div class="stat-number">${money(total)}</div><div class="stat-label">volumen acumulado</div></div></div><div class="chart"><div class="barline">${bars.map(b=>`<div class="bar" title="${b.date}: ${b.w}kg" style="height:${Math.max(8,(b.w/max)*130)}px"></div>`).join('')}</div></div><p style="margin-top:8px">Desde tu primer registro: ${first.w} kg. Mejor marca actual: ${best.w} kg.</p>`}
function monthVolume(d){const ks=monthKeys(d);return exerciseRecords().filter(r=>ks.includes(r.date)).reduce((a,r)=>a+r.v,0)}
function frequencyByGroup(){const map={};monthKeys(new Date()).forEach(k=>{const l=state.logs[k];if(isWorkout(k)&&l?.group)map[l.group]=(map[l.group]||0)+1});return Object.entries(map).map(([group,count])=>({group,count})).sort((a,b)=>b.count-a.count)}
function bodyHTML(){const b=state.body.slice().sort((a,b)=>a.date.localeCompare(b.date)); if(!b.length)return '<div class="empty">Agrega peso y % de grasa para ver evolución corporal.</div>'; const first=b[0], last=b[b.length-1];return `<div class="grid grid2"><div><div class="stat-number">${last.weight||'—'}</div><div class="stat-label">peso actual kg</div></div><div><div class="stat-number">${last.fat||'—'}</div><div class="stat-label">% grasa actual</div></div></div><p style="margin-top:10px">Cambio desde el primer registro: ${first.weight&&last.weight?(Number(last.weight)-Number(first.weight)).toFixed(1)+' kg':'—'} · ${first.fat&&last.fat?(Number(last.fat)-Number(first.fat)).toFixed(1)+' pts grasa':'—'}</p>`}
function recommendation(freq,records){if(!records.length)return 'Empieza guardando tus series con peso y repeticiones. Con eso MUVIT podrá mostrarte progreso real por ejercicio.'; if(freq.length>1)return `Estás trabajando más ${freq[0].group}. Para equilibrar, revisa si esta semana puedes sumar ${freq[freq.length-1].group}.`; return 'Mantén el registro por ejercicio. La próxima mejora puede ser subir un poco la carga, sumar una repetición o completar una serie más.'}

function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackdrop').classList.add('open')}
function closeModal(e){if(!e||e.target.id==='modalBackdrop'){document.getElementById('modalBackdrop').classList.remove('open');document.getElementById('modal').innerHTML=''}}
function openProfile(){openModal(`<div class="row"><h2>Datos</h2><button class="icon" onclick="closeModal()">×</button></div><div class="form"><div><label>Nombre</label><input id="uName" value="${esc(state.user.name)}"></div><div><label>Objetivo</label><textarea id="uGoal">${esc(state.user.goal)}</textarea></div><div class="grid grid2"><div><label>Peso actual</label><input id="uWeight" value="${esc(state.user.weight)}" inputmode="decimal"></div><div><label>% grasa actual</label><input id="uFat" value="${esc(state.user.fat)}" inputmode="decimal"></div></div><div><label>Meta semanal de entrenamientos</label><input id="uGoalW" type="number" min="1" max="7" value="${state.user.weeklyGoal}"></div><button class="btn" onclick="saveProfile()">Guardar datos</button><button class="btn secondary" onclick="exportData()">Exportar datos</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Importar datos</button><input class="hidden" id="importFile" type="file" accept="application/json" onchange="importData(event)"><button class="btn danger" onclick="resetApp()">Reiniciar app</button></div>`)}
function saveProfile(){state.user.name=document.getElementById('uName').value||'G';state.user.goal=document.getElementById('uGoal').value;state.user.weight=document.getElementById('uWeight').value;state.user.fat=document.getElementById('uFat').value;state.user.weeklyGoal=Number(document.getElementById('uGoalW').value||5); if(state.user.weight||state.user.fat) state.body.push({id:uid(),date:todayKey(),weight:state.user.weight,fat:state.user.fat}); save(); closeModal(); render(); toast('Datos guardados')}
function openPlanEditor(day){const p=getPlan(day);openModal(`<div class="row"><h2>Editar ${DAYNAMES[day]}</h2><button class="icon" onclick="closeModal()">×</button></div><div class="form"><div><label>Grupo muscular</label><input id="planGroup" value="${esc(p.group)}"></div><button class="btn" onclick="savePlanGroup(${day})">Guardar</button></div>`)}
function savePlanGroup(day){getPlan(day).group=document.getElementById('planGroup').value||'Sin grupo'; const l=state.logs[todayKey()]; if(day===dayIndex(new Date())&&l)l.group=getPlan(day).group; save(); closeModal(); renderGym(); toast('Plan actualizado')}
function openExercisePlanModal(day,id=''){const p=getPlan(day),e=id?p.exercises.find(x=>x.id===id):mkEx('',3);openModal(`<div class="row"><h2>${id?'Editar ejercicio':'Agregar ejercicio'}</h2><button class="icon" onclick="closeModal()">×</button></div><div class="form"><div class="suggestions"><label>Ejercicio</label><input id="planExName" value="${esc(e.name)}" oninput="showSuggest(this.value,'planSug','planExName')"><div id="planSug" class="suggestion-list hidden"></div></div><div class="grid grid2"><div><label>Series</label><input id="planSets" type="number" min="1" value="${e.sets}"></div><div><label>Reps base</label><input id="planReps" value="${esc(e.defaultReps)}"></div></div><button class="btn" onclick="savePlanExercise(${day},'${id}')">Guardar ejercicio</button></div>`)}
function savePlanExercise(day,id){const p=getPlan(day);const data={name:document.getElementById('planExName').value||'Ejercicio',sets:Number(document.getElementById('planSets').value||3),defaultReps:document.getElementById('planReps').value||'',notes:''}; if(id){Object.assign(p.exercises.find(x=>x.id===id),data)}else p.exercises.push({id:uid(),...data}); save(); closeModal(); renderGym()}
function deletePlanExercise(day,id){if(!confirm('¿Eliminar del plan semanal?'))return;const p=getPlan(day);p.exercises=p.exercises.filter(e=>e.id!==id);save();renderGym()}
function openExerciseLogModal(ei=null,replace=false){const l=ensureLog();const e=ei!==null?l.exercises[ei]:{name:'',sets:[{n:1,weight:'',reps:'',done:false}],extra:true};openModal(`<div class="row"><h2>${replace?'Reemplazar ejercicio':ei!==null?'Editar ejercicio':'Agregar ejercicio'}</h2><button class="icon" onclick="closeModal()">×</button></div><div class="form"><div class="suggestions"><label>Ejercicio</label><input id="logExName" value="${esc(e.name)}" oninput="showSuggest(this.value,'logSug','logExName')"><div id="logSug" class="suggestion-list hidden"></div></div><div><label>Cantidad de series</label><input id="logSets" type="number" min="1" value="${e.sets.length||3}"></div><button class="btn" onclick="saveLogExercise(${ei===null?-1:ei})">Guardar ejercicio</button></div>`)}
function saveLogExercise(ei){const l=ensureLog();const name=document.getElementById('logExName').value||'Ejercicio';const count=Number(document.getElementById('logSets').value||3);const newSets=Array.from({length:count},(_,i)=>({n:i+1,weight:'',reps:'',done:false})); if(ei<0)l.exercises.push({id:uid(),name,sets:newSets,extra:true,removed:false}); else {l.exercises[ei].name=name; const old=l.exercises[ei].sets||[]; l.exercises[ei].sets=Array.from({length:count},(_,i)=>old[i]||{n:i+1,weight:'',reps:'',done:false}); l.exercises[ei].sets.forEach((s,i)=>s.n=i+1)} save(); closeModal(); renderGym()}
function showSuggest(q,boxId,inputId){const box=document.getElementById(boxId);const nq=norm(q); if(!nq){box.classList.add('hidden');return} const hits=SUGGESTIONS.filter(s=>norm(s).includes(nq)).slice(0,12); box.innerHTML=hits.map(h=>`<div class="suggestion" onclick="document.getElementById('${inputId}').value='${esc(h)}';document.getElementById('${boxId}').classList.add('hidden')">${esc(h)}</div>`).join(''); box.classList.toggle('hidden',!hits.length)}
function openBodyModal(){openModal(`<div class="row"><h2>Dato corporal</h2><button class="icon" onclick="closeModal()">×</button></div><div class="form"><div><label>Fecha</label><input id="bDate" type="date" value="${todayKey()}"></div><div class="grid grid2"><div><label>Peso</label><input id="bWeight" inputmode="decimal"></div><div><label>% grasa</label><input id="bFat" inputmode="decimal"></div></div><button class="btn" onclick="saveBody()">Guardar dato</button></div>`)}
function saveBody(){state.body.push({id:uid(),date:document.getElementById('bDate').value||todayKey(),weight:document.getElementById('bWeight').value,fat:document.getElementById('bFat').value});save();closeModal();renderStats()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='muvit-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=migrate(JSON.parse(r.result));save();closeModal();render();toast('Datos importados')}catch(err){alert('No se pudo importar el archivo')}};r.readAsText(f)}
function resetApp(){if(!confirm('¿Borrar todos los datos de MUVIT en este celular?'))return;localStorage.removeItem(KEY);state=defaults();save();closeModal();render();toast('App reiniciada')}

render();
</script>
</body>
</html>
